            rounds:
              - now: 1000000
                actions:
                  - {execute: {marker: "prepare"}}
                  - {query: {marker: "read.items", scope: "schema"}, rows: []}
                  - {query: {listing: "indexes.RANGE_INDEX"}, failed: [{message: "There is no procedure with the name `vector_search.show_index_info` registered"}]}
              - now: 1000000
                actions:
                  - {execute: {create: "Range index"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}]}
              - now: 1000000
                actions:
                  - {writeMarker: {scope: "schema", version: null, items: "RANGE_INDEX:Person:name:Person_name_range"}}
            done: 1000000
            report:
              owners:
                - {owner: null, results: [{spec: "Range index", created: {kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}}], marker: {version: null, items: "RANGE_INDEX:Person:name:Person_name_range"}}
              log:
                - ["INFO", "SchemaManager", "Applying schema for owner 'schema' on 'default': 1 items (forceRecreate=false, versionChanged=false, version=null)"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[name]"]
                - ["INFO", "SchemaManager", "Schema for owner 'schema' on 'default': 1 created, 0 already matching, 0 recreated, 0 needing attention"]
