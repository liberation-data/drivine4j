      # The image is the one PostgresTestContainer names. It has no pin: a pull request's run takes it as well.
      - name: Pull the image and say which release it is
        run: scripts/report-test-images.sh pgvector/pgvector:pg17

      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      - name: Run the sample app's stateless tests on Postgres
        run: |
