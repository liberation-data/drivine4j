                             'nodes' VALUE JSON_ARRAYAGG(JSON_OBJECT('elementId' VALUE nid, 'my id' VALUE i) ORDER BY nid RETURNING JSON) RETURNING JSON)
          FROM (SELECT n.nid, COALESCE(JSON_VALUE(n.props, '$."address.city".v'), JSON_VALUE(n.props, '$."address.city"')) AS k0, COALESCE(JSON_VALUE(n.props, '$."o''name".v'), JSON_VALUE(n.props, '$."o''name"')) AS k1, JSON_VALUE(n.props, '$."my id"') AS i, COUNT(*) OVER (PARTITION BY COALESCE(JSON_VALUE(n.props, '$."address.city".v'), JSON_VALUE(n.props, '$."address.city"')), COALESCE(JSON_VALUE(n.props, '$."o''name".v'), JSON_VALUE(n.props, '$."o''name"'))) AS c, ROW_NUMBER() OVER (PARTITION BY COALESCE(JSON_VALUE(n.props, '$."address.city".v'), JSON_VALUE(n.props, '$."address.city"')), COALESCE(JSON_VALUE(n.props, '$."o''name".v'), JSON_VALUE(n.props, '$."o''name"')) ORDER BY n.nid) AS r
                FROM drivine_node n
                WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "Person")') AND COALESCE(JSON_VALUE(n.props, '$."address.city".v'), JSON_VALUE(n.props, '$."address.city"')) IS NOT NULL AND COALESCE(JSON_VALUE(n.props, '$."o''name".v'), JSON_VALUE(n.props, '$."o''name"')) IS NOT NULL)
          WHERE c > 1 AND r <= 5
          GROUP BY k0, k1
          FETCH FIRST 5 ROWS ONLY
        sqlite: |-
          /* drivine:json */
          SELECT json_object('properties', json_object('address.city', k.k0, 'o''name', k.k1), 'count', MAX(k.total),
                             'nodes', json_group_array(json_object('elementId', k.nid, 'my id', k.sampled) ORDER BY k.nid) FILTER (WHERE k.position <= 5))
          FROM (
              SELECT n.nid, (CASE json_type(n.props, '$."address.city"') WHEN 'text' THEN n.props ->> '$."address.city"' WHEN 'null' THEN NULL ELSE n.props -> '$."address.city"' END) AS k0, (CASE json_type(n.props, '$."o''name"') WHEN 'text' THEN n.props ->> '$."o''name"' WHEN 'null' THEN NULL ELSE n.props -> '$."o''name"' END) AS k1, (CASE json_type(n.props, '$."my id"') WHEN 'text' THEN n.props ->> '$."my id"' WHEN 'null' THEN NULL ELSE n.props -> '$."my id"' END) AS sampled,
                     row_number() OVER (PARTITION BY (CASE json_type(n.props, '$."address.city"') WHEN 'text' THEN n.props ->> '$."address.city"' WHEN 'null' THEN NULL ELSE n.props -> '$."address.city"' END), (CASE json_type(n.props, '$."o''name"') WHEN 'text' THEN n.props ->> '$."o''name"' WHEN 'null' THEN NULL ELSE n.props -> '$."o''name"' END) ORDER BY n.nid) AS position,
                     COUNT(*) OVER (PARTITION BY (CASE json_type(n.props, '$."address.city"') WHEN 'text' THEN n.props ->> '$."address.city"' WHEN 'null' THEN NULL ELSE n.props -> '$."address.city"' END), (CASE json_type(n.props, '$."o''name"') WHEN 'text' THEN n.props ->> '$."o''name"' WHEN 'null' THEN NULL ELSE n.props -> '$."o''name"' END)) AS total
              FROM drivine_node n
              WHERE instr(n.labels, '"Person"') > 0 AND (CASE json_type(n.props, '$."address.city"') WHEN 'text' THEN n.props ->> '$."address.city"' WHEN 'null' THEN NULL ELSE n.props -> '$."address.city"' END) IS NOT NULL AND (CASE json_type(n.props, '$."o''name"') WHEN 'text' THEN n.props ->> '$."o''name"' WHEN 'null' THEN NULL ELSE n.props -> '$."o''name"' END) IS NOT NULL
          ) k
          WHERE k.total > 1
          GROUP BY k0, k1
          LIMIT 5
    - spec: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], ignoreCase: true}
      limit: 10
      refilled: true
      stores:
        neo4j: |-
          MATCH (n:Person)
          WHERE n.`__drivine.lower.email` IS NOT NULL
          WITH n.`__drivine.lower.email` AS _k0, count(*) AS _count, collect({elementId: elementId(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {`__drivine.lower.email`: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        neo4j4: |-
          MATCH (n:Person)
          WHERE n.`__drivine.lower.email` IS NOT NULL
          WITH n.`__drivine.lower.email` AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {`__drivine.lower.email`: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        memgraph: |-
          MATCH (n:Person)
          WHERE n.`__drivine.lower.email` IS NOT NULL
          WITH n.`__drivine.lower.email` AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {`__drivine.lower.email`: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        falkordb: |-
          MATCH (n:Person)
          WHERE n.`__drivine.lower.email` IS NOT NULL
          WITH n.`__drivine.lower.email` AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {`__drivine.lower.email`: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        postgres: |-
          SELECT jsonb_build_object('properties', jsonb_build_object('__drivine.lower.email', lower((n.props ->> 'email'))), 'count', COUNT(*),
                                    'nodes', to_jsonb((array_agg(jsonb_build_object('elementId', n.nid) ORDER BY n.nid))[1:10]))
          FROM drivine_node n
          WHERE n.labels @> '["Person"]' AND lower((n.props ->> 'email')) IS NOT NULL
          GROUP BY lower((n.props ->> 'email'))
          HAVING COUNT(*) > 1
          LIMIT 10
        oracle: |-
          SELECT JSON_OBJECT('properties' VALUE JSON_OBJECT('__drivine.lower.email' VALUE k0), 'count' VALUE MAX(c),
                             'nodes' VALUE JSON_ARRAYAGG(JSON_OBJECT('elementId' VALUE nid) ORDER BY nid RETURNING JSON) RETURNING JSON)
          FROM (SELECT n.nid, LOWER(JSON_VALUE(n.props, '$.email')) AS k0, COUNT(*) OVER (PARTITION BY LOWER(JSON_VALUE(n.props, '$.email'))) AS c, ROW_NUMBER() OVER (PARTITION BY LOWER(JSON_VALUE(n.props, '$.email')) ORDER BY n.nid) AS r
                FROM drivine_node n
                WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "Person")') AND LOWER(JSON_VALUE(n.props, '$.email')) IS NOT NULL)
          WHERE c > 1 AND r <= 10
          GROUP BY k0
          FETCH FIRST 10 ROWS ONLY
        sqlite: |-
          /* drivine:json */
          SELECT json_object('properties', json_object('__drivine.lower.email', k.k0), 'count', MAX(k.total),
                             'nodes', json_group_array(json_object('elementId', k.nid) ORDER BY k.nid) FILTER (WHERE k.position <= 10))
          FROM (
              SELECT n.nid, drivine_lower((CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END)) AS k0,
                     row_number() OVER (PARTITION BY drivine_lower((CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END)) ORDER BY n.nid) AS position,
                     COUNT(*) OVER (PARTITION BY drivine_lower((CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END))) AS total
              FROM drivine_node n
              WHERE instr(n.labels, '"Person"') > 0 AND drivine_lower((CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END)) IS NOT NULL
          ) k
          WHERE k.total > 1
          GROUP BY k0
          LIMIT 10
listings:
  - name: "A vector index, as Neo4j 5 reports it"
    listing: "indexes"
    rows:
      - name: "prop_embedding_vector"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Proposition"]
        properties: ["embedding"]
        options:
          indexProvider: "vector-2.0"
          indexConfig: {"vector.dimensions": 1536, "vector.similarity_function": "COSINE"}
    stores:
      neo4j:
        items:
          - kind: "VECTOR_INDEX"
            label: "Proposition"
            properties: ["embedding"]
            name: "prop_embedding_vector"
            dimensions: 1536
            similarity: "COSINE"
        aliases: [[]]
  - name: "A vector index with its quantization and HNSW parameters, as Neo4j up to 2026.05 reports them"
    listing: "indexes"
    rows:
      - name: "chunk_vec"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["vec"]
        options:
          indexConfig:
            "vector.dimensions": 8
            "vector.similarity_function": "euclidean"
            "vector.quantization.enabled": true
            "vector.hnsw.m": 16
            "vector.hnsw.ef_construction": 100
    stores:
      neo4j:
        items:
          - kind: "VECTOR_INDEX"
            label: "Chunk"
            properties: ["vec"]
            name: "chunk_vec"
            dimensions: 8
            similarity: "EUCLIDEAN"
            quantizationEnabled: true
            hnswM: 16
            hnswEfConstruction: 100
        aliases: [[]]
  - name: "Quantization by its type, as Neo4j 2026.06 and later report it"
    listing: "indexes"
    rows:
      - name: "a"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["a"]
        options:
          indexConfig:
            "vector.dimensions": 4
            "vector.similarity_function": "COSINE"
            "vector.quantization.type": "NONE"
            "vector.quantization.enabled": true
      - name: "b"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["b"]
        options:
          indexConfig:
            "vector.dimensions": 4
            "vector.similarity_function": "COSINE"
            "vector.quantization.type": "scalar"
      - name: "d"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["d"]
        options: {indexConfig: {"vector.dimensions": 4, "vector.similarity_function": "COSINE", "vector.quantization.type": "none"}}
      - name: "c"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["c"]
        options: {indexConfig: {"vector.dimensions": 4, "vector.similarity_function": "DOT_PRODUCT"}}
    stores:
      neo4j:
        items:
          - kind: "VECTOR_INDEX"
            label: "Chunk"
            properties: ["a"]
            name: "a"
            dimensions: 4
            similarity: "COSINE"
            quantizationEnabled: false
          - kind: "VECTOR_INDEX"
            label: "Chunk"
            properties: ["b"]
            name: "b"
            dimensions: 4
            similarity: "COSINE"
            quantizationEnabled: true
          - kind: "VECTOR_INDEX"
            label: "Chunk"
            properties: ["d"]
            name: "d"
            dimensions: 4
            similarity: "COSINE"
            quantizationEnabled: false
          - {kind: "VECTOR_INDEX", label: "Chunk", properties: ["c"], name: "c", dimensions: 4}
        aliases: [[], [], [], []]
  - name: "Numbers a driver gives with a fraction, read as whole numbers"
    listing: "indexes"
    rows:
      - name: "f"
        type: "VECTOR"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["vec"]
        options:
          indexConfig:
            "vector.dimensions": 8.0
            "vector.similarity_function": "COSINE"
            "vector.hnsw.m": 16.0
            "vector.hnsw.ef_construction": 100.0
    stores:
      neo4j:
        items:
          - kind: "VECTOR_INDEX"
            label: "Chunk"
            properties: ["vec"]
            name: "f"
            dimensions: 8
            similarity: "COSINE"
            hnswM: 16
            hnswEfConstruction: 100
        aliases: [[]]
  - name: "Every kind Drivine manages, and those it does not"
    listing: "indexes"
    rows:
      - name: "prop_ctx"
        type: "RANGE"
        entityType: "NODE"
        labelsOrTypes: ["Proposition"]
        properties: ["contextId"]
        options: null
      - name: "old_ctx"
        type: "BTREE"
        entityType: "NODE"
        labelsOrTypes: ["Proposition"]
        properties: ["createdAt", "contextId"]
        options: {indexConfig: {}}
      - name: "doc_text_fulltext"
        type: "FULLTEXT"
        entityType: "NODE"
        labelsOrTypes: ["Doc"]
        properties: ["title", "body"]
        options: {indexConfig: {"fulltext.analyzer": "english"}}
      - name: "chunk_title_text"
        type: "TEXT"
        entityType: "NODE"
        labelsOrTypes: ["Chunk"]
        properties: ["title"]
        options: {indexProvider: "text-2.0", indexConfig: {}}
      - {name: "token_lookup", type: "LOOKUP", entityType: "NODE", labelsOrTypes: null, properties: null, options: null}
      - name: "point_idx"
        type: "POINT"
        entityType: "NODE"
        labelsOrTypes: ["Place"]
        properties: ["location"]
        options: null
      - name: "rel_idx"
        type: "RANGE"
        entityType: "RELATIONSHIP"
        labelsOrTypes: ["KNOWS"]
        properties: ["since"]
        options: null
      - {name: "no_label", type: "RANGE", entityType: "NODE", labelsOrTypes: [], properties: ["x"], options: null}
      - "not a row"
      - null
    stores:
      neo4j:
        items:
          - {kind: "RANGE_INDEX", label: "Proposition", properties: ["contextId"], name: "prop_ctx"}
          - {kind: "RANGE_INDEX", label: "Proposition", properties: ["createdAt", "contextId"], name: "old_ctx"}
          - kind: "FULLTEXT_INDEX"
            label: "Doc"
            properties: ["title", "body"]
            name: "doc_text_fulltext"
            analyzer: "english"
          - {kind: "TEXT_INDEX", label: "Chunk", properties: ["title"], name: "chunk_title_text"}
        aliases: [[], [], [], []]
  - name: "Uniqueness constraints, as each Neo4j names them, and the constraints Drivine does not manage"
    listing: "constraints"
    rows:
      - name: "session_unique"
        type: "UNIQUENESS"
        entityType: "NODE"
        labelsOrTypes: ["ChatSession"]
        properties: ["sessionId"]
      - name: "member_unique"
        type: "NODE_PROPERTY_UNIQUENESS"
        entityType: "NODE"
        labelsOrTypes: ["Membership"]
        properties: ["tenantId", "userId"]
      - name: "existence"
        type: "NODE_PROPERTY_EXISTENCE"
        entityType: "NODE"
        labelsOrTypes: ["ChatSession"]
        properties: ["createdAt"]
      - {name: "key", type: "NODE_KEY", entityType: "NODE", labelsOrTypes: ["User"], properties: ["email"]}
      - name: "rel_unique"
        type: "RELATIONSHIP_PROPERTY_UNIQUENESS"
        entityType: "RELATIONSHIP"
        labelsOrTypes: ["KNOWS"]
        properties: ["id"]
      - "not a row"
    stores:
      neo4j:
        items:
          - {kind: "UNIQUENESS_CONSTRAINT", label: "ChatSession", properties: ["sessionId"], name: "session_unique"}
          - kind: "UNIQUENESS_CONSTRAINT"
            label: "Membership"
            properties: ["tenantId", "userId"]
            name: "member_unique"
        aliases: [[], []]
  - name: "Vector indexes, from vector_search.show_index_info(), bare and with Memgraph 3.11's colon"
    listing: "indexes"
    rows:
      - index_name: "prop_embedding_vector"
        label: "Proposition"
        property: "embedding"
        dimension: 1536
        metric: "cos"
      - {index_name: "doc_vec", label: ":Doc", property: "vec", dimension: 3, metric: "l2sq"}
      - {index_name: "other", label: "Doc", property: "other", dimension: 3, metric: "ip"}
      - {index_name: "no_property", label: "Doc", dimension: 3, metric: "cos"}
    stores:
      memgraph:
        items:
          - kind: "VECTOR_INDEX"
            label: "Proposition"
            properties: ["embedding"]
            name: "prop_embedding_vector"
            dimensions: 1536
            similarity: "COSINE"
          - kind: "VECTOR_INDEX"
            label: "Doc"
            properties: ["vec"]
            name: "doc_vec"
            dimensions: 3
            similarity: "EUCLIDEAN"
          - {kind: "VECTOR_INDEX", label: "Doc", properties: ["other"], name: "other", dimensions: 3}
        aliases: [[], [], []]
  - name: "SHOW INDEX INFO: range, composite, label-only, a vector's backing, and text indexes"
    listing: "indexes"
    rows:
      - ["label+property", "Proposition", "contextId", 0]
      - ["label", "Proposition", null, 10]
      - ["label+property", ":Message", ["sessionId", "createdAt"], 0]
      - ["label+property_vector", ":Proposition", "embedding", 0]
      - ["label_text (name: chunk_ft)", "Chunk", ["title", "body"], 0]
      - ["label_text (name: doc_ft)", ":Doc", "title", 0]
      - ["label+property", "Short"]
      - ["label+property", "Empty", [], 0]
      - "not a row"
    stores:
      memgraph:
        items:
          - {kind: "RANGE_INDEX", label: "Proposition", properties: ["contextId"]}
          - {kind: "RANGE_INDEX", label: "Message", properties: ["sessionId", "createdAt"]}
          - {kind: "FULLTEXT_INDEX", label: "Chunk", properties: ["title", "body"], name: "chunk_ft"}
          - {kind: "FULLTEXT_INDEX", label: "Doc", properties: ["title"], name: "doc_ft"}
        aliases: [[], [], [], []]
  - name: "SHOW CONSTRAINT INFO: unique over one and several properties, and constraints Drivine does not manage"
    listing: "constraints"
    rows:
      - ["unique", "ChatSession", "sessionId"]
      - ["unique", ":Membership", ["tenantId", "userId"]]
      - ["exists", "ChatSession", "createdAt"]
      - ["unique", "Short"]
      - {type: "unique"}
    stores:
      memgraph:
        items:
          - {kind: "UNIQUENESS_CONSTRAINT", label: "ChatSession", properties: ["sessionId"]}
          - {kind: "UNIQUENESS_CONSTRAINT", label: "Membership", properties: ["tenantId", "userId"]}
        aliases: [[], []]
  - name: "One label's row: range properties together, and a vector index for each vector property, FalkorDB 4's options per property"
