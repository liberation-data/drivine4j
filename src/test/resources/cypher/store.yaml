# The store layout's DDL: what each store makes of the graph `drivine` and of a set of schema specs, the tables, the
# probe that finds them made, each index and constraint, and the catalog's statements. Captured from drivine4j's grammars,
# the reference, before the module wrote them. Read with no store. See README.md.

graph: "drivine"
tables:
  postgres:
    ddl:
      - |-
        CREATE TABLE IF NOT EXISTS drivine_node (
            nid    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            labels jsonb NOT NULL,
            props  jsonb NOT NULL,
            stamp  varchar(33)
        )
      - |-
        CREATE TABLE IF NOT EXISTS drivine_edge (
            eid   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            src   bigint NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
            dst   bigint NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
            type  varchar(128) NOT NULL,
            props jsonb NOT NULL DEFAULT '{}'
        )
      - |-
        CREATE TABLE IF NOT EXISTS drivine_schema (
            kind        varchar(40) NOT NULL,
            label       varchar(400) NOT NULL,
            properties  varchar(2000) NOT NULL,
            name        varchar(400),
            object_name varchar(63),
            details     jsonb NOT NULL,
            PRIMARY KEY (kind, label, properties)
        )
      - "CREATE INDEX IF NOT EXISTS drivine_edge_src ON drivine_edge (src, type)"
      - "CREATE INDEX IF NOT EXISTS drivine_edge_dst ON drivine_edge (dst, type)"
      - "CREATE INDEX IF NOT EXISTS drivine_node_labels ON drivine_node USING GIN (labels jsonb_path_ops)"
      - |-
        CREATE OR REPLACE FUNCTION drivine_find(p_labels jsonb, p_key text, p_id text) RETURNS drivine_node AS $fn$
        DECLARE
            -- The lookup of a shape is prepared once a session and run by name after: written for the shape, it
            -- is planned for its label and property, and planned again each time it would cost a lookup several
            -- times over. The name is a hash of what the lookup is for, so it fits whatever the graph is called.
            v_name  text := 'drivine_find_' || md5('drivine' || ' ' || p_key || ' ' || p_labels::text);
            v_nid   bigint;
            v_row   drivine_node;
        BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_prepared_statements WHERE name = v_name) THEN
                -- Each label is a test of its own, as a statement writes it, so a partial index over one is used.
                EXECUTE format('PREPARE %I (text) AS SELECT min(n.nid) FROM drivine_node n WHERE (n.props ->> %L) = $1', v_name, p_key) ||
                    COALESCE((SELECT string_agg(format(' AND n.labels @> %L::jsonb', jsonb_build_array(l)), '') FROM jsonb_array_elements_text(p_labels) l), '');
            END IF;
            LOOP
                EXECUTE format('EXECUTE %I(%L)', v_name, p_id) INTO v_nid;
                IF v_nid IS NULL THEN
                    RETURN NULL;
                END IF;
                SELECT * INTO v_row FROM drivine_node n WHERE n.nid = v_nid FOR UPDATE;
                -- Locked: is it still the node that was looked for? Another writer may have changed it meanwhile.
                IF FOUND AND v_row.props ->> p_key = p_id AND v_row.labels @> p_labels THEN
                    RETURN v_row;
                END IF;
            END LOOP;
        END
        $fn$ LANGUAGE plpgsql
      - |-
        CREATE OR REPLACE FUNCTION drivine_owns(p_bag jsonb, p_key text) RETURNS boolean AS $fn$
        DECLARE
            v_prefix   text := p_bag ->> 'prefix';
            v_reserved text;
        BEGIN
            -- A bag with a prefix owns the keys that begin with it; a flat bag, each key that is no one else's.
            IF NOT COALESCE((p_bag ->> 'flat')::boolean, false) THEN
                RETURN length(p_key) > COALESCE(length(v_prefix), 0) AND (v_prefix IS NULL OR left(p_key, length(v_prefix)) = v_prefix);
            END IF;
            IF COALESCE(p_bag -> 'reservedKeys', '[]'::jsonb) @> to_jsonb(p_key) THEN
                RETURN false;
            END IF;
            FOR v_reserved IN SELECT jsonb_array_elements_text(COALESCE(p_bag -> 'reservedPrefixes', '[]'::jsonb)) LOOP
                IF left(p_key, length(v_reserved)) = v_reserved THEN
                    RETURN false;
                END IF;
            END LOOP;
            RETURN true;
        END
        $fn$ LANGUAGE plpgsql IMMUTABLE
      - |-
        CREATE OR REPLACE FUNCTION drivine_lowered(p_props jsonb, p_keys jsonb) RETURNS jsonb AS $fn$
        DECLARE
            v_props jsonb := p_props;
            v_key   text;
        BEGIN
            FOR v_key IN SELECT jsonb_array_elements_text(COALESCE(p_keys, '[]'::jsonb)) LOOP
                IF v_props ->> v_key IS NULL THEN
                    v_props := v_props - ('__drivine.lower.' || v_key);
                ELSE
                    v_props := v_props || jsonb_build_object('__drivine.lower.' || v_key, lower(v_props ->> v_key));
                END IF;
            END LOOP;
            RETURN v_props;
        END
        $fn$ LANGUAGE plpgsql STABLE
      - |-
        CREATE OR REPLACE FUNCTION drivine_write(p_plan jsonb, p_shapes jsonb, p_mark text, p_returns text, p_patched_if text) RETURNS SETOF text AS $fn$
        DECLARE
            v_op        jsonb;
            v_shape     jsonb;
            v_nodes     bigint[] := '{}';
            v_h_index   text[] := '{}';
            v_h_found   text[] := '{}';
            v_h_node    bigint[] := '{}';
            v_relinks   bigint[] := '{}';
            v_root      bigint;
            v_root_made boolean := false;
            v_was       text;
            v_carried   text;
            v_stamp     text;
            v_count     bigint := 0;
            v_result    text;
            v_each      text[] := '{}';
            v_stale     boolean := false;
            -- A node step's.
            v_row       drivine_node;
            v_nid       bigint;
            v_found     text;
            v_two       text;
            v_labels    jsonb;
            v_o         jsonb;
            v_expect    text;
            v_fresh     text;
            v_add       jsonb;
            v_drop      jsonb;
            v_made      boolean;
            v_tries     int;
            v_relabel   boolean;
            v_bag       jsonb;
            v_key       text;
            v_owned     jsonb;
            v_recorded  jsonb;
            v_now       jsonb;
            v_same      boolean;
            v_copied    jsonb;
            v_met       bigint;
            v_premade   jsonb := '{}';
            v_after     jsonb;
            v_pre       bigint;
            v_s         int;
            v_premade_as text;
            -- A relationship step's.
            v_from      bigint;
            v_to        bigint;
            v_type      text;
            v_dir       text;
            v_props     jsonb;
            v_clear     jsonb;
            v_e         record;
            v_x         jsonb;
            v_seen      int;
            v_unchanged int;
            v_ids       jsonb;
            v_held      jsonb;
            v_keep      boolean;
            v_delete    boolean;
            v_gone      bigint[];
            v_targets   bigint[];
            v_keys      text[];
            v_target    bigint;
            v_refs      bigint;
            v_removed   bigint;
        BEGIN
            BEGIN
                -- The nodes the plan makes, made together. A `node` step that does no more than write properties,
                -- with no stamp to check, no property bag to clear and no labels to own, makes its node by an
                -- insert alone when the node is not there; so for each shape the nodes of such steps that are not
                -- there are found by one lookup and inserted by one statement, the first step for each id only. A
                -- node a uniqueness constraint refuses, made by another writer at this moment, is not inserted
                -- here: its step finds it, or is refused, as it would be on its own. What each made gets is in
                -- `v_premade`, by shape and id, for its step to take below.
                -- Only where a shape has several such steps: for one node, the lookup and insert of its step are as cheap.
                FOR v_s IN
                    SELECT (op ->> 's')::int FROM jsonb_array_elements(p_plan) op
                    WHERE op ->> 'op' = 'node' AND op -> 'expect' IS NULL AND COALESCE((op ->> 'create')::boolean, true) AND op -> 'bags' IS NULL AND op -> 'owned' IS NULL AND op -> 'add' IS NULL AND op -> 'drop' IS NULL
                    GROUP BY 1 HAVING count(*) > 1
                LOOP
                    v_shape := p_shapes -> v_s;
                    -- Prepared once a session for the shape, as a lookup is, and run by name after: planned afresh,
                    -- it costs more than it saves a save of a few nodes. The name holds the store's version too, so
                    -- a session that outlives an upgrade does not run what an earlier version prepared.
                    v_premade_as := 'drivine_made_' || md5('drivine:7 drivine' || ' ' || (v_shape ->> 'key') || ' ' || (v_shape -> 'labels')::text);
                    IF NOT EXISTS (SELECT 1 FROM pg_prepared_statements WHERE name = v_premade_as) THEN
                        EXECUTE format('PREPARE %I (jsonb, int) AS ', v_premade_as) || format($made$
                            WITH steps AS (
                                SELECT DISTINCT ON (op ->> 'k') ord, op FROM jsonb_array_elements($1) WITH ORDINALITY AS t (op, ord)
                                WHERE op ->> 'op' = 'node' AND (op ->> 's')::int = $2 AND op -> 'expect' IS NULL AND COALESCE((op ->> 'create')::boolean, true) AND op -> 'bags' IS NULL AND op -> 'owned' IS NULL AND op -> 'add' IS NULL AND op -> 'drop' IS NULL
                                ORDER BY op ->> 'k', ord),
                            absent AS (
                                SELECT s.ord, s.op FROM steps s
                                WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE (n.props ->> %L) = s.op ->> 'k'%s)),
                            made AS (
                                INSERT INTO drivine_node (labels, props, stamp)
                                SELECT op -> 'labels',
                                       drivine_lowered((jsonb_build_object(op ->> 'key', op -> 'id') || COALESCE(op -> 'set', '{}'::jsonb))
                                           - ARRAY(SELECT jsonb_array_elements_text(COALESCE(op -> 'unset', '[]'::jsonb))), op -> 'lower'),
                                       op ->> 'fresh'
                                FROM absent ORDER BY ord
                                ON CONFLICT DO NOTHING
                                RETURNING nid, props ->> %L AS k)
                            SELECT COALESCE(jsonb_object_agg(k, nid), '{}'::jsonb) FROM made
                        $made$, v_shape ->> 'key',
                            COALESCE((SELECT string_agg(format(' AND n.labels @> %L::jsonb', jsonb_build_array(l)), '') FROM jsonb_array_elements_text(v_shape -> 'labels') l), ''),
                            v_shape ->> 'key');
                    END IF;
                    EXECUTE format('EXECUTE %I(%L, %s)', v_premade_as, p_plan, v_s) INTO v_after;
                    v_premade := v_premade || jsonb_build_object(v_s::text, v_after);
                END LOOP;

                FOR v_op IN SELECT value FROM jsonb_array_elements(p_plan) LOOP
                    CASE v_op ->> 'op'
                    WHEN 'node' THEN
                        -- Saves a node: found and locked, or made. What the step writes is worked out over the node as
                        -- it was found, and the node is written only where that differs from what it holds.
                        v_shape := p_shapes -> ((v_op ->> 's')::int);
                        v_expect := v_op ->> 'expect';
                        v_fresh := v_op ->> 'fresh';
                        v_tries := 0;
                        -- A node made with the others above is this step's, once: a later step for the same id finds it.
                        v_pre := (v_premade -> (v_op ->> 's') ->> (v_op ->> 'k'))::bigint;
                        IF v_pre IS NOT NULL THEN
                            v_premade := v_premade #- ARRAY[v_op ->> 's', v_op ->> 'k'];
                            v_nid := v_pre;
                            v_made := true;
                            v_found := NULL;
                        END IF;
                        WHILE v_pre IS NULL LOOP
                            v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');
                            v_made := v_row.nid IS NULL;
                            IF v_made THEN
                                -- A checked save does not make the node again: it is gone, and the object is stale.
                                -- Nor does a step that makes no node.
                                IF v_expect IS NOT NULL OR NOT COALESCE((v_op ->> 'create')::boolean, true) THEN
                                    RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';
                                END IF;
                                v_labels := v_op -> 'labels';
                                v_o := jsonb_build_object(v_op ->> 'key', v_op -> 'id');
                                v_stamp := NULL;
                            ELSIF COALESCE((v_op ->> 'absent')::boolean, false) THEN
                                -- A step that only makes the node writes nothing to one that is there.
                                RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';
                            ELSE
                                v_labels := v_row.labels;
                                v_o := v_row.props;
                                v_stamp := v_row.stamp;
                            END IF;
                            v_found := v_stamp;
                            IF v_expect IS NOT NULL AND (v_stamp IS NULL OR
                                    CASE WHEN COALESCE((v_op ->> 'whole')::boolean, false) THEN v_stamp ELSE substr(v_stamp, 1, 16) END <> v_expect) THEN
                                RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';
                            END IF;

                            -- The properties the step sets, and without those it unsets.
                            v_o := (v_o || COALESCE(v_op -> 'set', '{}'::jsonb)) - ARRAY(SELECT jsonb_array_elements_text(COALESCE(v_op -> 'unset', '[]'::jsonb)));
                            -- The keys of each property bag the object no longer holds.
                            FOR v_bag IN SELECT value FROM jsonb_array_elements(COALESCE(v_op -> 'bags', '[]'::jsonb)) LOOP
                                FOR v_key IN SELECT jsonb_object_keys(v_o) LOOP
                                    IF NOT COALESCE(v_bag -> 'keep', '[]'::jsonb) @> to_jsonb(v_key) AND drivine_owns(v_bag, v_key) THEN
                                        v_o := v_o - v_key;
                                    END IF;
                                END LOOP;
                            END LOOP;

                            -- The labels an open label field holds are recorded on the node, so the node knows which are
                            -- its own. A step that clears replaces the record, and drops the labels recorded that the
                            -- field no longer holds, but for those of the class; one that does not adds to the record.
                            v_add := COALESCE(v_op -> 'add', '[]'::jsonb);
                            v_drop := COALESCE(v_op -> 'drop', '[]'::jsonb);
                            v_owned := v_op -> 'owned';
                            IF v_owned IS NOT NULL THEN
                                v_recorded := v_o -> (v_owned ->> 'prop');
                                IF v_recorded IS NULL OR jsonb_typeof(v_recorded) <> 'array' THEN
                                    v_recorded := '[]'::jsonb;
                                END IF;
                                IF COALESCE((v_owned ->> 'clear')::boolean, false) THEN
                                    v_drop := v_drop || COALESCE((
                                        SELECT jsonb_agg(l) FROM jsonb_array_elements_text(v_recorded) l
                                        WHERE NOT v_add @> to_jsonb(l) AND NOT COALESCE(v_owned -> 'base', '[]'::jsonb) @> to_jsonb(l)), '[]'::jsonb);
                                    IF jsonb_array_length(v_add) = 0 THEN
                                        v_o := v_o - (v_owned ->> 'prop');
                                    ELSE
                                        v_o := v_o || jsonb_build_object(v_owned ->> 'prop', v_add);
                                    END IF;
                                ELSIF jsonb_array_length(v_add) > 0 THEN
                                    v_o := v_o || jsonb_build_object(v_owned ->> 'prop', COALESCE((
                                        SELECT jsonb_agg(l ORDER BY l COLLATE "C") FROM jsonb_array_elements_text(v_recorded) l
                                        WHERE NOT v_add @> to_jsonb(l)), '[]'::jsonb) || v_add);
                                END IF;
                            END IF;

                            -- The node's labels with those the step adds and without those it drops, in order; labels
                            -- that are as they were are not written again.
                            v_relabel := false;
                            IF jsonb_array_length(v_add) > 0 OR jsonb_array_length(v_drop) > 0 THEN
                                v_now := COALESCE((
                                    SELECT jsonb_agg(l ORDER BY l COLLATE "C") FROM (
                                        SELECT jsonb_array_elements_text(v_labels) AS l UNION SELECT jsonb_array_elements_text(v_add)
                                    ) a WHERE NOT v_drop @> to_jsonb(l)), '[]'::jsonb);
                                v_relabel := NOT (v_now @> v_labels AND v_labels @> v_now);
                                IF v_relabel OR v_made THEN
                                    v_labels := v_now;
                                END IF;
                            END IF;

                            -- The copies are written from what the step leaves, and are no part of whether it changed the node.
                            v_copied := drivine_lowered(v_o, v_op -> 'lower');
                            IF v_made THEN
                                -- A node that is made is written once, whole, with a stamp of its own. A uniqueness
                                -- constraint may refuse it: once, it may be that another writer made the node at this
                                -- moment, and the node is looked for again. Found again or not, the constraint is on
                                -- something other than this node's key, and refuses this save.
                                v_stamp := v_fresh;
                                INSERT INTO drivine_node (labels, props, stamp) VALUES (v_labels, v_copied, v_stamp) ON CONFLICT DO NOTHING RETURNING nid INTO v_nid;
                                IF v_nid IS NOT NULL THEN
                                    EXIT;
                                END IF;
                                v_tries := v_tries + 1;
                                IF v_tries > 1 THEN
                                    INSERT INTO drivine_node (labels, props, stamp) VALUES (v_labels, v_copied, v_stamp);
                                END IF;
                            ELSE
                                v_nid := v_row.nid;
                                v_same := v_o = v_row.props;
                                -- A new first token only if the step changes the node, or the node has no stamp of two tokens yet.
                                v_two := CASE WHEN length(v_stamp) = 33 AND substr(v_stamp, 17, 1) = ':' THEN v_stamp END;
                                IF v_two IS NULL OR NOT v_same OR v_relabel THEN
                                    v_stamp := substr(v_fresh, 1, 16) || COALESCE(substr(v_two, 17), substr(v_fresh, 17));
                                    IF v_relabel THEN
                                        UPDATE drivine_node SET labels = v_labels WHERE nid = v_nid;
                                    END IF;
                                    IF v_copied <> v_row.props THEN
                                        UPDATE drivine_node SET props = v_copied, stamp = v_stamp WHERE nid = v_nid;
                                    ELSE
                                        UPDATE drivine_node SET stamp = v_stamp WHERE nid = v_nid;
                                    END IF;
                                ELSIF v_copied <> v_row.props THEN
                                    -- Only a copy was out of step with its property: the node keeps its stamp.
                                    UPDATE drivine_node SET props = v_copied WHERE nid = v_nid;
                                END IF;
                                EXIT;
                            END IF;
                        END LOOP;

                        v_nodes[(v_op ->> 'r')::int + 1] := v_nid;
                        IF v_op ->> 'i' IS NOT NULL THEN
                            v_h_index := array_append(v_h_index, v_op ->> 'i');
                            -- Nothing for a node the step made, and a mark for one that was there without a stamp.
                            v_h_found := array_append(v_h_found, CASE WHEN v_made THEN NULL ELSE COALESCE(v_found, '-') END);
                            v_h_node := array_append(v_h_node, v_nid);
                        END IF;
                        IF COALESCE((v_op ->> 'root')::boolean, false) THEN
                            v_root := v_nid;
                            v_root_made := v_made;
                            v_was := v_found;
                            v_carried := v_op ->> 'carried';
                        END IF;

                    WHEN 'ref' THEN
                        -- Finds a node that must be there, and locks it.
                        v_shape := p_shapes -> ((v_op ->> 's')::int);
                        v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');
                        IF v_row.nid IS NULL THEN
                            RAISE EXCEPTION 'absent' USING ERRCODE = 'P0D02';
                        END IF;
                        v_nodes[(v_op ->> 'r')::int + 1] := v_row.nid;

                    WHEN 'link' THEN
                        -- Joins two nodes. The relationship is as the step says only if every one of its type between them is.
                        v_from := v_nodes[(v_op ->> 'from')::int + 1];
                        v_to := v_nodes[(v_op ->> 'to')::int + 1];
                        v_type := v_op ->> 'type';
                        v_dir := v_op ->> 'dir';
                        v_props := COALESCE(v_op -> 'props', '{}'::jsonb);
                        v_clear := COALESCE(v_op -> 'clear', '[]'::jsonb);
                        v_seen := 0;
                        v_unchanged := 0;
                        IF NOT COALESCE((v_op ->> 'always')::boolean, false) THEN
                            -- A node's relationship to itself is one relationship, whichever way it is read.
                            FOR v_e IN
                                SELECT eid, props FROM drivine_edge
                                WHERE type = v_type AND (
                                    (v_dir IN ('OUT', 'BOTH') AND src = v_from AND dst = v_to)
                                    OR ((v_dir = 'IN' OR (v_dir = 'BOTH' AND v_from <> v_to)) AND src = v_to AND dst = v_from))
                                ORDER BY eid
                            LOOP
                                v_seen := v_seen + 1;
                                v_x := (v_e.props || v_props) - ARRAY(SELECT jsonb_array_elements_text(v_clear));
                                IF v_x = v_e.props THEN
                                    v_unchanged := v_unchanged + 1;
                                ELSE
                                    UPDATE drivine_edge SET props = v_x WHERE eid = v_e.eid;
                                END IF;
                            END LOOP;
                        END IF;
                        IF v_seen = 0 THEN
                            -- An undirected field is satisfied by a relationship either way, and makes one from the first node.
                            INSERT INTO drivine_edge (src, dst, type, props)
                            VALUES (CASE WHEN v_dir = 'IN' THEN v_to ELSE v_from END, CASE WHEN v_dir = 'IN' THEN v_from ELSE v_to END, v_type, v_props);
                        END IF;
                        IF v_seen = 0 OR v_unchanged < v_seen THEN
                            v_relinks := v_relinks || v_from || v_to;
                        END IF;
                        v_count := v_count + GREATEST(v_seen, 1);

                    WHEN 'unlink' THEN
                        -- Removes a field's relationships to the targets whose ids the step names, or to every target but those.
                        v_from := v_nodes[(v_op ->> 'from')::int + 1];
                        v_shape := p_shapes -> ((v_op ->> 's')::int);
                        v_type := v_op ->> 'type';
                        v_dir := v_op ->> 'dir';
                        v_ids := COALESCE(v_op -> 'ids', '[]'::jsonb);
                        v_held := COALESCE(v_op -> 'held', '[]'::jsonb);
                        v_keep := COALESCE((v_op ->> 'keep')::boolean, false);
                        v_delete := COALESCE((v_op ->> 'delete')::boolean, false);
                        v_gone := '{}';
                        v_targets := '{}';
                        v_keys := '{}';
                        -- A relationship from the node to itself is read as leaving it, and so once when both directions are read.
                        FOR v_e IN
                            SELECT e.eid, t.nid, t.props ->> (v_shape ->> 'key') AS key
                            FROM drivine_edge e JOIN drivine_node t ON t.nid = e.dst
                            WHERE v_dir IN ('OUT', 'BOTH') AND e.src = v_from AND e.type = v_type AND t.labels @> (v_shape -> 'labels')
                            UNION ALL
                            SELECT e.eid, t.nid, t.props ->> (v_shape ->> 'key')
                            FROM drivine_edge e JOIN drivine_node t ON t.nid = e.src
                            WHERE v_dir IN ('IN', 'BOTH') AND e.dst = v_from AND e.type = v_type AND t.labels @> (v_shape -> 'labels')
                              AND (v_dir = 'IN' OR e.src <> v_from)
                        LOOP
                            IF v_e.key IS NOT NULL AND (v_ids @> to_jsonb(v_e.key)) <> v_keep THEN
                                v_gone := array_append(v_gone, v_e.eid);
                                v_targets := array_append(v_targets, v_e.nid);
                                v_keys := array_append(v_keys, v_e.key);
                            END IF;
                        END LOOP;
                        IF cardinality(v_gone) > 0 THEN
                            FOR v_target IN SELECT DISTINCT t FROM unnest(v_targets) t ORDER BY t LOOP
                                -- A target gone since the relationships were read has nothing left to remove or count.
                                PERFORM 1 FROM drivine_node WHERE nid = v_target FOR UPDATE;
                                IF NOT FOUND THEN
                                    CONTINUE;
                                END IF;
                                -- What refers to a target is a relationship on the side this field reaches it from: counted before any is removed.
                                v_refs := 0;
                                IF v_delete THEN
                                    IF v_dir IN ('OUT', 'BOTH') THEN
                                        SELECT count(*) INTO v_refs FROM drivine_edge WHERE dst = v_target;
                                    END IF;
                                    IF v_dir IN ('IN', 'BOTH') THEN
                                        -- A relationship from the node to itself is counted once.
                                        SELECT v_refs + count(*) INTO v_refs FROM drivine_edge WHERE src = v_target AND (v_dir = 'IN' OR dst <> v_target);
                                    END IF;
                                END IF;
                                SELECT count(*) INTO v_removed FROM unnest(v_targets) t WHERE t = v_target;
                                SELECT k INTO v_key FROM unnest(v_targets, v_keys) AS u (t, k) WHERE t = v_target LIMIT 1;
                                -- The root is never deleted, and nor is a node the object still holds in another field.
                                IF v_delete AND v_target <> v_from AND v_refs = v_removed AND NOT v_held @> to_jsonb(v_key) THEN
                                    v_relinks := array_remove(v_relinks, v_target);
                                    DELETE FROM drivine_node WHERE nid = v_target;
                                ELSE
                                    v_relinks := array_append(v_relinks, v_target);
                                END IF;
                            END LOOP;
                            DELETE FROM drivine_edge WHERE eid = ANY (v_gone);
                            v_relinks := array_append(v_relinks, v_from);
                            v_count := v_count + cardinality(v_gone);
                        END IF;

                    WHEN 'cut' THEN
                        -- Removes the relationships of a type from one node to another, or with no other node named to any in a direction.
                        v_from := v_nodes[(v_op ->> 'from')::int + 1];
                        v_to := CASE WHEN v_op ->> 'to' IS NOT NULL THEN v_nodes[(v_op ->> 'to')::int + 1] END;
                        v_type := v_op ->> 'type';
                        v_dir := v_op ->> 'dir';
                        SELECT COALESCE(array_agg(c.eid), '{}'), COALESCE(array_agg(c.far), '{}') INTO v_gone, v_targets FROM (
                            SELECT eid, dst AS far FROM drivine_edge
                            WHERE v_dir IN ('OUT', 'BOTH') AND src = v_from AND type = v_type AND (v_to IS NULL OR dst = v_to)
                            UNION ALL
                            SELECT eid, src FROM drivine_edge
                            WHERE v_dir IN ('IN', 'BOTH') AND dst = v_from AND type = v_type AND (v_to IS NULL OR src = v_to) AND (v_dir = 'IN' OR src <> v_from)
                        ) c;
                        IF cardinality(v_gone) > 0 THEN
                            FOR v_target IN SELECT DISTINCT t FROM unnest(v_targets) t ORDER BY t LOOP
                                -- An end gone since the relationships were read took them with it, and has no token to change.
                                PERFORM 1 FROM drivine_node WHERE nid = v_target FOR UPDATE;
                                IF FOUND THEN
                                    v_relinks := array_append(v_relinks, v_target);
                                END IF;
                            END LOOP;
                            DELETE FROM drivine_edge WHERE eid = ANY (v_gone);
                            v_relinks := array_append(v_relinks, v_from);
                            v_count := v_count + cardinality(v_gone);
                        END IF;

                    WHEN 'patch' THEN
                        -- Writes properties to a node that is there, and makes none. One that is not there is left out of
                        -- what the call hands back; one that does not meet the predicate is left as it is, and said to.
                        v_shape := p_shapes -> ((v_op ->> 's')::int);
                        v_fresh := v_op ->> 'fresh';
                        v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');
                        IF v_row.nid IS NOT NULL THEN
                            v_met := 1;
                            IF p_patched_if IS NOT NULL THEN
                                -- The node is locked: what the predicate reads of it is what the last writer committed.
                                EXECUTE p_patched_if INTO v_met USING v_row.nid;
                            END IF;
                            v_o := v_row.props;
                            IF v_met > 0 THEN
                                v_o := (v_o || COALESCE(v_op -> 'set', '{}'::jsonb)) - ARRAY(SELECT jsonb_array_elements_text(COALESCE(v_op -> 'unset', '[]'::jsonb)));
                            END IF;
                            v_same := v_o = v_row.props;
                            -- A node the step changes has its copies written from what it now holds.
                            IF NOT v_same THEN
                                v_o := drivine_lowered(v_o, v_op -> 'lower');
                            END IF;
                            v_two := CASE WHEN length(v_row.stamp) = 33 AND substr(v_row.stamp, 17, 1) = ':' THEN v_row.stamp END;
                            IF v_two IS NULL OR NOT v_same THEN
                                v_stamp := substr(v_fresh, 1, 16) || COALESCE(substr(v_two, 17), substr(v_fresh, 17));
                                IF NOT v_same THEN
                                    UPDATE drivine_node SET props = v_o, stamp = v_stamp WHERE nid = v_row.nid;
                                ELSE
                                    UPDATE drivine_node SET stamp = v_stamp WHERE nid = v_row.nid;
                                END IF;
                            END IF;
                            v_h_index := array_append(v_h_index, v_op ->> 'i');
                            v_h_found := array_append(v_h_found, CASE WHEN v_met = 0 THEN '-' WHEN NOT v_same THEN '1' ELSE '0' END);
                            v_h_node := array_append(v_h_node, v_row.nid);
                        END IF;
                    END CASE;
                END LOOP;

                -- Each node whose relationships changed gets a new second token, once. Every one of them is locked
                -- already, found and locked by its step or made by it, so one statement writes them all and waits
                -- for no lock. A stamp that is not two tokens, which no save leaves, is replaced whole.
                IF cardinality(v_relinks) > 0 THEN
                    UPDATE drivine_node SET stamp = COALESCE(substr(CASE WHEN length(stamp) = 33 AND substr(stamp, 17, 1) = ':' THEN stamp END, 1, 17), substr(p_mark, 1, 17)) || substr(p_mark, 18)
                    WHERE nid = ANY (v_relinks);
                END IF;

                IF p_returns = 'STAMPS' THEN
                    -- The root's stamp, keeping the object's own token wherever the node had another when the save
                    -- began, then `index/found=stamp` for each node whose stamp is handed back.
                    SELECT stamp INTO v_stamp FROM drivine_node WHERE nid = v_root;
                    IF v_carried IS NULL THEN
                        -- An object that carried no stamp is handed the whole stamp only of a node its save made.
                        IF NOT v_root_made THEN
                            v_stamp := substr(v_stamp, 1, 17);
                        END IF;
                    ELSIF v_was = v_carried THEN
                        NULL; -- found exactly as loaded: the node's stamp is handed back whole
                    ELSE
                        v_stamp := CASE WHEN substr(v_was, 1, 16) = substr(v_carried, 1, 16) THEN substr(v_stamp, 1, 16) ELSE substr(v_carried, 1, 16) END || ':' ||
                            CASE WHEN NULLIF(substr(v_was, 18), '') = NULLIF(substr(v_carried, 18), '') OR (v_root_made AND NULLIF(substr(v_carried, 18), '') IS NULL)
                                 THEN substr(v_stamp, 18) ELSE substr(v_carried, 18) END;
                    END IF;
                    -- Every handed-back stamp is read by one query, in the order the steps came.
                    SELECT v_stamp || COALESCE(string_agg(',' || h.i || '/' || COALESCE(h.found, '') || '=' || COALESCE(n.stamp, ''), '' ORDER BY h.ord), '')
                    INTO v_result
                    FROM unnest(v_h_node, v_h_index, v_h_found) WITH ORDINALITY AS h (nid, i, found, ord) LEFT JOIN drivine_node n ON n.nid = h.nid;
                ELSIF p_returns = 'EACH_STAMP' THEN
                    SELECT COALESCE(array_agg(h.i || '/' || COALESCE(h.found, '') || '=' || COALESCE(n.stamp, '') ORDER BY h.ord), '{}')
                    INTO v_each
                    FROM unnest(v_h_node, v_h_index, v_h_found) WITH ORDINALITY AS h (nid, i, found, ord) LEFT JOIN drivine_node n ON n.nid = h.nid;
                END IF;
            EXCEPTION
                WHEN SQLSTATE 'P0D01' THEN v_stale := true; -- rolled back: nothing was written
                WHEN SQLSTATE 'P0D02' THEN v_count := 0;   -- a node the plan refers to is not there: rolled back, nothing was written
            END;
            IF p_returns = 'STAMPS' THEN
                IF NOT v_stale AND v_result IS NOT NULL THEN
                    RETURN NEXT v_result;
                END IF;
            ELSIF p_returns = 'EACH_STAMP' THEN
                IF NOT v_stale THEN
                    RETURN QUERY SELECT unnest(v_each);
                END IF;
            ELSE
                RETURN NEXT v_count::text;
            END IF;
        END
        $fn$ LANGUAGE plpgsql
      - "COMMENT ON TABLE drivine_node IS 'drivine:7'"
    ensuring: "DO $ensure$\nBEGIN\n    IF obj_description(to_regclass('drivine_node'), 'pg_class') IS DISTINCT FROM 'drivine:7' THEN\n        PERFORM pg_advisory_xact_lock(hashtext('drivine:drivine'));\n        -- Looked for again under the lock: another session may have made it while this one waited.\n        IF obj_description(to_regclass('drivine_node'), 'pg_class') IS DISTINCT FROM 'drivine:7' THEN\n            -- pgvector, for vector search, where the server has it and the user may make it: without it,\n            -- everything but a vector search works.\n            BEGIN\n                CREATE EXTENSION IF NOT EXISTS vector;\n            EXCEPTION WHEN OTHERS THEN\n                NULL;\n            END;\n            CREATE TABLE IF NOT EXISTS drivine_node (\n        nid    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n        labels jsonb NOT NULL,\n        props  jsonb NOT NULL,\n        stamp  varchar(33)\n    );\n    CREATE TABLE IF NOT EXISTS drivine_edge (\n        eid   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n        src   bigint NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,\n        dst   bigint NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,\n        type  varchar(128) NOT NULL,\n        props jsonb NOT NULL DEFAULT '{}'\n    );\n    CREATE TABLE IF NOT EXISTS drivine_schema (\n        kind        varchar(40) NOT NULL,\n        label       varchar(400) NOT NULL,\n        properties  varchar(2000) NOT NULL,\n        name        varchar(400),\n        object_name varchar(63),\n        details     jsonb NOT NULL,\n        PRIMARY KEY (kind, label, properties)\n    );\n    CREATE INDEX IF NOT EXISTS drivine_edge_src ON drivine_edge (src, type);\n    CREATE INDEX IF NOT EXISTS drivine_edge_dst ON drivine_edge (dst, type);\n    CREATE INDEX IF NOT EXISTS drivine_node_labels ON drivine_node USING GIN (labels jsonb_path_ops);\n    CREATE OR REPLACE FUNCTION drivine_find(p_labels jsonb, p_key text, p_id text) RETURNS drivine_node AS $fn$\n    DECLARE\n        -- The lookup of a shape is prepared once a session and run by name after: written for the shape, it\n        -- is planned for its label and property, and planned again each time it would cost a lookup several\n        -- times over. The name is a hash of what the lookup is for, so it fits whatever the graph is called.\n        v_name  text := 'drivine_find_' || md5('drivine' || ' ' || p_key || ' ' || p_labels::text);\n        v_nid   bigint;\n        v_row   drivine_node;\n    BEGIN\n        IF NOT EXISTS (SELECT 1 FROM pg_prepared_statements WHERE name = v_name) THEN\n            -- Each label is a test of its own, as a statement writes it, so a partial index over one is used.\n            EXECUTE format('PREPARE %I (text) AS SELECT min(n.nid) FROM drivine_node n WHERE (n.props ->> %L) = $1', v_name, p_key) ||\n                COALESCE((SELECT string_agg(format(' AND n.labels @> %L::jsonb', jsonb_build_array(l)), '') FROM jsonb_array_elements_text(p_labels) l), '');\n        END IF;\n        LOOP\n            EXECUTE format('EXECUTE %I(%L)', v_name, p_id) INTO v_nid;\n            IF v_nid IS NULL THEN\n                RETURN NULL;\n            END IF;\n            SELECT * INTO v_row FROM drivine_node n WHERE n.nid = v_nid FOR UPDATE;\n            -- Locked: is it still the node that was looked for? Another writer may have changed it meanwhile.\n            IF FOUND AND v_row.props ->> p_key = p_id AND v_row.labels @> p_labels THEN\n                RETURN v_row;\n            END IF;\n        END LOOP;\n    END\n    $fn$ LANGUAGE plpgsql;\n    CREATE OR REPLACE FUNCTION drivine_owns(p_bag jsonb, p_key text) RETURNS boolean AS $fn$\n    DECLARE\n        v_prefix   text := p_bag ->> 'prefix';\n        v_reserved text;\n    BEGIN\n        -- A bag with a prefix owns the keys that begin with it; a flat bag, each key that is no one else's.\n        IF NOT COALESCE((p_bag ->> 'flat')::boolean, false) THEN\n            RETURN length(p_key) > COALESCE(length(v_prefix), 0) AND (v_prefix IS NULL OR left(p_key, length(v_prefix)) = v_prefix);\n        END IF;\n        IF COALESCE(p_bag -> 'reservedKeys', '[]'::jsonb) @> to_jsonb(p_key) THEN\n            RETURN false;\n        END IF;\n        FOR v_reserved IN SELECT jsonb_array_elements_text(COALESCE(p_bag -> 'reservedPrefixes', '[]'::jsonb)) LOOP\n            IF left(p_key, length(v_reserved)) = v_reserved THEN\n                RETURN false;\n            END IF;\n        END LOOP;\n        RETURN true;\n    END\n    $fn$ LANGUAGE plpgsql IMMUTABLE;\n    CREATE OR REPLACE FUNCTION drivine_lowered(p_props jsonb, p_keys jsonb) RETURNS jsonb AS $fn$\n    DECLARE\n        v_props jsonb := p_props;\n        v_key   text;\n    BEGIN\n        FOR v_key IN SELECT jsonb_array_elements_text(COALESCE(p_keys, '[]'::jsonb)) LOOP\n            IF v_props ->> v_key IS NULL THEN\n                v_props := v_props - ('__drivine.lower.' || v_key);\n            ELSE\n                v_props := v_props || jsonb_build_object('__drivine.lower.' || v_key, lower(v_props ->> v_key));\n            END IF;\n        END LOOP;\n        RETURN v_props;\n    END\n    $fn$ LANGUAGE plpgsql STABLE;\n    CREATE OR REPLACE FUNCTION drivine_write(p_plan jsonb, p_shapes jsonb, p_mark text, p_returns text, p_patched_if text) RETURNS SETOF text AS $fn$\n    DECLARE\n        v_op        jsonb;\n        v_shape     jsonb;\n        v_nodes     bigint[] := '{}';\n        v_h_index   text[] := '{}';\n        v_h_found   text[] := '{}';\n        v_h_node    bigint[] := '{}';\n        v_relinks   bigint[] := '{}';\n        v_root      bigint;\n        v_root_made boolean := false;\n        v_was       text;\n        v_carried   text;\n        v_stamp     text;\n        v_count     bigint := 0;\n        v_result    text;\n        v_each      text[] := '{}';\n        v_stale     boolean := false;\n        -- A node step's.\n        v_row       drivine_node;\n        v_nid       bigint;\n        v_found     text;\n        v_two       text;\n        v_labels    jsonb;\n        v_o         jsonb;\n        v_expect    text;\n        v_fresh     text;\n        v_add       jsonb;\n        v_drop      jsonb;\n        v_made      boolean;\n        v_tries     int;\n        v_relabel   boolean;\n        v_bag       jsonb;\n        v_key       text;\n        v_owned     jsonb;\n        v_recorded  jsonb;\n        v_now       jsonb;\n        v_same      boolean;\n        v_copied    jsonb;\n        v_met       bigint;\n        v_premade   jsonb := '{}';\n        v_after     jsonb;\n        v_pre       bigint;\n        v_s         int;\n        v_premade_as text;\n        -- A relationship step's.\n        v_from      bigint;\n        v_to        bigint;\n        v_type      text;\n        v_dir       text;\n        v_props     jsonb;\n        v_clear     jsonb;\n        v_e         record;\n        v_x         jsonb;\n        v_seen      int;\n        v_unchanged int;\n        v_ids       jsonb;\n        v_held      jsonb;\n        v_keep      boolean;\n        v_delete    boolean;\n        v_gone      bigint[];\n        v_targets   bigint[];\n        v_keys      text[];\n        v_target    bigint;\n        v_refs      bigint;\n        v_removed   bigint;\n    BEGIN\n        BEGIN\n            -- The nodes the plan makes, made together. A `node` step that does no more than write properties,\n            -- with no stamp to check, no property bag to clear and no labels to own, makes its node by an\n            -- insert alone when the node is not there; so for each shape the nodes of such steps that are not\n            -- there are found by one lookup and inserted by one statement, the first step for each id only. A\n            -- node a uniqueness constraint refuses, made by another writer at this moment, is not inserted\n            -- here: its step finds it, or is refused, as it would be on its own. What each made gets is in\n            -- `v_premade`, by shape and id, for its step to take below.\n            -- Only where a shape has several such steps: for one node, the lookup and insert of its step are as cheap.\n            FOR v_s IN\n                SELECT (op ->> 's')::int FROM jsonb_array_elements(p_plan) op\n                WHERE op ->> 'op' = 'node' AND op -> 'expect' IS NULL AND COALESCE((op ->> 'create')::boolean, true) AND op -> 'bags' IS NULL AND op -> 'owned' IS NULL AND op -> 'add' IS NULL AND op -> 'drop' IS NULL\n                GROUP BY 1 HAVING count(*) > 1\n            LOOP\n                v_shape := p_shapes -> v_s;\n                -- Prepared once a session for the shape, as a lookup is, and run by name after: planned afresh,\n                -- it costs more than it saves a save of a few nodes. The name holds the store's version too, so\n                -- a session that outlives an upgrade does not run what an earlier version prepared.\n                v_premade_as := 'drivine_made_' || md5('drivine:7 drivine' || ' ' || (v_shape ->> 'key') || ' ' || (v_shape -> 'labels')::text);\n                IF NOT EXISTS (SELECT 1 FROM pg_prepared_statements WHERE name = v_premade_as) THEN\n                    EXECUTE format('PREPARE %I (jsonb, int) AS ', v_premade_as) || format($made$\n                        WITH steps AS (\n                            SELECT DISTINCT ON (op ->> 'k') ord, op FROM jsonb_array_elements($1) WITH ORDINALITY AS t (op, ord)\n                            WHERE op ->> 'op' = 'node' AND (op ->> 's')::int = $2 AND op -> 'expect' IS NULL AND COALESCE((op ->> 'create')::boolean, true) AND op -> 'bags' IS NULL AND op -> 'owned' IS NULL AND op -> 'add' IS NULL AND op -> 'drop' IS NULL\n                            ORDER BY op ->> 'k', ord),\n                        absent AS (\n                            SELECT s.ord, s.op FROM steps s\n                            WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE (n.props ->> %L) = s.op ->> 'k'%s)),\n                        made AS (\n                            INSERT INTO drivine_node (labels, props, stamp)\n                            SELECT op -> 'labels',\n                                   drivine_lowered((jsonb_build_object(op ->> 'key', op -> 'id') || COALESCE(op -> 'set', '{}'::jsonb))\n                                       - ARRAY(SELECT jsonb_array_elements_text(COALESCE(op -> 'unset', '[]'::jsonb))), op -> 'lower'),\n                                   op ->> 'fresh'\n                            FROM absent ORDER BY ord\n                            ON CONFLICT DO NOTHING\n                            RETURNING nid, props ->> %L AS k)\n                        SELECT COALESCE(jsonb_object_agg(k, nid), '{}'::jsonb) FROM made\n                    $made$, v_shape ->> 'key',\n                        COALESCE((SELECT string_agg(format(' AND n.labels @> %L::jsonb', jsonb_build_array(l)), '') FROM jsonb_array_elements_text(v_shape -> 'labels') l), ''),\n                        v_shape ->> 'key');\n                END IF;\n                EXECUTE format('EXECUTE %I(%L, %s)', v_premade_as, p_plan, v_s) INTO v_after;\n                v_premade := v_premade || jsonb_build_object(v_s::text, v_after);\n            END LOOP;\n    \n            FOR v_op IN SELECT value FROM jsonb_array_elements(p_plan) LOOP\n                CASE v_op ->> 'op'\n                WHEN 'node' THEN\n                    -- Saves a node: found and locked, or made. What the step writes is worked out over the node as\n                    -- it was found, and the node is written only where that differs from what it holds.\n                    v_shape := p_shapes -> ((v_op ->> 's')::int);\n                    v_expect := v_op ->> 'expect';\n                    v_fresh := v_op ->> 'fresh';\n                    v_tries := 0;\n                    -- A node made with the others above is this step's, once: a later step for the same id finds it.\n                    v_pre := (v_premade -> (v_op ->> 's') ->> (v_op ->> 'k'))::bigint;\n                    IF v_pre IS NOT NULL THEN\n                        v_premade := v_premade #- ARRAY[v_op ->> 's', v_op ->> 'k'];\n                        v_nid := v_pre;\n                        v_made := true;\n                        v_found := NULL;\n                    END IF;\n                    WHILE v_pre IS NULL LOOP\n                        v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');\n                        v_made := v_row.nid IS NULL;\n                        IF v_made THEN\n                            -- A checked save does not make the node again: it is gone, and the object is stale.\n                            -- Nor does a step that makes no node.\n                            IF v_expect IS NOT NULL OR NOT COALESCE((v_op ->> 'create')::boolean, true) THEN\n                                RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';\n                            END IF;\n                            v_labels := v_op -> 'labels';\n                            v_o := jsonb_build_object(v_op ->> 'key', v_op -> 'id');\n                            v_stamp := NULL;\n                        ELSIF COALESCE((v_op ->> 'absent')::boolean, false) THEN\n                            -- A step that only makes the node writes nothing to one that is there.\n                            RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';\n                        ELSE\n                            v_labels := v_row.labels;\n                            v_o := v_row.props;\n                            v_stamp := v_row.stamp;\n                        END IF;\n                        v_found := v_stamp;\n                        IF v_expect IS NOT NULL AND (v_stamp IS NULL OR\n                                CASE WHEN COALESCE((v_op ->> 'whole')::boolean, false) THEN v_stamp ELSE substr(v_stamp, 1, 16) END <> v_expect) THEN\n                            RAISE EXCEPTION 'stale' USING ERRCODE = 'P0D01';\n                        END IF;\n    \n                        -- The properties the step sets, and without those it unsets.\n                        v_o := (v_o || COALESCE(v_op -> 'set', '{}'::jsonb)) - ARRAY(SELECT jsonb_array_elements_text(COALESCE(v_op -> 'unset', '[]'::jsonb)));\n                        -- The keys of each property bag the object no longer holds.\n                        FOR v_bag IN SELECT value FROM jsonb_array_elements(COALESCE(v_op -> 'bags', '[]'::jsonb)) LOOP\n                            FOR v_key IN SELECT jsonb_object_keys(v_o) LOOP\n                                IF NOT COALESCE(v_bag -> 'keep', '[]'::jsonb) @> to_jsonb(v_key) AND drivine_owns(v_bag, v_key) THEN\n                                    v_o := v_o - v_key;\n                                END IF;\n                            END LOOP;\n                        END LOOP;\n    \n                        -- The labels an open label field holds are recorded on the node, so the node knows which are\n                        -- its own. A step that clears replaces the record, and drops the labels recorded that the\n                        -- field no longer holds, but for those of the class; one that does not adds to the record.\n                        v_add := COALESCE(v_op -> 'add', '[]'::jsonb);\n                        v_drop := COALESCE(v_op -> 'drop', '[]'::jsonb);\n                        v_owned := v_op -> 'owned';\n                        IF v_owned IS NOT NULL THEN\n                            v_recorded := v_o -> (v_owned ->> 'prop');\n                            IF v_recorded IS NULL OR jsonb_typeof(v_recorded) <> 'array' THEN\n                                v_recorded := '[]'::jsonb;\n                            END IF;\n                            IF COALESCE((v_owned ->> 'clear')::boolean, false) THEN\n                                v_drop := v_drop || COALESCE((\n                                    SELECT jsonb_agg(l) FROM jsonb_array_elements_text(v_recorded) l\n                                    WHERE NOT v_add @> to_jsonb(l) AND NOT COALESCE(v_owned -> 'base', '[]'::jsonb) @> to_jsonb(l)), '[]'::jsonb);\n                                IF jsonb_array_length(v_add) = 0 THEN\n                                    v_o := v_o - (v_owned ->> 'prop');\n                                ELSE\n                                    v_o := v_o || jsonb_build_object(v_owned ->> 'prop', v_add);\n                                END IF;\n                            ELSIF jsonb_array_length(v_add) > 0 THEN\n                                v_o := v_o || jsonb_build_object(v_owned ->> 'prop', COALESCE((\n                                    SELECT jsonb_agg(l ORDER BY l COLLATE \"C\") FROM jsonb_array_elements_text(v_recorded) l\n                                    WHERE NOT v_add @> to_jsonb(l)), '[]'::jsonb) || v_add);\n                            END IF;\n                        END IF;\n    \n                        -- The node's labels with those the step adds and without those it drops, in order; labels\n                        -- that are as they were are not written again.\n                        v_relabel := false;\n                        IF jsonb_array_length(v_add) > 0 OR jsonb_array_length(v_drop) > 0 THEN\n                            v_now := COALESCE((\n                                SELECT jsonb_agg(l ORDER BY l COLLATE \"C\") FROM (\n                                    SELECT jsonb_array_elements_text(v_labels) AS l UNION SELECT jsonb_array_elements_text(v_add)\n                                ) a WHERE NOT v_drop @> to_jsonb(l)), '[]'::jsonb);\n                            v_relabel := NOT (v_now @> v_labels AND v_labels @> v_now);\n                            IF v_relabel OR v_made THEN\n                                v_labels := v_now;\n                            END IF;\n                        END IF;\n    \n                        -- The copies are written from what the step leaves, and are no part of whether it changed the node.\n                        v_copied := drivine_lowered(v_o, v_op -> 'lower');\n                        IF v_made THEN\n                            -- A node that is made is written once, whole, with a stamp of its own. A uniqueness\n                            -- constraint may refuse it: once, it may be that another writer made the node at this\n                            -- moment, and the node is looked for again. Found again or not, the constraint is on\n                            -- something other than this node's key, and refuses this save.\n                            v_stamp := v_fresh;\n                            INSERT INTO drivine_node (labels, props, stamp) VALUES (v_labels, v_copied, v_stamp) ON CONFLICT DO NOTHING RETURNING nid INTO v_nid;\n                            IF v_nid IS NOT NULL THEN\n                                EXIT;\n                            END IF;\n                            v_tries := v_tries + 1;\n                            IF v_tries > 1 THEN\n                                INSERT INTO drivine_node (labels, props, stamp) VALUES (v_labels, v_copied, v_stamp);\n                            END IF;\n                        ELSE\n                            v_nid := v_row.nid;\n                            v_same := v_o = v_row.props;\n                            -- A new first token only if the step changes the node, or the node has no stamp of two tokens yet.\n                            v_two := CASE WHEN length(v_stamp) = 33 AND substr(v_stamp, 17, 1) = ':' THEN v_stamp END;\n                            IF v_two IS NULL OR NOT v_same OR v_relabel THEN\n                                v_stamp := substr(v_fresh, 1, 16) || COALESCE(substr(v_two, 17), substr(v_fresh, 17));\n                                IF v_relabel THEN\n                                    UPDATE drivine_node SET labels = v_labels WHERE nid = v_nid;\n                                END IF;\n                                IF v_copied <> v_row.props THEN\n                                    UPDATE drivine_node SET props = v_copied, stamp = v_stamp WHERE nid = v_nid;\n                                ELSE\n                                    UPDATE drivine_node SET stamp = v_stamp WHERE nid = v_nid;\n                                END IF;\n                            ELSIF v_copied <> v_row.props THEN\n                                -- Only a copy was out of step with its property: the node keeps its stamp.\n                                UPDATE drivine_node SET props = v_copied WHERE nid = v_nid;\n                            END IF;\n                            EXIT;\n                        END IF;\n                    END LOOP;\n    \n                    v_nodes[(v_op ->> 'r')::int + 1] := v_nid;\n                    IF v_op ->> 'i' IS NOT NULL THEN\n                        v_h_index := array_append(v_h_index, v_op ->> 'i');\n                        -- Nothing for a node the step made, and a mark for one that was there without a stamp.\n                        v_h_found := array_append(v_h_found, CASE WHEN v_made THEN NULL ELSE COALESCE(v_found, '-') END);\n                        v_h_node := array_append(v_h_node, v_nid);\n                    END IF;\n                    IF COALESCE((v_op ->> 'root')::boolean, false) THEN\n                        v_root := v_nid;\n                        v_root_made := v_made;\n                        v_was := v_found;\n                        v_carried := v_op ->> 'carried';\n                    END IF;\n    \n                WHEN 'ref' THEN\n                    -- Finds a node that must be there, and locks it.\n                    v_shape := p_shapes -> ((v_op ->> 's')::int);\n                    v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');\n                    IF v_row.nid IS NULL THEN\n                        RAISE EXCEPTION 'absent' USING ERRCODE = 'P0D02';\n                    END IF;\n                    v_nodes[(v_op ->> 'r')::int + 1] := v_row.nid;\n    \n                WHEN 'link' THEN\n                    -- Joins two nodes. The relationship is as the step says only if every one of its type between them is.\n                    v_from := v_nodes[(v_op ->> 'from')::int + 1];\n                    v_to := v_nodes[(v_op ->> 'to')::int + 1];\n                    v_type := v_op ->> 'type';\n                    v_dir := v_op ->> 'dir';\n                    v_props := COALESCE(v_op -> 'props', '{}'::jsonb);\n                    v_clear := COALESCE(v_op -> 'clear', '[]'::jsonb);\n                    v_seen := 0;\n                    v_unchanged := 0;\n                    IF NOT COALESCE((v_op ->> 'always')::boolean, false) THEN\n                        -- A node's relationship to itself is one relationship, whichever way it is read.\n                        FOR v_e IN\n                            SELECT eid, props FROM drivine_edge\n                            WHERE type = v_type AND (\n                                (v_dir IN ('OUT', 'BOTH') AND src = v_from AND dst = v_to)\n                                OR ((v_dir = 'IN' OR (v_dir = 'BOTH' AND v_from <> v_to)) AND src = v_to AND dst = v_from))\n                            ORDER BY eid\n                        LOOP\n                            v_seen := v_seen + 1;\n                            v_x := (v_e.props || v_props) - ARRAY(SELECT jsonb_array_elements_text(v_clear));\n                            IF v_x = v_e.props THEN\n                                v_unchanged := v_unchanged + 1;\n                            ELSE\n                                UPDATE drivine_edge SET props = v_x WHERE eid = v_e.eid;\n                            END IF;\n                        END LOOP;\n                    END IF;\n                    IF v_seen = 0 THEN\n                        -- An undirected field is satisfied by a relationship either way, and makes one from the first node.\n                        INSERT INTO drivine_edge (src, dst, type, props)\n                        VALUES (CASE WHEN v_dir = 'IN' THEN v_to ELSE v_from END, CASE WHEN v_dir = 'IN' THEN v_from ELSE v_to END, v_type, v_props);\n                    END IF;\n                    IF v_seen = 0 OR v_unchanged < v_seen THEN\n                        v_relinks := v_relinks || v_from || v_to;\n                    END IF;\n                    v_count := v_count + GREATEST(v_seen, 1);\n    \n                WHEN 'unlink' THEN\n                    -- Removes a field's relationships to the targets whose ids the step names, or to every target but those.\n                    v_from := v_nodes[(v_op ->> 'from')::int + 1];\n                    v_shape := p_shapes -> ((v_op ->> 's')::int);\n                    v_type := v_op ->> 'type';\n                    v_dir := v_op ->> 'dir';\n                    v_ids := COALESCE(v_op -> 'ids', '[]'::jsonb);\n                    v_held := COALESCE(v_op -> 'held', '[]'::jsonb);\n                    v_keep := COALESCE((v_op ->> 'keep')::boolean, false);\n                    v_delete := COALESCE((v_op ->> 'delete')::boolean, false);\n                    v_gone := '{}';\n                    v_targets := '{}';\n                    v_keys := '{}';\n                    -- A relationship from the node to itself is read as leaving it, and so once when both directions are read.\n                    FOR v_e IN\n                        SELECT e.eid, t.nid, t.props ->> (v_shape ->> 'key') AS key\n                        FROM drivine_edge e JOIN drivine_node t ON t.nid = e.dst\n                        WHERE v_dir IN ('OUT', 'BOTH') AND e.src = v_from AND e.type = v_type AND t.labels @> (v_shape -> 'labels')\n                        UNION ALL\n                        SELECT e.eid, t.nid, t.props ->> (v_shape ->> 'key')\n                        FROM drivine_edge e JOIN drivine_node t ON t.nid = e.src\n                        WHERE v_dir IN ('IN', 'BOTH') AND e.dst = v_from AND e.type = v_type AND t.labels @> (v_shape -> 'labels')\n                          AND (v_dir = 'IN' OR e.src <> v_from)\n                    LOOP\n                        IF v_e.key IS NOT NULL AND (v_ids @> to_jsonb(v_e.key)) <> v_keep THEN\n                            v_gone := array_append(v_gone, v_e.eid);\n                            v_targets := array_append(v_targets, v_e.nid);\n                            v_keys := array_append(v_keys, v_e.key);\n                        END IF;\n                    END LOOP;\n                    IF cardinality(v_gone) > 0 THEN\n                        FOR v_target IN SELECT DISTINCT t FROM unnest(v_targets) t ORDER BY t LOOP\n                            -- A target gone since the relationships were read has nothing left to remove or count.\n                            PERFORM 1 FROM drivine_node WHERE nid = v_target FOR UPDATE;\n                            IF NOT FOUND THEN\n                                CONTINUE;\n                            END IF;\n                            -- What refers to a target is a relationship on the side this field reaches it from: counted before any is removed.\n                            v_refs := 0;\n                            IF v_delete THEN\n                                IF v_dir IN ('OUT', 'BOTH') THEN\n                                    SELECT count(*) INTO v_refs FROM drivine_edge WHERE dst = v_target;\n                                END IF;\n                                IF v_dir IN ('IN', 'BOTH') THEN\n                                    -- A relationship from the node to itself is counted once.\n                                    SELECT v_refs + count(*) INTO v_refs FROM drivine_edge WHERE src = v_target AND (v_dir = 'IN' OR dst <> v_target);\n                                END IF;\n                            END IF;\n                            SELECT count(*) INTO v_removed FROM unnest(v_targets) t WHERE t = v_target;\n                            SELECT k INTO v_key FROM unnest(v_targets, v_keys) AS u (t, k) WHERE t = v_target LIMIT 1;\n                            -- The root is never deleted, and nor is a node the object still holds in another field.\n                            IF v_delete AND v_target <> v_from AND v_refs = v_removed AND NOT v_held @> to_jsonb(v_key) THEN\n                                v_relinks := array_remove(v_relinks, v_target);\n                                DELETE FROM drivine_node WHERE nid = v_target;\n                            ELSE\n                                v_relinks := array_append(v_relinks, v_target);\n                            END IF;\n                        END LOOP;\n                        DELETE FROM drivine_edge WHERE eid = ANY (v_gone);\n                        v_relinks := array_append(v_relinks, v_from);\n                        v_count := v_count + cardinality(v_gone);\n                    END IF;\n    \n                WHEN 'cut' THEN\n                    -- Removes the relationships of a type from one node to another, or with no other node named to any in a direction.\n                    v_from := v_nodes[(v_op ->> 'from')::int + 1];\n                    v_to := CASE WHEN v_op ->> 'to' IS NOT NULL THEN v_nodes[(v_op ->> 'to')::int + 1] END;\n                    v_type := v_op ->> 'type';\n                    v_dir := v_op ->> 'dir';\n                    SELECT COALESCE(array_agg(c.eid), '{}'), COALESCE(array_agg(c.far), '{}') INTO v_gone, v_targets FROM (\n                        SELECT eid, dst AS far FROM drivine_edge\n                        WHERE v_dir IN ('OUT', 'BOTH') AND src = v_from AND type = v_type AND (v_to IS NULL OR dst = v_to)\n                        UNION ALL\n                        SELECT eid, src FROM drivine_edge\n                        WHERE v_dir IN ('IN', 'BOTH') AND dst = v_from AND type = v_type AND (v_to IS NULL OR src = v_to) AND (v_dir = 'IN' OR src <> v_from)\n                    ) c;\n                    IF cardinality(v_gone) > 0 THEN\n                        FOR v_target IN SELECT DISTINCT t FROM unnest(v_targets) t ORDER BY t LOOP\n                            -- An end gone since the relationships were read took them with it, and has no token to change.\n                            PERFORM 1 FROM drivine_node WHERE nid = v_target FOR UPDATE;\n                            IF FOUND THEN\n                                v_relinks := array_append(v_relinks, v_target);\n                            END IF;\n                        END LOOP;\n                        DELETE FROM drivine_edge WHERE eid = ANY (v_gone);\n                        v_relinks := array_append(v_relinks, v_from);\n                        v_count := v_count + cardinality(v_gone);\n                    END IF;\n    \n                WHEN 'patch' THEN\n                    -- Writes properties to a node that is there, and makes none. One that is not there is left out of\n                    -- what the call hands back; one that does not meet the predicate is left as it is, and said to.\n                    v_shape := p_shapes -> ((v_op ->> 's')::int);\n                    v_fresh := v_op ->> 'fresh';\n                    v_row := drivine_find(v_shape -> 'labels', v_shape ->> 'key', v_op ->> 'k');\n                    IF v_row.nid IS NOT NULL THEN\n                        v_met := 1;\n                        IF p_patched_if IS NOT NULL THEN\n                            -- The node is locked: what the predicate reads of it is what the last writer committed.\n                            EXECUTE p_patched_if INTO v_met USING v_row.nid;\n                        END IF;\n                        v_o := v_row.props;\n                        IF v_met > 0 THEN\n                            v_o := (v_o || COALESCE(v_op -> 'set', '{}'::jsonb)) - ARRAY(SELECT jsonb_array_elements_text(COALESCE(v_op -> 'unset', '[]'::jsonb)));\n                        END IF;\n                        v_same := v_o = v_row.props;\n                        -- A node the step changes has its copies written from what it now holds.\n                        IF NOT v_same THEN\n                            v_o := drivine_lowered(v_o, v_op -> 'lower');\n                        END IF;\n                        v_two := CASE WHEN length(v_row.stamp) = 33 AND substr(v_row.stamp, 17, 1) = ':' THEN v_row.stamp END;\n                        IF v_two IS NULL OR NOT v_same THEN\n                            v_stamp := substr(v_fresh, 1, 16) || COALESCE(substr(v_two, 17), substr(v_fresh, 17));\n                            IF NOT v_same THEN\n                                UPDATE drivine_node SET props = v_o, stamp = v_stamp WHERE nid = v_row.nid;\n                            ELSE\n                                UPDATE drivine_node SET stamp = v_stamp WHERE nid = v_row.nid;\n                            END IF;\n                        END IF;\n                        v_h_index := array_append(v_h_index, v_op ->> 'i');\n                        v_h_found := array_append(v_h_found, CASE WHEN v_met = 0 THEN '-' WHEN NOT v_same THEN '1' ELSE '0' END);\n                        v_h_node := array_append(v_h_node, v_row.nid);\n                    END IF;\n                END CASE;\n            END LOOP;\n    \n            -- Each node whose relationships changed gets a new second token, once. Every one of them is locked\n            -- already, found and locked by its step or made by it, so one statement writes them all and waits\n            -- for no lock. A stamp that is not two tokens, which no save leaves, is replaced whole.\n            IF cardinality(v_relinks) > 0 THEN\n                UPDATE drivine_node SET stamp = COALESCE(substr(CASE WHEN length(stamp) = 33 AND substr(stamp, 17, 1) = ':' THEN stamp END, 1, 17), substr(p_mark, 1, 17)) || substr(p_mark, 18)\n                WHERE nid = ANY (v_relinks);\n            END IF;\n    \n            IF p_returns = 'STAMPS' THEN\n                -- The root's stamp, keeping the object's own token wherever the node had another when the save\n                -- began, then `index/found=stamp` for each node whose stamp is handed back.\n                SELECT stamp INTO v_stamp FROM drivine_node WHERE nid = v_root;\n                IF v_carried IS NULL THEN\n                    -- An object that carried no stamp is handed the whole stamp only of a node its save made.\n                    IF NOT v_root_made THEN\n                        v_stamp := substr(v_stamp, 1, 17);\n                    END IF;\n                ELSIF v_was = v_carried THEN\n                    NULL; -- found exactly as loaded: the node's stamp is handed back whole\n                ELSE\n                    v_stamp := CASE WHEN substr(v_was, 1, 16) = substr(v_carried, 1, 16) THEN substr(v_stamp, 1, 16) ELSE substr(v_carried, 1, 16) END || ':' ||\n                        CASE WHEN NULLIF(substr(v_was, 18), '') = NULLIF(substr(v_carried, 18), '') OR (v_root_made AND NULLIF(substr(v_carried, 18), '') IS NULL)\n                             THEN substr(v_stamp, 18) ELSE substr(v_carried, 18) END;\n                END IF;\n                -- Every handed-back stamp is read by one query, in the order the steps came.\n                SELECT v_stamp || COALESCE(string_agg(',' || h.i || '/' || COALESCE(h.found, '') || '=' || COALESCE(n.stamp, ''), '' ORDER BY h.ord), '')\n                INTO v_result\n                FROM unnest(v_h_node, v_h_index, v_h_found) WITH ORDINALITY AS h (nid, i, found, ord) LEFT JOIN drivine_node n ON n.nid = h.nid;\n            ELSIF p_returns = 'EACH_STAMP' THEN\n                SELECT COALESCE(array_agg(h.i || '/' || COALESCE(h.found, '') || '=' || COALESCE(n.stamp, '') ORDER BY h.ord), '{}')\n                INTO v_each\n                FROM unnest(v_h_node, v_h_index, v_h_found) WITH ORDINALITY AS h (nid, i, found, ord) LEFT JOIN drivine_node n ON n.nid = h.nid;\n            END IF;\n        EXCEPTION\n            WHEN SQLSTATE 'P0D01' THEN v_stale := true; -- rolled back: nothing was written\n            WHEN SQLSTATE 'P0D02' THEN v_count := 0;   -- a node the plan refers to is not there: rolled back, nothing was written\n        END;\n        IF p_returns = 'STAMPS' THEN\n            IF NOT v_stale AND v_result IS NOT NULL THEN\n                RETURN NEXT v_result;\n            END IF;\n        ELSIF p_returns = 'EACH_STAMP' THEN\n            IF NOT v_stale THEN\n                RETURN QUERY SELECT unnest(v_each);\n            END IF;\n        ELSE\n            RETURN NEXT v_count::text;\n        END IF;\n    END\n    $fn$ LANGUAGE plpgsql;\n    COMMENT ON TABLE drivine_node IS 'drivine:7';\n        END IF;\n    END IF;\nEND\n$ensure$"
  oracle:
    ddl:
      - |-
        CREATE TABLE IF NOT EXISTS drivine_node (
            nid    NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            labels JSON NOT NULL,
            props  JSON NOT NULL,
            stamp  VARCHAR2(33)
        )
      - |-
        CREATE TABLE IF NOT EXISTS drivine_edge (
            eid   NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            src   NUMBER NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
            dst   NUMBER NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
            type  VARCHAR2(128) NOT NULL,
            props JSON DEFAULT '{}' NOT NULL
        )
      - |-
        CREATE TABLE IF NOT EXISTS drivine_schema (
            kind        VARCHAR2(40) NOT NULL,
            label       VARCHAR2(400) NOT NULL,
            properties  VARCHAR2(2000) NOT NULL,
            name        VARCHAR2(400),
            object_name VARCHAR2(128),
            details     JSON NOT NULL,
            PRIMARY KEY (kind, label, properties)
        )
      - "CREATE INDEX IF NOT EXISTS drivine_edge_src ON drivine_edge (src, type)"
      - "CREATE INDEX IF NOT EXISTS drivine_edge_dst ON drivine_edge (dst, type)"
      - "CREATE MULTIVALUE INDEX IF NOT EXISTS drivine_node_labels ON drivine_node n (n.labels.string())"
      - |-
        CREATE OR REPLACE PROPERTY GRAPH drivine
            VERTEX TABLES (drivine_node KEY (nid) LABEL node PROPERTIES (nid, labels, props, stamp, JSON_TRANSFORM(props, SET '$.labels' = labels, SET '$."__drivine.stamp"' = stamp) AS doc))
            EDGE TABLES (drivine_edge KEY (eid)
                SOURCE KEY (src) REFERENCES drivine_node (nid)
                DESTINATION KEY (dst) REFERENCES drivine_node (nid)
                LABEL edge PROPERTIES (eid, src, dst, type, props))
    functions:
      - |-
        CREATE OR REPLACE FUNCTION drivine_nulls_equal(cy_x JSON, cy_y JSON) RETURN NUMBER IS
            FUNCTION eq(a JSON_ELEMENT_T, b JSON_ELEMENT_T) RETURN NUMBER IS
                r NUMBER := 1;
                e NUMBER;
                la JSON_ARRAY_T;
                lb JSON_ARRAY_T;
                oa JSON_OBJECT_T;
                ob JSON_OBJECT_T;
                ks JSON_KEY_LIST;
                too_long EXCEPTION;
                PRAGMA EXCEPTION_INIT(too_long, -40478);
            BEGIN
                IF a.is_Null OR b.is_Null THEN RETURN NULL; END IF;
                IF a.is_Array AND b.is_Array THEN
                    la := TREAT(a AS JSON_ARRAY_T);
                    lb := TREAT(b AS JSON_ARRAY_T);
                    IF la.get_Size <> lb.get_Size THEN RETURN 0; END IF;
                    FOR i IN 0 .. la.get_Size - 1 LOOP
                        e := eq(la.get(i), lb.get(i));
                        IF e = 0 THEN RETURN 0; END IF;
                        IF e IS NULL THEN r := NULL; END IF;
                    END LOOP;
                    RETURN r;
                END IF;
                IF a.is_Object AND b.is_Object THEN
                    oa := TREAT(a AS JSON_OBJECT_T);
                    ob := TREAT(b AS JSON_OBJECT_T);
                    IF oa.get_Size <> ob.get_Size THEN RETURN 0; END IF;
                    ks := oa.get_Keys;
                    FOR i IN 1 .. ks.COUNT LOOP
                        IF NOT ob.has(ks(i)) THEN RETURN 0; END IF;
                        e := eq(oa.get(ks(i)), ob.get(ks(i)));
                        IF e = 0 THEN RETURN 0; END IF;
                        IF e IS NULL THEN r := NULL; END IF;
                    END LOOP;
                    RETURN r;
                END IF;
                IF a.is_Number AND b.is_Number THEN RETURN CASE WHEN a.to_Number = b.to_Number THEN 1 ELSE 0 END; END IF;
                IF a.is_String AND b.is_String THEN
                    BEGIN
                        RETURN CASE WHEN a.to_String = b.to_String THEN 1 ELSE 0 END;
                    EXCEPTION WHEN too_long THEN
                        RETURN CASE WHEN DBMS_LOB.COMPARE(a.to_Clob, b.to_Clob) = 0 THEN 1 ELSE 0 END;
                    END;
                END IF;
                IF a.is_Boolean AND b.is_Boolean THEN RETURN CASE WHEN a.to_Boolean = b.to_Boolean THEN 1 ELSE 0 END; END IF;
                RETURN 0;
            END;
        BEGIN
            RETURN eq(JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_x RETURNING CLOB)), JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_y RETURNING CLOB)));
        END;
      - |-
        CREATE OR REPLACE FUNCTION drivine_era(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
        BEGIN
            IF ASCII(t) < 49 THEN
                RETURN REGEXP_REPLACE(t, '^(-[0-9]{4}|0000)', TO_CHAR(TO_NUMBER(REGEXP_SUBSTR(t, '^-?[0-9]{4}')) - 1, 'FM0000'));
            END IF;
            RETURN t;
        END;
      - |-
        CREATE OR REPLACE FUNCTION drivine_era_date(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
        BEGIN
            IF SUBSTR(t, 1, 1) = '-' THEN
                RETURN TO_CHAR(TO_NUMBER(SUBSTR(t, 1, 5)) + 1, 'FM0000') || SUBSTR(t, 6);
            END IF;
            RETURN t;
        END;
    ensuring: |2-
              DECLARE
                  v_made NUMBER;
                  e_exists EXCEPTION;
                  PRAGMA EXCEPTION_INIT(e_exists, -955);
                  e_denied EXCEPTION;
                  PRAGMA EXCEPTION_INIT(e_denied, -1031);
                  e_busy EXCEPTION;
                  PRAGMA EXCEPTION_INIT(e_busy, -54);
                  PROCEDURE make(p_ddl VARCHAR2) IS
                  BEGIN
                      FOR attempt IN 1 .. 300 LOOP
                          BEGIN
                              EXECUTE IMMEDIATE p_ddl;
                              RETURN;
                          EXCEPTION
                              WHEN e_exists THEN RETURN;
                              WHEN e_busy THEN
                                  IF attempt = 300 THEN RAISE; END IF;
                                  DBMS_SESSION.SLEEP(0.1);
                          END;
                      END LOOP;
                  END;
              BEGIN
                  SELECT COUNT(*) INTO v_made FROM user_pg_prop_definitions WHERE graph_name = 'DRIVINE' AND property_name = 'DOC';
                  IF v_made = 0 THEN
                      make('CREATE TABLE IF NOT EXISTS drivine_node (
          nid    NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          labels JSON NOT NULL,
          props  JSON NOT NULL,
          stamp  VARCHAR2(33)
      )');
              make('CREATE TABLE IF NOT EXISTS drivine_edge (
          eid   NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          src   NUMBER NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
          dst   NUMBER NOT NULL REFERENCES drivine_node (nid) ON DELETE CASCADE,
          type  VARCHAR2(128) NOT NULL,
          props JSON DEFAULT ''{}'' NOT NULL
      )');
              make('CREATE TABLE IF NOT EXISTS drivine_schema (
          kind        VARCHAR2(40) NOT NULL,
          label       VARCHAR2(400) NOT NULL,
          properties  VARCHAR2(2000) NOT NULL,
          name        VARCHAR2(400),
          object_name VARCHAR2(128),
          details     JSON NOT NULL,
          PRIMARY KEY (kind, label, properties)
      )');
              make('CREATE INDEX IF NOT EXISTS drivine_edge_src ON drivine_edge (src, type)');
              make('CREATE INDEX IF NOT EXISTS drivine_edge_dst ON drivine_edge (dst, type)');
              make('CREATE MULTIVALUE INDEX IF NOT EXISTS drivine_node_labels ON drivine_node n (n.labels.string())');
              make('CREATE OR REPLACE PROPERTY GRAPH drivine
          VERTEX TABLES (drivine_node KEY (nid) LABEL node PROPERTIES (nid, labels, props, stamp, JSON_TRANSFORM(props, SET ''$.labels'' = labels, SET ''$."__drivine.stamp"'' = stamp) AS doc))
          EDGE TABLES (drivine_edge KEY (eid)
              SOURCE KEY (src) REFERENCES drivine_node (nid)
              DESTINATION KEY (dst) REFERENCES drivine_node (nid)
              LABEL edge PROPERTIES (eid, src, dst, type, props))');
                  END IF;
                  SELECT COUNT(*) INTO v_made FROM user_objects WHERE object_type = 'FUNCTION' AND object_name = 'DRIVINE_NULLS_EQUAL' AND status = 'VALID';
                  IF v_made = 0 THEN
                      BEGIN EXECUTE IMMEDIATE 'CREATE OR REPLACE FUNCTION drivine_nulls_equal(cy_x JSON, cy_y JSON) RETURN NUMBER IS
          FUNCTION eq(a JSON_ELEMENT_T, b JSON_ELEMENT_T) RETURN NUMBER IS
              r NUMBER := 1;
              e NUMBER;
              la JSON_ARRAY_T;
              lb JSON_ARRAY_T;
              oa JSON_OBJECT_T;
              ob JSON_OBJECT_T;
              ks JSON_KEY_LIST;
              too_long EXCEPTION;
              PRAGMA EXCEPTION_INIT(too_long, -40478);
          BEGIN
              IF a.is_Null OR b.is_Null THEN RETURN NULL; END IF;
              IF a.is_Array AND b.is_Array THEN
                  la := TREAT(a AS JSON_ARRAY_T);
                  lb := TREAT(b AS JSON_ARRAY_T);
                  IF la.get_Size <> lb.get_Size THEN RETURN 0; END IF;
                  FOR i IN 0 .. la.get_Size - 1 LOOP
                      e := eq(la.get(i), lb.get(i));
                      IF e = 0 THEN RETURN 0; END IF;
                      IF e IS NULL THEN r := NULL; END IF;
                  END LOOP;
                  RETURN r;
              END IF;
              IF a.is_Object AND b.is_Object THEN
                  oa := TREAT(a AS JSON_OBJECT_T);
                  ob := TREAT(b AS JSON_OBJECT_T);
                  IF oa.get_Size <> ob.get_Size THEN RETURN 0; END IF;
                  ks := oa.get_Keys;
                  FOR i IN 1 .. ks.COUNT LOOP
                      IF NOT ob.has(ks(i)) THEN RETURN 0; END IF;
                      e := eq(oa.get(ks(i)), ob.get(ks(i)));
                      IF e = 0 THEN RETURN 0; END IF;
                      IF e IS NULL THEN r := NULL; END IF;
                  END LOOP;
                  RETURN r;
              END IF;
              IF a.is_Number AND b.is_Number THEN RETURN CASE WHEN a.to_Number = b.to_Number THEN 1 ELSE 0 END; END IF;
              IF a.is_String AND b.is_String THEN
                  BEGIN
                      RETURN CASE WHEN a.to_String = b.to_String THEN 1 ELSE 0 END;
                  EXCEPTION WHEN too_long THEN
                      RETURN CASE WHEN DBMS_LOB.COMPARE(a.to_Clob, b.to_Clob) = 0 THEN 1 ELSE 0 END;
                  END;
              END IF;
              IF a.is_Boolean AND b.is_Boolean THEN RETURN CASE WHEN a.to_Boolean = b.to_Boolean THEN 1 ELSE 0 END; END IF;
              RETURN 0;
          END;
      BEGIN
          RETURN eq(JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_x RETURNING CLOB)), JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_y RETURNING CLOB)));
      END;'; EXCEPTION WHEN e_denied THEN NULL; END;
                  END IF;
                  SELECT COUNT(*) INTO v_made FROM user_objects WHERE object_type = 'FUNCTION' AND object_name = 'DRIVINE_ERA' AND status = 'VALID';
                  IF v_made = 0 THEN
                      BEGIN EXECUTE IMMEDIATE 'CREATE OR REPLACE FUNCTION drivine_era(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
      BEGIN
          IF ASCII(t) < 49 THEN
              RETURN REGEXP_REPLACE(t, ''^(-[0-9]{4}|0000)'', TO_CHAR(TO_NUMBER(REGEXP_SUBSTR(t, ''^-?[0-9]{4}'')) - 1, ''FM0000''));
          END IF;
          RETURN t;
      END;'; EXCEPTION WHEN e_denied THEN NULL; END;
                  END IF;
                  SELECT COUNT(*) INTO v_made FROM user_objects WHERE object_type = 'FUNCTION' AND object_name = 'DRIVINE_ERA_DATE' AND status = 'VALID';
                  IF v_made = 0 THEN
                      BEGIN EXECUTE IMMEDIATE 'CREATE OR REPLACE FUNCTION drivine_era_date(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
      BEGIN
          IF SUBSTR(t, 1, 1) = ''-'' THEN
              RETURN TO_CHAR(TO_NUMBER(SUBSTR(t, 1, 5)) + 1, ''FM0000'') || SUBSTR(t, 6);
          END IF;
          RETURN t;
      END;'; EXCEPTION WHEN e_denied THEN NULL; END;
                  END IF;
              END;
