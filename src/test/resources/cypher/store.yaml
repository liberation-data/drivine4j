        drop: ["DROP CONSTRAINT ON (n:Person) ASSERT n.`say\"hi` IS UNIQUE"]
      falkordb:
        create:
          - native:
              - "GRAPH.CONSTRAINT"
              - "CREATE"
              - "{graphName}"
              - "UNIQUE"
              - "NODE"
              - "Person"
              - "PROPERTIES"
              - "1"
              - "say\"hi"
        drop:
          - native:
              - "GRAPH.CONSTRAINT"
              - "DROP"
              - "{graphName}"
              - "UNIQUE"
              - "NODE"
              - "Person"
              - "PROPERTIES"
              - "1"
              - "say\"hi"
        constrainable:
          error: "FalkorDB cannot make the UNIQUENESS_CONSTRAINT Person_say\"hi_unique on Person[say\"hi]: GRAPH.CONSTRAINT takes only a plain name for a property, and 'say\"hi' is not one. A uniqueness constraint that ignores case is over the lowercased copy, named so. See https://github.com/FalkorDB/FalkorDB/issues/551"
    read:
      cypher: "MATCH (n:Person {`say\"hi`: $x}) RETURN n"
      parameters: {x: "Ada"}
      indexedProperties:
        - ["Person", "say\"hi"]
      holds:
        postgres: ["(props ->> 'say\"hi')", "labels @> '[\"Person\"]'"]
        oracle:
          - "CASE WHEN JSON_EXISTS(n.labels, '$[*]?(@ == \"Person\")') AND JSON_EXISTS(n.props, '$.\"say\\\"hi\"') THEN JSON_VALUE(n.props, '$.\"say\\\"hi\"') END"
        sqlite:
          - "(CASE json_type(props, '$.\"say\\\"hi\"') WHEN 'text' THEN props ->> '$.\"say\\\"hi\"' WHEN 'null' THEN NULL ELSE props -> '$.\"say\\\"hi\"' END)"
          - "instr(labels, '\"Person\"') > 0"

# The store's schema: how each store's listings are read back as items, whether an item is the one a spec declares and in
# its shape, what each store can do, and what its errors say. Captured with no store from drivine4j's schema grammars
# (10f825b8), the reference, before the module wrote them. See README.md, "The store's schema".
schema:
  stores:
    neo4j:
      engine: "Neo4j"
      supportsIfNotExists: true
      supportsNamedItems: true
      supportsTextIndex: true
      constraintsRequireBackingIndex: false
      constraintCreationIsAsync: false
      indexOperationsAreAsync: false
      awaitIndex: "CALL db.awaitIndex($name, $timeout)"
      indexState: "SHOW INDEXES YIELD name, state WHERE name = $name RETURN {state: state}"
    memgraph:
      engine: "Memgraph"
      supportsIfNotExists: false
      supportsNamedItems: true
      supportsTextIndex: false
      constraintsRequireBackingIndex: false
      constraintCreationIsAsync: false
      indexOperationsAreAsync: false
      awaitIndex: null
      indexState: null
    falkordb:
      engine: "FalkorDB"
      supportsIfNotExists: false
      supportsNamedItems: false
      supportsTextIndex: false
      constraintsRequireBackingIndex: true
      constraintCreationIsAsync: true
      indexOperationsAreAsync: true
      awaitIndex: null
      indexState: null
    postgres:
      engine: "Postgres"
      supportsIfNotExists: true
      supportsNamedItems: true
      supportsTextIndex: false
      constraintsRequireBackingIndex: false
      constraintCreationIsAsync: false
      indexOperationsAreAsync: false
      awaitIndex: null
      indexState: null
    oracle:
      engine: "Oracle"
      supportsIfNotExists: true
      supportsNamedItems: true
      supportsTextIndex: false
      constraintsRequireBackingIndex: false
      constraintCreationIsAsync: false
      indexOperationsAreAsync: false
      awaitIndex: null
      indexState: null
    sqlite:
      engine: "SQLite"
      supportsIfNotExists: true
      supportsNamedItems: true
      supportsTextIndex: false
      constraintsRequireBackingIndex: false
      constraintCreationIsAsync: false
      indexOperationsAreAsync: false
      awaitIndex: null
      indexState: null
  tuning:
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE"}
      stores: {neo4j: [], memgraph: [], falkordb: [], postgres: [], oracle: [], sqlite: []}
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", hnswM: 16}
      stores: {neo4j: [], memgraph: ["hnswM"], falkordb: [], postgres: ["hnswM"], oracle: ["hnswM"], sqlite: ["hnswM"]}
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", hnswM: 16, hnswEfConstruction: 200}
      stores:
        neo4j: []
        memgraph: ["hnswM", "hnswEfConstruction"]
        falkordb: []
        postgres: ["hnswM", "hnswEfConstruction"]
        oracle: ["hnswM", "hnswEfConstruction"]
        sqlite: ["hnswM", "hnswEfConstruction"]
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
      stores: {neo4j: [], memgraph: [], falkordb: [], postgres: [], oracle: [], sqlite: []}
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", efRuntime: 10}
      stores: {neo4j: [], memgraph: [], falkordb: [], postgres: [], oracle: [], sqlite: []}
    - spec:
        kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options:
          dimensions: 8
          similarity: "COSINE"
          hnswEfConstruction: 200
          quantizationEnabled: true
          efRuntime: 10
      stores:
        neo4j: []
        memgraph: ["hnswEfConstruction"]
        falkordb: []
        postgres: ["hnswEfConstruction"]
        oracle: ["hnswEfConstruction"]
        sqlite: ["hnswEfConstruction"]
  samples:
    - spec: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      limit: 10
      stores:
        neo4j: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: elementId(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        neo4j4: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        memgraph: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        falkordb: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        postgres: |-
          SELECT jsonb_build_object('properties', jsonb_build_object('email', (n.props ->> 'email')), 'count', COUNT(*),
                                    'nodes', to_jsonb((array_agg(jsonb_build_object('elementId', n.nid) ORDER BY n.nid))[1:10]))
          FROM drivine_node n
          WHERE n.labels @> '["Person"]' AND (n.props ->> 'email') IS NOT NULL
          GROUP BY (n.props ->> 'email')
          HAVING COUNT(*) > 1
          LIMIT 10
        oracle: |-
          SELECT JSON_OBJECT('properties' VALUE JSON_OBJECT('email' VALUE k0), 'count' VALUE MAX(c),
                             'nodes' VALUE JSON_ARRAYAGG(JSON_OBJECT('elementId' VALUE nid) ORDER BY nid RETURNING JSON) RETURNING JSON)
          FROM (SELECT n.nid, JSON_VALUE(n.props, '$.email') AS k0, COUNT(*) OVER (PARTITION BY JSON_VALUE(n.props, '$.email')) AS c, ROW_NUMBER() OVER (PARTITION BY JSON_VALUE(n.props, '$.email') ORDER BY n.nid) AS r
                FROM drivine_node n
                WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "Person")') AND JSON_VALUE(n.props, '$.email') IS NOT NULL)
          WHERE c > 1 AND r <= 10
          GROUP BY k0
          FETCH FIRST 10 ROWS ONLY
        sqlite: |-
          /* drivine:json */
          SELECT json_object('properties', json_object('email', k.k0), 'count', MAX(k.total),
                             'nodes', json_group_array(json_object('elementId', k.nid) ORDER BY k.nid) FILTER (WHERE k.position <= 10))
          FROM (
              SELECT n.nid, (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) AS k0,
                     row_number() OVER (PARTITION BY (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) ORDER BY n.nid) AS position,
                     COUNT(*) OVER (PARTITION BY (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END)) AS total
              FROM drivine_node n
              WHERE instr(n.labels, '"Person"') > 0 AND (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) IS NOT NULL
          ) k
          WHERE k.total > 1
          GROUP BY k0
          LIMIT 10
