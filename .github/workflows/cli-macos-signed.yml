# Builds the drivine CLI as a native binary on macOS (Apple silicon) with GraalVM, exactly as cli-native.yml builds it
# on linux, then signs it with a Developer ID Application certificate and notarizes it with Apple's notarytool, and
# uploads the signed, notarized binary as an artifact. This is how a macOS user's download is trusted by Gatekeeper.
#
# This workflow needs eight repo secrets (listed under the signing step's env). Until they are set it will fail at the
# signing step; that is expected while the signing material is being provisioned.
#
# Kept apart from cli-native.yml on purpose: that workflow is permissions: contents: read with no secrets, so fork
# pull requests can run it safely. Signing needs secrets, so it runs only on triggers under this repo's control
# (workflow_dispatch, and optionally release), never on a fork pull request.
name: CLI macOS signed

on:
  workflow_dispatch:
  # Enable once signing is proven green by hand, to sign the binary on each published release. Left commented so the
  # draft defaults to by-hand runs only; see the PR's OPEN QUESTIONS on release vs dispatch.
  # release:
  #   types: [published]

# No repo write is needed: the signed artifact is uploaded to the run, not committed. Secrets are read from the job's
# env below.
permissions:
  contents: read

concurrency:
  group: cli-macos-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign:
    name: build, sign and notarize (macos arm64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The same toolchain as cli-native.yml: JDK 21 (temurin) compiles the module as the toolchain asks, named in
      # JAVA_HOME_21_X64 for the build, and GraalVM takes JAVA_HOME and builds the image from the JDK 21 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm-community
          java-version: '25.0.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The Cypher compiler gradle/cypher-compiler.properties pins, as cli-native.yml has it.
      - name: Cache the pinned Cypher compiler
        uses: actions/cache@v4
        with:
          path: .compiler-repo
          key: cypher-compiler-${{ hashFiles('gradle/cypher-compiler.properties') }}
      - name: Publish the pinned Cypher compiler
        run: scripts/compiler-local.sh

      - name: Build the native binary
        run: ./gradlew --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 :drivine4j-cli:nativeCompile

      - name: Record the binary's size and start
        run: |
          binary=drivine4j-cli/build/native/nativeCompile/drivine
          bytes=$(stat -f %z "$binary")
          "$binary" --version
          {
            echo "### drivine, native, macOS arm64"
            echo
            echo "- Size: $bytes bytes ($(du -h "$binary" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sign with Developer ID + hardened runtime + timestamp, then notarize with notarytool --wait. The eight secrets
      # are passed through env; the action reads them from env and never from inputs, so none is interpolated into a
      # shell command line. The run fails here until the secrets are set.
      - name: Sign and notarize
        uses: ./.github/actions/sign-notarize-macos
        with:
          binary-path: drivine4j-cli/build/native/nativeCompile/drivine
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      # Zip the signed binary again for the artifact (an artifact keeps no file mode, and the binary is a lone
      # executable), so the download is the signed, notarized drivine.
      - name: Package the signed binary
        run: |
          ditto -c -k --keepParent \
            drivine4j-cli/build/native/nativeCompile/drivine \
            "$RUNNER_TEMP/drivine-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: drivine-macos-arm64-signed
          path: ${{ runner.temp }}/drivine-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # TODO(#707): an x86_64 (Intel) signed binary. The same job on runs-on: macos-13 (the last Intel image) builds and
  # signs the x86_64 binary; the composite action is architecture-agnostic. Left as a stub to keep this draft focused
  # on one architecture; add it once the arm64 path is proven green.
  #
  # build-sign-x86_64:
  #   name: build, sign and notarize (macos x86_64)
  #   runs-on: macos-13
  #   ... same steps as build-sign, artifact name drivine-macos-x86_64-signed ...
