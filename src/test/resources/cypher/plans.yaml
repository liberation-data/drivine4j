                - ["INFO", "SchemaManager", "Applying schema for owner 'schema' on 'default': 2 items (forceRecreate=false, versionChanged=false, version=v1)"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[name]"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[email]"]
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on Person[email]"]
                - ["INFO", "SchemaManager", "Schema for owner 'schema' on 'default': 2 created, 0 already matching, 0 recreated, 0 needing attention"]
