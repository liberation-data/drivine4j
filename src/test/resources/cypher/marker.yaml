    items: "RANGE_INDEX:Person:name:Person_name_range\nruntime:RANGE_INDEX:Person:name,born:person_name_born\nRANGE_INDEX:Person:name:Person_name_range\nruntime-stale:UNIQUENESS_CONSTRAINT:Person:id:Person_id_unique"
    read: {keys: ["RANGE_INDEX:Person:name:Person_name_range", "RANGE_INDEX:Person:name,born:person_name_born", "RANGE_INDEX:Person:name:Person_name_range", "UNIQUENESS_CONSTRAINT:Person:id:Person_id_unique"], runtime: ["RANGE_INDEX:Person:name,born:person_name_born", "UNIQUENESS_CONSTRAINT:Person:id:Person_id_unique"], stale: ["UNIQUENESS_CONSTRAINT:Person:id:Person_id_unique"]}
  - name: "Stale without runtime"
    record: {keys: ["RANGE_INDEX:Person:name:Person_name_range", "RANGE_INDEX:Person:name,born:person_name_born", "UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"], runtime: [], stale: ["UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"]}
    items: "RANGE_INDEX:Person:name:Person_name_range\nRANGE_INDEX:Person:name,born:person_name_born\nruntime-stale:UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"
    read: {keys: ["RANGE_INDEX:Person:name:Person_name_range", "RANGE_INDEX:Person:name,born:person_name_born", "UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"], runtime: ["UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"], stale: ["UNIQUENESS_CONSTRAINT:Person:email,tenant:Person_email_tenant_unique"]}
  - name: "Carried items"
    record: {keys: ["RANGE_INDEX:Person:name:Person_name_range", "VECTOR_INDEX:Doc:embedding:Doc_embedding_vector", "RANGE_INDEX:Order:total:Order_total_range"], runtime: ["RANGE_INDEX:Order:total:Order_total_range"], stale: []}
    items: "RANGE_INDEX:Person:name:Person_name_range\nVECTOR_INDEX:Doc:embedding:Doc_embedding_vector\nruntime:RANGE_INDEX:Order:total:Order_total_range"
    read: {keys: ["RANGE_INDEX:Person:name:Person_name_range", "VECTOR_INDEX:Doc:embedding:Doc_embedding_vector", "RANGE_INDEX:Order:total:Order_total_range"], runtime: ["RANGE_INDEX:Order:total:Order_total_range"], stale: []}
  - name: "Carried and stale"
