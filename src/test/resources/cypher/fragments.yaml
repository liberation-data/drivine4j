# Fragments: the parts of a statement a library writes itself, its object manager's filters and orders, as the module
# compiles them (SqlCypherCompiler.condition, value and order; the JSON entry's `fragment` request), so each library compares,
# sorts and binds a value as a compiled statement does, on each store and in each store layout. See README.md.
#
# Each case is one Cypher expression over the node `n`, a row `people_` of the graph's table of nodes, which the library
# knows has the label Person; the graph's indexed properties are `indexed`, as a library gives them (Oracle answers an
# equality through the index of a label and property it is given). `parameters` are written as the JSON entry takes them:
# a temporal value as {"$temporal": <kind>, "text": <ISO 8601>}.
#
# `sql` pins each store's terms, as the module gives them: the module's test holds it to them. `rows` is what Neo4j keeps
# or orders for the same expression, over the nodes `setup` makes, by id: `MATCH (n:Person) WHERE <condition> RETURN n.id`,
# or `MATCH (n:Person) RETURN n.id ORDER BY <order>, n.id`. Each library's runner makes the nodes on each SQL store, runs
# `SELECT ... FROM <graph>_node people_ WHERE <the label test> AND <condition>` (or ORDER BY the order's terms, then the
# id), and checks it keeps or orders those rows.

graph: "g"
indexed: [["Person", "name"], ["Person", "id"]]
variables: {n: {node: "people_", labels: ["Person"]}}

setup:
  - "CREATE (:Person {id: 'p1', name: 'Ada', born: date('1815-12-10'), age: 36, tags: ['math', 'poet'], `$k`: 'x'})"
  - "CREATE (:Person {id: 'p2', name: 'Grace', born: date('1906-12-09'), age: 85, tags: ['navy']})"
  - "CREATE (:Person {id: 'p3', name: 'ada', age: 36.0, born: localdatetime('1900-01-01T00:00')})"
  - "CREATE (:Person {id: 'p4', name: 7, born: datetime('2020-01-01T00:00Z'), tags: []})"
  - "CREATE (:Person {id: 'p5'})"

cases:
