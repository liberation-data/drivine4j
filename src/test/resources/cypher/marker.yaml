                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq2_DrivineStorekey_e211949b ON drivine_node n (CASE WHEN JSON_EXISTS(n.labels, ''$[*]?(@ == "DrivineStore")'') AND JSON_EXISTS(n.props, ''$.key'') THEN CASE WHEN CASE JSON_VALUE(n.props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN COALESCE(JSON_VALUE(n.props, ''$.key.s''), JSON_VALUE(n.props, ''$.key.v'')) WHEN ''number'' THEN TO_CHAR(JSON_VALUE(n.props, ''$.key'' RETURNING NUMBER), ''TM9'') WHEN ''double'' THEN CASE WHEN JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) = FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE)) AND JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) >= -9223372036854775808 AND JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) < 9223372036854775808 THEN TO_CHAR(CAST(FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) AS NUMBER) * 4294967296 + CAST(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) - FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) * 4294967296 AS NUMBER), ''TM9'') ELSE ''d'' || TO_CHAR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE)) END ELSE JSON_VALUE(n.props, ''$.key'') END IS NOT NULL THEN CASE JSON_VALUE(n.props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN JSON_VALUE(n.props, ''$.key."$t"'' RETURNING VARCHAR2(16)) WHEN ''double'' THEN ''number'' ELSE JSON_VALUE(n.props, ''$.key.type()'' RETURNING VARCHAR2(16)) END END END, CASE WHEN JSON_EXISTS(n.labels, ''$[*]?(@ == "DrivineStore")'') AND JSON_EXISTS(n.props, ''$.key'') THEN CASE JSON_VALUE(n.props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN COALESCE(JSON_VALUE(n.props, ''$.key.s''), JSON_VALUE(n.props, ''$.key.v'')) WHEN ''number'' THEN TO_CHAR(JSON_VALUE(n.props, ''$.key'' RETURNING NUMBER), ''TM9'') WHEN ''double'' THEN CASE WHEN JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) = FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE)) AND JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) >= -9223372036854775808 AND JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) < 9223372036854775808 THEN TO_CHAR(CAST(FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) AS NUMBER) * 4294967296 + CAST(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) - FLOOR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) * 4294967296 AS NUMBER), ''TM9'') ELSE ''d'' || TO_CHAR(JSON_VALUE(n.props, ''$.key'' RETURNING BINARY_DOUBLE)) END ELSE JSON_VALUE(n.props, ''$.key'') END END)';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          DECLARE
              v_labelled VARCHAR2(128);
          BEGIN
              SELECT MAX(JSON_VALUE(details, '$.labelled')) INTO v_labelled FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'DrivineStore' AND properties = '["key"]';
              IF v_labelled IS NOT NULL THEN
                  EXECUTE IMMEDIATE 'DROP INDEX IF EXISTS ' || v_labelled;
              END IF;
              UPDATE drivine_schema SET details = JSON_MERGEPATCH(details, '{"form": 2, "unique": "drivine_uq2_DrivineStorekey_e211949b", "labelled": null}') WHERE kind = 'RANGE_INDEX' AND label = 'DrivineStore' AND properties = '["key"]';
              COMMIT;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'UNIQUENESS_CONSTRAINT' AS kind, 'DrivineStore' AS label, '["key"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, 'DrivineStore_key_unique', 'drivine_uq2_DrivineStorekey_e211949b', '{"form": 2}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
              -- Another process recorded it between the MERGE's read and its insert: it is recorded.
              NULL;
          END;
    sqlite:
      engine: "SQLITE"
      prepare: "ddl[0]"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]',
               json_object('key', CAST($key AS TEXT), 'storeId', CAST($storeId AS TEXT), 'assignedAt', CAST($assignedAt AS TEXT), 'engine', CAST($engine AS TEXT), 'layout', CAST($layout AS INTEGER))
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE instr(n.labels, '"DrivineStore"') > 0 AND (CASE json_type(n.props, '$."key"') WHEN 'text' THEN n.props ->> '$."key"' WHEN 'null' THEN NULL ELSE n.props -> '$."key"' END) = CAST($key AS TEXT))
      readStamps: |-
        /* drivine:json */
        SELECT json_object('id', (CASE json_type(n.props, '$."storeId"') WHEN 'text' THEN n.props ->> '$."storeId"' WHEN 'null' THEN NULL ELSE n.props -> '$."storeId"' END), 'assignedAt', (CASE json_type(n.props, '$."assignedAt"') WHEN 'text' THEN n.props ->> '$."assignedAt"' WHEN 'null' THEN NULL ELSE n.props -> '$."assignedAt"' END), 'layout', (CASE WHEN json_type(n.props, '$."layout"') IN ('integer', 'real') THEN n.props ->> '$."layout"' END))
        FROM drivine_node n WHERE instr(n.labels, '"DrivineStore"') > 0
        ORDER BY (CASE json_type(n.props, '$."assignedAt"') WHEN 'text' THEN n.props ->> '$."assignedAt"' WHEN 'null' THEN NULL ELSE n.props -> '$."assignedAt"' END), (CASE json_type(n.props, '$."storeId"') WHEN 'text' THEN n.props ->> '$."storeId"' WHEN 'null' THEN NULL ELSE n.props -> '$."storeId"' END)
      foreignNodes: "SELECT 1 FROM drivine_node n WHERE NOT (instr(n.labels, '\"DrivineStore\"') > 0 OR instr(n.labels, '\"_DrivineSchema\"') > 0) LIMIT 1"
      restampLayout: |-
        UPDATE drivine_node SET props = json_set(props, '$.layout', CAST($layout AS INTEGER))
        WHERE nid IN (SELECT n.nid FROM drivine_node n WHERE instr(n.labels, '"DrivineStore"') > 0 AND (CASE json_type(n.props, '$."key"') WHEN 'text' THEN n.props ->> '$."key"' WHEN 'null' THEN NULL ELSE n.props -> '$."key"' END) = CAST($key AS TEXT))
          AND NOT EXISTS (SELECT 1 FROM drivine_node o WHERE NOT (instr(o.labels, '"DrivineStore"') > 0 OR instr(o.labels, '"_DrivineSchema"') > 0))
      layoutObjects: |-
        /* drivine:json */
        SELECT json_object('name', name, 'type', upper(type)) FROM sqlite_master
        WHERE (type = 'index' AND tbl_name = 'drivine_node') OR (type = 'table' AND name = 'drivine_lock2')
        ORDER BY name
      layout: 2
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq2_DrivineStorekey_e211949b ON drivine_node (COALESCE(props ->> '$.\"key\".\"$t\"', CASE json_type(props, '$.\"key\"') WHEN 'integer' THEN 'number' WHEN 'real' THEN 'number' WHEN 'true' THEN 'boolean' WHEN 'false' THEN 'boolean' WHEN 'null' THEN NULL ELSE json_type(props, '$.\"key\"') END), COALESCE(props ->> '$.\"key\".s', props ->> '$.\"key\".v', props ->> '$.\"key\"')) WHERE instr(labels, '\"DrivineStore\"') > 0"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', 'DrivineStore', '["key"]', 'DrivineStore_key_unique', 'drivine_uq2_DrivineStorekey_e211949b', '{"form": 2}')
          ON CONFLICT (kind, label, properties) DO NOTHING
storeLayout:
  # The verdict on a graph by its store layout (#161), StoreLayout.verdict: the stamps' layouts as readStamps gives them, whether
  # foreignNodes gives a row, and the indexes, tables and triggers layoutObjects lists. A verdict is "current", a re-stamp with
  # the earlier layout's objects dropped first, or a refusal with its message. A library asks again of the stamps it reads back
  # after a re-stamp, and refuses anything but "current".
  cases:
    - name: "In this layout, holding values"
      store: "postgres"
      stamps: [{layout: 2}]
      foreignNodes: true
      verdict: "current"
    - name: "In this layout, empty"
      store: "oracle"
      stamps: [{layout: 2}]
      foreignNodes: false
      verdict: "current"
    - name: "A graph engine's stamp with no layout"
      store: "neo4j"
      stamps: [{layout: null}]
      foreignNodes: true
      verdict: "current"
    - name: "A graph engine's stamp with a SQL store's layout"
      store: "memgraph"
      stamps: [{layout: 2}]
      foreignNodes: false
      verdict: {refuse: "The graph 'drivine' on Memgraph was written in store layout 2 by a later version of Drivine, and this version reads layout 1 only: upgrade Drivine to use it."}
    - name: "No layout, empty, with an earlier layout's indexes"
      store: "postgres"
      stamps: [{layout: null}]
      foreignNodes: false
      objects:
        - {name: "drivine_node_pkey", type: "INDEX"}
        - {name: "drivine_node_labels", type: "INDEX"}
        - {name: "drivine_uq_DrivineStorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq2_DrivineStorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq_Personemail_8e5a9c3b", type: "INDEX"}
        - {name: "drivine_ix_Personname_44ce5436", type: "INDEX"}
        - {name: "drivine_v_Docembedding_1a2b3c4d", type: "INDEX"}
      verdict:
        stamp:
          drops:
            - "DROP INDEX IF EXISTS drivine_uq_DrivineStorekey_e211949b"
            - "DROP INDEX IF EXISTS drivine_uq_Personemail_8e5a9c3b"
            - "DROP INDEX IF EXISTS drivine_ix_Personname_44ce5436"
            - "DROP INDEX IF EXISTS drivine_v_Docembedding_1a2b3c4d"
            - "DELETE FROM drivine_schema WHERE LOWER(object_name) IN ('drivine_uq_drivinestorekey_e211949b', 'drivine_uq_personemail_8e5a9c3b', 'drivine_ix_personname_44ce5436', 'drivine_v_docembedding_1a2b3c4d')"
    - name: "No layout, empty, with an earlier layout's indexes, on SQLite"
      store: "sqlite"
      stamps: [{layout: null}]
      foreignNodes: false
      objects:
        - {name: "drivine_node_labels", type: "INDEX"}
        - {name: "drivine_uq_DrivineStorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq2_DrivineStorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq_Personemail_8e5a9c3b", type: "INDEX"}
      verdict:
        stamp:
          drops:
            - "DROP INDEX IF EXISTS drivine_uq_DrivineStorekey_e211949b"
            - "DROP INDEX IF EXISTS drivine_uq_Personemail_8e5a9c3b"
            - "DELETE FROM drivine_schema WHERE LOWER(object_name) IN ('drivine_uq_drivinestorekey_e211949b', 'drivine_uq_personemail_8e5a9c3b')"
    - name: "An older layout, empty, with an earlier layout's indexes, tables and triggers, on Oracle"
      store: "oracle"
      stamps: [{layout: 1}]
      foreignNodes: false
      objects:
        - {name: "drivine_ix_key_19e3d", type: "INDEX"}
        - {name: "drivine_uq_drivinestorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq2_drivinestorekey_e211949b", type: "INDEX"}
        - {name: "drivine_lx_personname_44ce5436", type: "INDEX"}
        - {name: "drivine_t_chunktext_5f1e2d3c", type: "TABLE"}
        - {name: "drivine_t_chunktext_5f1e2d3c_t", type: "TRIGGER"}
        - {name: "drivine_t_chunktext_5f1e2d3c_i", type: "INDEX"}
        - {name: "drivine_node", type: "TABLE"}
      verdict:
        stamp:
          drops:
            - "DROP TRIGGER IF EXISTS drivine_t_chunktext_5f1e2d3c_t"
            - "DROP INDEX IF EXISTS drivine_ix_key_19e3d"
            - "DROP INDEX IF EXISTS drivine_uq_drivinestorekey_e211949b"
            - "DROP INDEX IF EXISTS drivine_lx_personname_44ce5436"
            - "DROP INDEX IF EXISTS drivine_t_chunktext_5f1e2d3c_i"
            - "DROP TABLE IF EXISTS drivine_t_chunktext_5f1e2d3c PURGE"
            - "DELETE FROM drivine_schema WHERE LOWER(object_name) IN ('drivine_ix_key_19e3d', 'drivine_uq_drivinestorekey_e211949b', 'drivine_lx_personname_44ce5436', 'drivine_t_chunktext_5f1e2d3c', 'drivine_t_chunktext_5f1e2d3c_t', 'drivine_t_chunktext_5f1e2d3c_i') OR LOWER(JSON_VALUE(details, '$.labelled')) IN ('drivine_ix_key_19e3d', 'drivine_uq_drivinestorekey_e211949b', 'drivine_lx_personname_44ce5436', 'drivine_t_chunktext_5f1e2d3c', 'drivine_t_chunktext_5f1e2d3c_t', 'drivine_t_chunktext_5f1e2d3c_i')"
    - name: "An older layout, empty, beside graphs whose names begin with its own, on Oracle"
      # Oracle lists every object whose name begins with the graph's: the graphs drivine_t's and drivine_v's are kept.
      store: "oracle"
      stamps: [{layout: 1}]
      foreignNodes: false
      objects:
        - {name: "drivine_t_node", type: "TABLE"}
        - {name: "drivine_t_node_labels", type: "INDEX"}
        - {name: "drivine_t_ix_personname_44ce5436", type: "INDEX"}
        - {name: "drivine_v_edge_dst", type: "INDEX"}
        - {name: "drivine_ix_personname_44ce5436", type: "INDEX"}
      verdict:
        stamp:
          drops:
            - "DROP INDEX IF EXISTS drivine_ix_personname_44ce5436"
            - "DELETE FROM drivine_schema WHERE LOWER(object_name) IN ('drivine_ix_personname_44ce5436') OR LOWER(JSON_VALUE(details, '$.labelled')) IN ('drivine_ix_personname_44ce5436')"
    - name: "An older layout, empty, nothing left of it"
      store: "sqlite"
      stamps: [{layout: 1}]
      foreignNodes: false
      verdict: {stamp: {drops: []}}
    - name: "No stamp, empty"
      # A new graph, its stamp not yet assigned: used, and stamped as a stamp is first made.
      store: "postgres"
      stamps: []
      foreignNodes: false
      verdict: "current"
    - name: "No layout, holding values"
      store: "postgres"
      stamps: [{layout: null}]
      foreignNodes: true
      verdict: {refuse: "The graph 'drivine' on Postgres was written in store layout 1, and this version of Drivine reads layout 2 only, which holds values otherwise. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "An older layout, holding values"
      store: "oracle"
      stamps: [{layout: 1}]
      foreignNodes: true
      verdict: {refuse: "The graph 'drivine' on Oracle was written in store layout 1, and this version of Drivine reads layout 2 only, which holds values otherwise. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "No stamp, holding values"
      store: "sqlite"
      stamps: []
      foreignNodes: true
      verdict: {refuse: "The graph 'drivine' on SQLite was written in store layout 1, and this version of Drivine reads layout 2 only, which holds values otherwise. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "A later layout"
      store: "postgres"
      stamps: [{layout: 3}]
      foreignNodes: false
      verdict: {refuse: "The graph 'drivine' on Postgres was written in store layout 3 by a later version of Drivine, and this version reads layout 2 only: upgrade Drivine to use it."}
    - name: "A later layout, on a graph engine"
      store: "falkordb"
      stamps: [{layout: 2}]
      foreignNodes: true
      verdict: {refuse: "The graph 'drivine' on FalkorDB was written in store layout 2 by a later version of Drivine, and this version reads layout 1 only: upgrade Drivine to use it."}
    - name: "Stamps of two layouts"
      store: "postgres"
      stamps: [{layout: 2}, {layout: null}]
      foreignNodes: false
      verdict: {refuse: "The graph 'drivine' on Postgres has store stamps of layouts 1 and 2: two versions of Drivine stamped it at once. This version of Drivine reads layout 2 only. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "Read back after a re-stamp that found values, raced by an earlier library"
      store: "sqlite"
      stamps: [{layout: null}]
      foreignNodes: true
      verdict: {refuse: "The graph 'drivine' on SQLite was written in store layout 1, and this version of Drivine reads layout 2 only, which holds values otherwise. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "Read back after a re-stamp"
      store: "oracle"
      stamps: [{layout: 2}]
      foreignNodes: false
      verdict: "current"
    - name: "Cleared and loaded again: no stamp, holding values, and this layout's objects"
      # MATCH (n) DETACH DELETE n deletes Drivine's own nodes too, the stamp among them; values written after it are this
      # layout's, as the store's objects show: stamped again, by the stamp's assignIfAbsent, not refused.
      store: "postgres"
      stamps: []
      foreignNodes: true
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
        - {name: "drivine_node_labels", type: "INDEX"}
        - {name: "drivine_uq2_DrivineStorekey_e211949b", type: "INDEX"}
      verdict: {stamp: {drops: [], assign: true}}
    - name: "Cleared, nothing loaded: no stamp, empty, this layout's lock table alone"
      store: "sqlite"
      stamps: []
      foreignNodes: false
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
      verdict: "current"
    - name: "No stamp, holding values, and objects of this layout and an earlier one"
      store: "oracle"
      stamps: []
      foreignNodes: true
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
        - {name: "drivine_uq2_drivinestorekey_e211949b", type: "INDEX"}
        - {name: "drivine_uq_personemail_8e5a9c3b", type: "INDEX"}
      verdict: {refuse: "The graph 'drivine' on Oracle has no store stamp, and holds objects of store layout 2 (drivine_lock2, drivine_uq2_drivinestorekey_e211949b) and of an earlier layout (drivine_uq_personemail_8e5a9c3b): two versions of Drivine made it. This version of Drivine reads layout 2 only. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "Cleared, nothing loaded: no stamp, empty, an earlier layout's objects and this layout's lock table"
      # A graph of an earlier layout whose stamp a clear deleted: on Postgres the library's prepare has made the lock table
      # by the time it lists the objects. Nothing to lose: the earlier layout's dropped, then asked again, current.
      store: "postgres"
      stamps: []
      foreignNodes: false
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
        - {name: "drivine_node_labels", type: "INDEX"}
        - {name: "drivine_uq_DrivineStorekey_e211949b", type: "INDEX"}
      verdict:
        stamp:
          drops:
            - "DROP INDEX IF EXISTS drivine_uq_DrivineStorekey_e211949b"
            - "DELETE FROM drivine_schema WHERE LOWER(object_name) IN ('drivine_uq_drivinestorekey_e211949b')"
    - name: "Read back after those drops"
      store: "postgres"
      stamps: []
      foreignNodes: false
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
        - {name: "drivine_node_labels", type: "INDEX"}
      verdict: "current"
    - name: "Cleared and loaded again, on Oracle, beside graphs whose names begin with its own"
      # Oracle lists every object whose name begins with the graph's: drivine_t's lock table and its names are neither this
      # graph's nor an earlier layout's.
      store: "oracle"
      stamps: []
      foreignNodes: true
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
        - {name: "drivine_t_lock2", type: "TABLE"}
        - {name: "drivine_t_uq2_drivinestorekey_e211949b", type: "INDEX"}
        - {name: "drivine_t_ix_personname_44ce5436", type: "INDEX"}
      verdict: {stamp: {drops: [], assign: true}}
    - name: "No stamp, holding values, and only another graph's objects, on Oracle"
      store: "oracle"
      stamps: []
      foreignNodes: true
      objects:
        - {name: "drivine_t_lock2", type: "TABLE"}
        - {name: "drivine_t_uq2_drivinestorekey_e211949b", type: "INDEX"}
      verdict: {refuse: "The graph 'drivine' on Oracle was written in store layout 1, and this version of Drivine reads layout 2 only, which holds values otherwise. Reload it: export it with the Drivine version that wrote it and import it with this one; see the upgrade notes."}
    - name: "Cleared and loaded again, on SQLite: this layout's lock table alone"
      store: "sqlite"
      stamps: []
      foreignNodes: true
      objects:
        - {name: "drivine_lock2", type: "TABLE"}
      verdict: {stamp: {drops: [], assign: true}}
    - name: "No stamp, holding values, on a graph engine"
      # A graph engine's layout is its own: no stamp is layout 1, current.
      store: "neo4j"
      stamps: []
      foreignNodes: true
      verdict: "current"
  # The order a library asks in, which no statement of the module's can hold it to: the verdict on a graph's first connection
  # comes before the store's ensuring or ddl and the stamp's prepare make anything, as this layout's lock table, which they
  # make, is the verdict's evidence that a graph without a stamp is of this layout. Each library's runner sets each case up
  # on the store (its statements, {graph} the graph the runner uses), opens a manager of the graph, and checks that its first
  # connection refuses the graph and that none of `absent` was made.
  firstConnection:
    - name: "An earlier layout's graph holding values, with no stamp: refused before anything is made"
      store: "postgres"
      setup:
        - "CREATE TABLE {graph}_node (nid bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, labels jsonb NOT NULL, props jsonb NOT NULL)"
        - "INSERT INTO {graph}_node (labels, props) VALUES ('[\"Person\"]', '{\"name\": \"Ada\", \"born\": \"1815-12-10\"}')"
      refused: true
      absent: ["{graph}_lock2"]
    - name: "An earlier layout's graph holding values, with no stamp: refused before anything is made, on Oracle"
      store: "oracle"
      setup:
        - "CREATE TABLE {graph}_node (nid NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY, labels JSON NOT NULL, props JSON NOT NULL)"
        - "INSERT INTO {graph}_node (labels, props) VALUES ('[\"Person\"]', '{\"name\": \"Ada\", \"born\": \"1815-12-10\"}')"
      refused: true
      absent: ["{graph}_lock2"]
    - name: "An earlier layout's graph holding values, with no stamp: refused before anything is made, on SQLite"
      store: "sqlite"
      setup:
        - "CREATE TABLE {graph}_node (nid INTEGER PRIMARY KEY AUTOINCREMENT, labels TEXT NOT NULL, props TEXT NOT NULL)"
        - "INSERT INTO {graph}_node (labels, props) VALUES ('[\"Person\"]', '{\"name\": \"Ada\", \"born\": \"1815-12-10\"}')"
      refused: true
      absent: ["{graph}_lock2"]
nodeStamps:
  property: "__drivine.stamp"
  token: 16
  separator: ":"
  neverStamped: "-"
  tokens:
    - {bits: "0", token: "0000000000000000"}
    - {bits: "1", token: "0000000000000001"}
    - {bits: "-1", token: "ffffffffffffffff"}
    - {bits: "-9223372036854775808", token: "8000000000000000"}
    - {bits: "9223372036854775807", token: "7fffffffffffffff"}
    - {bits: "4587410805208705190", token: "3fa9c1d27b40e8a6"}
    - {bits: "-7953622155270522349", token: "919f0eca356c7a13"}
    - {bits: "255", token: "00000000000000ff"}
