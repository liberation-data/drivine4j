      - cypher: "MATCH (n:CyTemporal) WHERE n.id =~ 'time[0-9]' RETURN n.id ORDER BY n.at"
        only: [neo4j, sql]
        rows: ["time5", "time6", "time0", "time2", "time7", "time1", "time4", "time3"]
      - cypher: "MATCH (n:CyTemporal) WHERE n.id =~ 'localdatetime[0-9]' RETURN n.id ORDER BY n.at"
        only: [neo4j, sql]
