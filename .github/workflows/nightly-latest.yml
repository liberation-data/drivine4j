      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results-POSTGRES
          path: |
            **/build/test-results/test/
            build/test-results-spring/
            **/build/reports/tests/test/
          retention-days: 14

  # A scheduled run that fails opens one issue, and none while that issue is open: the failed runs are
  # listed on the workflow's page, each with the releases it ran. A run started by hand opens none.
  report-failure:
    needs: [ cypher-spec, test, test-falkordb, test-memgraph, test-oracle, test-postgres ]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: The nightly run on the latest engine images fails
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh issue list --state open --limit 500 --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$open" ]; then
            echo "#$open is open for it."
          else
            gh issue create --title "$TITLE" --body "$RUN failed. In each job, the step that pulls the images names the release of each one. Fix Drivine for the new release, move its pin in gradle/test-images.txt, and close this issue: the next failure opens another. See TEST_CONTAINERS.md, \"Pinned images and the nightly run\"."
          fi
