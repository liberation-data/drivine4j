# Releases drivine4j to Maven Central. RELEASING.md describes the process.
#
# - A push to main that raises build.gradle's version (the merge of a "Release vX.Y.Z" PR) publishes it, and tags
#   the commit vX.Y.Z. A push to main that changes build.gradle without raising the version publishes nothing.
# - A push of a tag vX.Y.Z, by hand, publishes too: the fallback.
# - Either way, the full CI runs, every published module is built, signed and checked, and nmcp uploads them to the
#   Central Portal in one bundle, as one deployment.
# - workflow_dispatch, and a pull request that changes the release machinery, are dry runs: everything but the
#   publish, signed with a throwaway key, with the Maven repository and the Central Portal bundle left as the run's
#   artifact to inspect.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    # A push to main runs this only when it changes the version's file. GitHub doesn't apply paths to a tag push.
    paths:
      - build.gradle
  # Always a dry run. Pick the branch or tag to try in "Use workflow from".
  workflow_dispatch:
  # A dry run, so a change to the release machinery is tested on its pull request.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - RELEASING.md
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/wrapper/gradle-wrapper.jar
      - drivine4j-*/build.gradle
      - scripts/release_version.py
      - scripts/test_release_version.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The modules published to Maven Central, by artifactId. drivine4j-sample is not published.
  MODULES: >-
    drivine4j
    drivine4j-codegen
    drivine4j-codegen-java
    drivine4j-codegen-model
    drivine4j-coroutines
    drivine4j-spring
    drivine4j-spring-boot-starter

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The build and publish jobs run this commit's ./gradlew, the publish job with the release secrets: its
      # gradle-wrapper.jar, a binary a review can't read, has to be one Gradle released.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The semver arithmetic the next step relies on, tested with the runner's python3 and nothing installed.
      - name: Test the version arithmetic
        run: python3 scripts/test_release_version.py
      - name: Work out the version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          declared=$(sed -n "s/^version = '\([^']*\)'[[:space:]]*$/\1/p" build.gradle)
          if [[ -z "$declared" || "$declared" == *$'\n'* ]]; then
            echo "::error::build.gradle should have one line version = 'X.Y.Z'."
            exit 1
          fi
          # Each published module takes the root's version, so the root's is the one to check.
          for f in drivine4j-*/build.gradle; do
            if grep -q "id 'maven-publish'" "$f" && ! grep -q '^version = rootProject.version' "$f"; then
              echo "::error::$f publishes, but doesn't take its version from the root (version = rootProject.version)."
              exit 1
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The tag $tag isn't vX.Y.Z (or vX.Y.Z-suffix). Delete it and tag the release commit vX.Y.Z."
              exit 1
            fi
            version="${tag#v}"
            if [[ "$version" != "$declared" ]]; then
              echo "::error::The tag $tag is version $version, but build.gradle's version is $declared. Tag the commit whose version is $version, or bump build.gradle in a release PR first."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::The tag $tag is on $GITHUB_SHA, which isn't on $DEFAULT_BRANCH. Tag the release PR's merge commit on $DEFAULT_BRANCH."
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A push to main that changed build.gradle. It releases the version when that is a new one, greater than
            # the newest tag, vX.Y.Z or X.Y.Z (0.0.3 and 0.3.0 were made by hand without the v). github-release then
            # makes the tag.
            version="$declared"
            tag="v$version"
            newest=$(git tag -l | python3 scripts/release_version.py newest)
            publish=false
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::build.gradle's version $version isn't X.Y.Z (or X.Y.Z-suffix), so it can't be released."
              exit 1
            elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::notice::build.gradle's version $version is already tagged $tag, so this push releases nothing. A change to build.gradle that isn't a version bump does this."
            elif [[ -n "$newest" ]] && ! python3 scripts/release_version.py greater "$version" "${newest#v}"; then
              echo "::notice::build.gradle's version $version isn't later than the last release, $newest, so this push releases nothing."
            else
              publish=true
            fi
          else
            version="$declared"
            tag="v$version"
            publish=false
          fi
          echo "Version $version, publish: $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The full CI, as ci.yml runs it on a push or a pull request. A push that releases nothing stops at check: ci.yml
  # runs on the same push to main by itself.
  gate:
    needs: check
    if: needs.check.outputs.publish == 'true' || github.event_name != 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # ci.yml's test reports are check runs (mikepenz/action-junit-report).
      checks: write

  # A push that releases nothing skips gate, and so this and the jobs after it.
  build:
    needs: [check, gate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Gradle cache: the release is built from nothing but the checked-out ref.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Maven Central doesn't have this version yet
        run: |
          # Only an answer of 200 stops a release. When Maven Central can't be asked, the step goes on: the portal
          # rejects a version it already has.
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/org/drivine/drivine4j/$VERSION/drivine4j-$VERSION.pom" || true)
          if [[ "$status" == 200 ]]; then
            if [[ "$PUBLISH" == true ]]; then
              echo "::error::Maven Central already has org.drivine:drivine4j:$VERSION, so this run publishes nothing. If merging its version bump released it, and this is a tag pushed for it by hand afterwards, there is nothing left to do. Otherwise bump the version in a release PR."
              exit 1
            fi
            echo "::warning::Maven Central already has org.drivine:drivine4j:$VERSION. A dry run goes on; a tag of it would fail here."
          elif [[ "$status" != 404 ]]; then
            echo "::warning::Couldn't ask Maven Central whether it has org.drivine:drivine4j:$VERSION (HTTP $status). Going on: the Central Portal rejects a version it already has."
          fi
      # The dry run signs as the release does, but with a key made here and thrown away with the runner.
      - name: Make a throwaway signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key 'Drivine release dry run <dry-run@invalid>' rsa3072 sign 1d
          gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys > "$RUNNER_TEMP/dry-run-key.asc"
      # Every module, as ci.yml builds it (the gate ran the tests), then the bundle nmcp uploads: every published
      # module's publication, staged and signed, in one zip, build/nmcp/zip/publicationAggregated.zip.
      - name: Build, sign and bundle the publications
        run: |
          SIGNING_KEY="$(cat "$RUNNER_TEMP/dry-run-key.asc")" \
            ./gradlew build -x test -x standaloneTest zipAggregationPublication --no-daemon
        env:
          SIGN: 'true'
          SIGNING_PASSWORD: dry-run
      - name: Check the publications
        run: |
          mkdir -p release/maven-repo
          cp build/nmcp/zip/publicationAggregated.zip release/
          unzip -q release/publicationAggregated.zip -d release/maven-repo
          staged=$(ls release/maven-repo/org/drivine | sort | tr '\n' ' ')
          expected=$(tr ' ' '\n' <<< "$MODULES" | sort | tr '\n' ' ')
          if [[ "$staged" != "$expected" ]]; then
            echo "::error::The staged modules are [$staged], not [$expected]."
            exit 1
          fi
          for m in $MODULES; do
            dir="release/maven-repo/org/drivine/$m/$VERSION"
            for f in "$m-$VERSION.jar" "$m-$VERSION-sources.jar" "$m-$VERSION-javadoc.jar" "$m-$VERSION.pom" "$m-$VERSION.module"; do
              [[ -f "$dir/$f" ]] || { echo "::error::$m has no $f."; exit 1; }
              gpg --batch --verify "$dir/$f.asc" "$dir/$f" 2> /dev/null || { echo "::error::$f's signature doesn't verify."; exit 1; }
            done
            grep -q "<version>$VERSION</version>" "$dir/$m-$VERSION.pom" || { echo "::error::$m's pom isn't version $VERSION."; exit 1; }
          done
          {
            echo "### Staged for Maven Central: $VERSION"
            echo '```'
            (cd release/maven-repo && find . -type f ! -name '*.md5' ! -name '*.sha*' | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-${{ env.VERSION }}
          path: release/
          if-no-files-found: error

  # nmcp signs and uploads in one Gradle build, so this job builds the bundle again from the same commit,
  # signed with the release key, checks it as build checked its own, and uploads it as one deployment: the Central
  # Portal releases every module or none.
  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      # build.gradle falls back to the gpg command when SIGNING_KEY isn't an armored key, which fails less clearly.
      - name: The release secrets are set
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          missing=()
          [[ "$SIGNING_KEY" == *'BEGIN PGP PRIVATE KEY BLOCK'* ]] || missing+=('SIGNING_KEY (an ASCII-armored private key)')
          [[ -n "$SIGNING_PASSWORD" ]] || missing+=(SIGNING_PASSWORD)
          [[ -n "$SONATYPE_USERNAME" ]] || missing+=(CENTRAL_PORTAL_USERNAME)
          [[ -n "$SONATYPE_PASSWORD" ]] || missing+=(CENTRAL_PORTAL_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::The release environment is missing: ${missing[*]}."
            exit 1
          fi
      - name: Build and sign the bundle
        run: ./gradlew zipAggregationPublication --no-daemon
        env:
          SIGN: 'true'
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      # Signing isn't required by build.gradle, so a signature that's missing is caught here, before the upload.
      - name: Check the bundle
        run: |
          mkdir -p uploaded/maven-repo
          cp build/nmcp/zip/publicationAggregated.zip uploaded/
          unzip -q uploaded/publicationAggregated.zip -d uploaded/maven-repo
          for m in $MODULES; do
            dir="uploaded/maven-repo/org/drivine/$m/$VERSION"
            for f in "$m-$VERSION.jar" "$m-$VERSION-sources.jar" "$m-$VERSION-javadoc.jar" "$m-$VERSION.pom" "$m-$VERSION.module"; do
              [[ -f "$dir/$f" && -f "$dir/$f.asc" ]] || { echo "::error::$m has no $f, or no signature of it."; exit 1; }
            done
          done
          [[ $(ls uploaded/maven-repo/org/drivine | wc -l) -eq $(wc -w <<< "$MODULES") ]] || { echo "::error::The bundle doesn't hold exactly the modules in MODULES."; exit 1; }
      - name: Publish to Maven Central
        run: ./gradlew publishAggregatedPublicationToCentralPortal --no-daemon
        env:
          SIGN: 'true'
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maven-central-uploaded-${{ needs.check.outputs.version }}
          path: uploaded/publicationAggregated.zip
          if-no-files-found: warn

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On a push to main, the tag doesn't exist yet: the release makes it, on the commit this run built. A tag made
      # with GITHUB_TOKEN starts no workflow, so it doesn't run this again. A tag pushed by hand is already there.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag "${prerelease[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "${prerelease[@]}"
          fi
