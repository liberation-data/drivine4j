rootProject.name = 'drivine4j'

// Code generation modules
include 'drivine4j-codegen'        // KSP processor for Kotlin
include 'drivine4j-codegen-java'   // APT processor for Java

// Spring Framework adapter: DrivineTransactionManager (no Boot)
include 'drivine4j-spring'

// Transactions for Kotlin coroutines: a suspend transaction block (kotlinx-coroutines)
include 'drivine4j-coroutines'

// Spring Boot starter module
include 'drivine4j-spring-boot-starter'

// Studio: read-only endpoints for browsing views and fragments and running loadAll against them.
// Opt-in; nothing else depends on it. Its browser app is the drivine-studio repository.
include 'drivine4j-studio'

// Sample application demonstrating usage
include 'drivine4j-sample'
