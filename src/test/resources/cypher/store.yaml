  samples:
    - spec: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      limit: 10
      stores:
        neo4j: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: elementId(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        neo4j4: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        memgraph: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        falkordb: |-
          MATCH (n:Person)
          WHERE n.email IS NOT NULL
          WITH n.email AS _k0, count(*) AS _count, collect({elementId: id(n)}) AS _nodes
          WHERE _count > 1
          RETURN {properties: {email: _k0}, count: _count, nodes: _nodes[0..10]}
          LIMIT 10
        postgres: |-
          SELECT jsonb_build_object('properties', jsonb_build_object('email', (n.props ->> 'email')), 'count', COUNT(*),
                                    'nodes', to_jsonb((array_agg(jsonb_build_object('elementId', n.nid) ORDER BY n.nid))[1:10]))
          FROM drivine_node n
          WHERE n.labels @> '["Person"]' AND (n.props ->> 'email') IS NOT NULL
          GROUP BY (n.props ->> 'email')
          HAVING COUNT(*) > 1
          LIMIT 10
        oracle: |-
          SELECT JSON_OBJECT('properties' VALUE JSON_OBJECT('email' VALUE k0), 'count' VALUE MAX(c),
                             'nodes' VALUE JSON_ARRAYAGG(JSON_OBJECT('elementId' VALUE nid) ORDER BY nid RETURNING JSON) RETURNING JSON)
          FROM (SELECT n.nid, COALESCE(JSON_VALUE(n.props, '$.email.v'), JSON_VALUE(n.props, '$.email')) AS k0, COUNT(*) OVER (PARTITION BY COALESCE(JSON_VALUE(n.props, '$.email.v'), JSON_VALUE(n.props, '$.email'))) AS c, ROW_NUMBER() OVER (PARTITION BY COALESCE(JSON_VALUE(n.props, '$.email.v'), JSON_VALUE(n.props, '$.email')) ORDER BY n.nid) AS r
                FROM drivine_node n
                WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "Person")') AND COALESCE(JSON_VALUE(n.props, '$.email.v'), JSON_VALUE(n.props, '$.email')) IS NOT NULL)
          WHERE c > 1 AND r <= 10
          GROUP BY k0
          FETCH FIRST 10 ROWS ONLY
        sqlite: |-
          /* drivine:json */
          SELECT json_object('properties', json_object('email', k.k0), 'count', MAX(k.total),
                             'nodes', json_group_array(json_object('elementId', k.nid) ORDER BY k.nid) FILTER (WHERE k.position <= 10))
          FROM (
              SELECT n.nid, (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) AS k0,
                     row_number() OVER (PARTITION BY (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) ORDER BY n.nid) AS position,
                     COUNT(*) OVER (PARTITION BY (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END)) AS total
              FROM drivine_node n
              WHERE instr(n.labels, '"Person"') > 0 AND (CASE json_type(n.props, '$."email"') WHEN 'text' THEN n.props ->> '$."email"' WHEN 'null' THEN NULL ELSE n.props -> '$."email"' END) IS NOT NULL
          ) k
          WHERE k.total > 1
          GROUP BY k0
          LIMIT 10
