        gqlStatus: "50N11"
        message: "Unable to create Constraint( name='x', type='NODE PROPERTY UNIQUENESS' ):"
      - code: "N/A"
        gqlStatus: "22N80"
        message: "Index entry conflict: Both Node(0) and Node(1) have the label `Person` and property `email` = 'a@b.c'."
    stores:
