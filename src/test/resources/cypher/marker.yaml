storeStamp:
  label: "DrivineStore"
  keyProperty: "key"
  key: "singleton"
  constraint: {kind: "UNIQUENESS_CONSTRAINT", label: "DrivineStore", properties: ["key"]}
  parameters: ["key", "storeId", "assignedAt", "engine"]
  stores:
    neo4j:
      engine: "NEO4J"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt } AS stamp
        ORDER BY s.assignedAt, s.storeId
      constraint:
        - "CREATE CONSTRAINT `DrivineStore_key_unique` IF NOT EXISTS FOR (n:`DrivineStore`) REQUIRE (n.`key`) IS UNIQUE"
    memgraph:
      engine: "MEMGRAPH"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt } AS stamp
        ORDER BY s.assignedAt, s.storeId
      constraint:
        - "CREATE CONSTRAINT ON (n:DrivineStore) ASSERT n.key IS UNIQUE"
    falkordb:
      engine: "FALKORDB"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt } AS stamp
        ORDER BY s.assignedAt, s.storeId
      constraint:
        - {native: ["GRAPH.CONSTRAINT", "CREATE", "{graphName}", "UNIQUE", "NODE", "DrivineStore", "PROPERTIES", "1", "key"]}
    postgres:
      engine: "POSTGRES"
      prepare: "ensuring"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]',
               jsonb_build_object('key', CAST($key AS text), 'storeId', CAST($storeId AS text), 'assignedAt', CAST($assignedAt AS text), 'engine', CAST($engine AS text))
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE n.labels @> '["DrivineStore"]' AND (n.props ->> 'key') = CAST($key AS text))
      readStamps: |-
        SELECT jsonb_build_object('id', (n.props ->> 'storeId'), 'assignedAt', (n.props ->> 'assignedAt'))
        FROM drivine_node n WHERE n.labels @> '["DrivineStore"]'
        ORDER BY (n.props ->> 'assignedAt'), (n.props ->> 'storeId')
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineStorekey_e211949b ON drivine_node (((props ->> 'key'))) WHERE labels @> '[\"DrivineStore\"]'"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', 'DrivineStore', '["key"]', 'DrivineStore_key_unique', 'drivine_uq_DrivineStorekey_e211949b', '{}')
          ON CONFLICT (kind, label, properties) DO NOTHING
    oracle:
      engine: "ORACLE"
      prepare: "ensuring"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]', JSON_OBJECT('key' VALUE $key, 'storeId' VALUE $storeId, 'assignedAt' VALUE $assignedAt, 'engine' VALUE $engine)
        FROM dual
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "DrivineStore")') AND JSON_VALUE(n.props, '$.key') = $key)
      readStamps: |-
        SELECT JSON_OBJECT('id' VALUE JSON_VALUE(n.props, '$.storeId'), 'assignedAt' VALUE JSON_VALUE(n.props, '$.assignedAt') RETURNING JSON)
        FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "DrivineStore")')
        ORDER BY JSON_VALUE(n.props, '$.assignedAt'), JSON_VALUE(n.props, '$.storeId')
      constraint:
        - |-
          DECLARE
              e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
              e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
          BEGIN
              FOR attempt IN 1 .. 300 LOOP
                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE INDEX IF NOT EXISTS drivine_ix_key_19e5f ON drivine_node (JSON_VALUE(props, ''$.key''))';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'RANGE_INDEX' AS kind, 'DrivineStore' AS label, '["key"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, 'DrivineStore_key_range', 'drivine_ix_key_19e5f', '{"unique": "drivine_uq_DrivineStorekey_e211949b"}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
              -- Another process recorded it between the MERGE's read and its insert: it is recorded.
              NULL;
          END;
        - |-
          DECLARE
              e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
              e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
          BEGIN
              FOR attempt IN 1 .. 300 LOOP
                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineStorekey_e211949b ON drivine_node n (CASE WHEN JSON_EXISTS(n.labels, ''$[*]?(@ == "DrivineStore")'') AND JSON_EXISTS(n.props, ''$.key'') THEN JSON_VALUE(n.props, ''$.key'') END)';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          DECLARE
              v_labelled VARCHAR2(128);
          BEGIN
              SELECT MAX(JSON_VALUE(details, '$.labelled')) INTO v_labelled FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'DrivineStore' AND properties = '["key"]';
              IF v_labelled IS NOT NULL THEN
                  EXECUTE IMMEDIATE 'DROP INDEX IF EXISTS ' || v_labelled;
              END IF;
              UPDATE drivine_schema SET details = JSON_MERGEPATCH(details, '{"unique": "drivine_uq_DrivineStorekey_e211949b", "labelled": null}') WHERE kind = 'RANGE_INDEX' AND label = 'DrivineStore' AND properties = '["key"]';
              COMMIT;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'UNIQUENESS_CONSTRAINT' AS kind, 'DrivineStore' AS label, '["key"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, 'DrivineStore_key_unique', 'drivine_uq_DrivineStorekey_e211949b', '{}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
              -- Another process recorded it between the MERGE's read and its insert: it is recorded.
              NULL;
          END;
    sqlite:
      engine: "SQLITE"
      prepare: "ddl[0]"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]',
               json_object('key', CAST($key AS TEXT), 'storeId', CAST($storeId AS TEXT), 'assignedAt', CAST($assignedAt AS TEXT), 'engine', CAST($engine AS TEXT))
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE instr(n.labels, '"DrivineStore"') > 0 AND (CASE json_type(n.props, '$."key"') WHEN 'text' THEN n.props ->> '$."key"' WHEN 'null' THEN NULL ELSE n.props -> '$."key"' END) = CAST($key AS TEXT))
      readStamps: |-
        /* drivine:json */
        SELECT json_object('id', (CASE json_type(n.props, '$."storeId"') WHEN 'text' THEN n.props ->> '$."storeId"' WHEN 'null' THEN NULL ELSE n.props -> '$."storeId"' END), 'assignedAt', (CASE json_type(n.props, '$."assignedAt"') WHEN 'text' THEN n.props ->> '$."assignedAt"' WHEN 'null' THEN NULL ELSE n.props -> '$."assignedAt"' END))
        FROM drivine_node n WHERE instr(n.labels, '"DrivineStore"') > 0
        ORDER BY (CASE json_type(n.props, '$."assignedAt"') WHEN 'text' THEN n.props ->> '$."assignedAt"' WHEN 'null' THEN NULL ELSE n.props -> '$."assignedAt"' END), (CASE json_type(n.props, '$."storeId"') WHEN 'text' THEN n.props ->> '$."storeId"' WHEN 'null' THEN NULL ELSE n.props -> '$."storeId"' END)
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineStorekey_e211949b ON drivine_node ((CASE json_type(props, '$.\"key\"') WHEN 'text' THEN props ->> '$.\"key\"' WHEN 'null' THEN NULL ELSE props -> '$.\"key\"' END)) WHERE instr(labels, '\"DrivineStore\"') > 0"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', 'DrivineStore', '["key"]', 'DrivineStore_key_unique', 'drivine_uq_DrivineStorekey_e211949b', '{}')
          ON CONFLICT (kind, label, properties) DO NOTHING
