# One part of CI's tests, on containers of its own: the steps ci.yml's test jobs share. scripts/ci-test-part.sh says
# what each part runs.
name: Test a part
description: Runs one part of a variant's tests, as scripts/ci-test-part.sh names it, and reports and uploads its results.
inputs:
  variant:
    description: APOC_SORT_MAPS, CALL_SUBQUERY, FALKORDB, MEMGRAPH, ORACLE or POSTGRES.
    required: true
  part:
    description: A shard, i/n, or nightly, spring or all, as scripts/ci-test-part.sh takes it.
    required: true
  name:
    description: The job's name for the variant, as in its check, test (<name>).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    # The Cypher compiler gradle/cypher-compiler.properties pins: a release is read from Maven Central, and a commit
    # between releases is published into .compiler-repo for the build to read: see the script.
    - name: Cache the pinned Cypher compiler
      uses: actions/cache@v4
      with:
        path: .compiler-repo
        key: cypher-compiler-${{ hashFiles('gradle/cypher-compiler.properties') }}
    - name: Publish the pinned Cypher compiler
      shell: bash
      run: scripts/compiler-local.sh

    # Docker 29+ raised minimum API version to 1.44; Testcontainers 1.x defaults to 1.32
    - name: Configure Testcontainers for Docker 29+
      shell: bash
      run: echo "api.version=1.44" > ~/.docker-java.properties

    # Pulled here and not by the first test that asks for it, so the time the image takes is not counted against the
    # container's start. The images are the ones OracleTestContainer and PostgresTestContainer name.
    - name: Pull the Oracle image
      if: inputs.variant == 'ORACLE'
      shell: bash
      run: docker pull gvenzl/oracle-free:23-faststart
    - name: Pull the Postgres image
      if: inputs.variant == 'APOC_SORT_MAPS' || inputs.variant == 'POSTGRES'
      shell: bash
      run: docker pull pgvector/pgvector:pg17

    - name: Run the tests
      shell: bash
      run: scripts/ci-test-part.sh "${{ inputs.variant }}" "${{ inputs.part }}"

    # An artifact's name can't hold a slash: shard 1/3 is 1-of-3. Named, and uploaded, on a job cancelled or past its
    # timeout-minutes too, so it keeps the results its earlier steps left.
    - name: Name the results
      id: results
      if: always()
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: echo "suffix=${{ inputs.variant }}-${PART//\//-of-}" >> "$GITHUB_OUTPUT"

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      if: success() || failure()
      with:
        report_paths: |
          **/build/test-results/test/*.xml
          build/test-results/standaloneTest/*.xml
          build/test-results-*/*.xml
        detailed_summary: true
        include_passed: true
        check_name: Test Results (${{ inputs.name }}, ${{ inputs.part }})
        require_tests: ${{ inputs.variant == 'ORACLE' || inputs.variant == 'POSTGRES' }}
        annotate_only: false
        fail_on_failure: false

    # Each step's results where scripts/ci-test-part.sh left them, which scripts/ci_test_sets.py and
    # scripts/ci_test_times.py read, and the HTML reports.
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ steps.results.outputs.suffix }}
        path: |
          **/build/test-results/test/
          build/test-results/standaloneTest/
          build/test-results-*/
          **/build/reports/tests/test/
        retention-days: 30

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-report-${{ steps.results.outputs.suffix }}
        path: '**/build/reports/jacoco/test/'
        if-no-files-found: ignore
        retention-days: 30
