    rows:
      - label: "Proposition"
        properties: ["contextId", "status", "embedding"]
        types: {contextId: ["RANGE"], status: ["RANGE"], embedding: ["VECTOR"]}
        options:
          contextId: {}
          status: {}
          embedding: {dimension: 1536, similarityFunction: "cosine", M: 16, efConstruction: 200, efRuntime: 10}
        entitytype: "NODE"
        status: "OPERATIONAL"
    stores:
      falkordb:
        items:
          - {kind: "RANGE_INDEX", label: "Proposition", properties: ["contextId", "status"], status: "OPERATIONAL"}
          - kind: "VECTOR_INDEX"
            label: "Proposition"
            properties: ["embedding"]
            dimensions: 1536
            similarity: "COSINE"
            status: "OPERATIONAL"
            hnswM: 16
            hnswEfConstruction: 200
        aliases: [[], []]
  - name: "Full-text properties read back as one item, a property both range and full-text"
