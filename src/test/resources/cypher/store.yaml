        items:
          - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], status: "UNDER CONSTRUCTION"}
          - {kind: "UNIQUENESS_CONSTRAINT", label: "Membership", properties: ["tenantId", "userId"], status: "FAILED"}
        aliases: [[], []]
  - name: "The catalog's records of each kind, read back as the items they record, and a row that is not a map passed over"
    listing: "indexes"
