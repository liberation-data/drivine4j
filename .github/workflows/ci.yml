# Builds and tests drivine4j. The tests run on test containers (see TEST_CONTAINERS.md), in a job for each variant:
# Neo4j with each collection sort strategy (APOC_SORT_MAPS, CALL_SUBQUERY), FalkorDB, Memgraph, Oracle and Postgres.
# Each variant's job is split over parallel jobs, each with containers of its own, and scripts/ci-test-part.sh says
# what each part runs. nightly-latest.yml runs each variant's tests each night, whole, on the latest engine images:
# keep it in step.
#
# A pull request's run leaves out the classes marked @Nightly (org.drivine.test.Nightly): the timings, the plans Oracle
# makes, the texts past 32 KB on Oracle, and the Postgres tests that vacuum or analyze a table to a state. A full run
# adds a `nightly` part to each variant: a push to main, a pull request labelled `full-ci`, nightly.yml each night, and
# release.yml's gate. release.yml calls this as its gate, on the commit it releases, unless a full push or pull_request
# run of it has already passed on the same tree.
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    # As the default, and labeled, so that labelling a pull request `full-ci` runs the full set on it.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_call:
    inputs:
      full:
        description: Run the nightly part of each variant too, as a release and the nightly do.
        type: boolean
        default: false

# A pull request's newer run, of a later push or a label, takes the place of the one still going. Any other run, and
# this workflow called by another, is a group of its own.
concurrency:
  group: ${{ github.workflow == 'CI' && github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

jobs:
  # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
  # this run and skip its gate (scripts/ci_trust.py). It matters on a pull request, which tests its merge ref, not the
  # head commit the run names. A run of the pull request set alone, without the nightly parts, names it
  # ci-tree-pr-set-<tree>, which a release doesn't trust. It has no condition, as no job here may: release.yml trusts a
  # run only when every job in it passed, and a job skipped by a condition doesn't.
  tree:
    name: record the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
          echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      # Overwritten when the run is re-run, as an artifact's name is unique within a run.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tree-${{ !(inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'pr-set-' || '' }}${{ steps.tree.outputs.tree }}
          path: ci-tree.txt
          if-no-files-found: error
          overwrite: true

  # The Cypher spec's copies are the tag VERSION names, unchanged, and a later tag is shown as a warning.
  cypher-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the Cypher spec
        run: scripts/check-cypher-spec.sh

  # The version script's tests, which also check that its list of the files naming the version (the sample's model
  # file and the README's install snippets) matches them, so a snippet added or reworded fails here and not in the
  # next Prepare release. And the tests of release.yml's other script, ci_trust.py.
  release-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the version script
        run: python3 scripts/test_release_version.py

      - name: Test the CI trust script
        run: python3 scripts/test_ci_trust.py

  # Compiles and assembles every module, once: the test jobs below compile what their tests need.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      # The build writes each module's model file, .drivine/model.json, and the one committed must be it.
      - name: Check the model files are current
        run: |
          if [ -n "$(git status --porcelain -- ':(glob)**/.drivine/model.json')" ]; then
            echo "A model file differs from what the build writes. Build, and commit .drivine/model.json."
            git status --short -- ':(glob)**/.drivine/model.json'
            git diff -- ':(glob)**/.drivine/model.json'
            exit 1
          fi

  # The whole suite on Neo4j, as `./gradlew test standaloneTest` runs it, with each collection sort strategy. The
  # Postgres tests don't read the strategy, so this job runs them, and CALL_SUBQUERY's doesn't.
  test-apoc-part:
    name: test (APOC_SORT_MAPS, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'nightly' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/3", "2/3", "3/3", "nightly"]' || '["1/3", "2/3", "3/3"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: APOC_SORT_MAPS
          part: ${{ matrix.part }}
          name: APOC_SORT_MAPS

  # The check the job gave before it was split: it passes when every part passed. It runs whatever they concluded,
  # as no job here may be skipped (see `tree`).
  test-apoc:
    name: test (APOC_SORT_MAPS)
    needs: test-apoc-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts concluded ${{ needs.test-apoc-part.result }}."
          [ "${{ needs.test-apoc-part.result }}" = success ]

  # The whole suite on Neo4j again, with the strategy CALL_SUBQUERY.
  test-call-subquery-part:
    name: test (CALL_SUBQUERY, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'nightly' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/2", "2/2", "nightly"]' || '["1/2", "2/2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: CALL_SUBQUERY
          part: ${{ matrix.part }}
          name: CALL_SUBQUERY

  # The check the job gave before it was split: it passes when every part passed. It runs whatever they concluded,
  # as no job here may be skipped (see `tree`).
  test-call-subquery:
    name: test (CALL_SUBQUERY)
    needs: test-call-subquery-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts concluded ${{ needs.test-call-subquery-part.result }}."
          [ "${{ needs.test-call-subquery-part.result }}" = success ]

  # The sample module on FalkorDB, and the rest as a plain `./gradlew test` runs it; then, in the first part, the root
  # module's Spring tests FalkorDB can run, on a FalkorDB datasource.
  test-falkordb-part:
    name: test (FalkorDB, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'nightly' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/2", "2/2", "nightly"]' || '["1/2", "2/2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: FALKORDB
          part: ${{ matrix.part }}
          name: FalkorDB

  # The check the job gave before it was split: it passes when every part passed. It runs whatever they concluded,
  # as no job here may be skipped (see `tree`).
  test-falkordb:
    name: test (FalkorDB)
    needs: test-falkordb-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts concluded ${{ needs.test-falkordb-part.result }}."
          [ "${{ needs.test-falkordb-part.result }}" = success ]

  # The same on Memgraph.
  test-memgraph-part:
    name: test (Memgraph, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'nightly' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/2", "2/2", "nightly"]' || '["1/2", "2/2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: MEMGRAPH
          part: ${{ matrix.part }}
          name: Memgraph

  # The check the job gave before it was split: it passes when every part passed. It runs whatever they concluded,
  # as no job here may be skipped (see `tree`).
  test-memgraph:
    name: test (Memgraph)
    needs: test-memgraph-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts concluded ${{ needs.test-memgraph-part.result }}."
          [ "${{ needs.test-memgraph-part.result }}" = success ]

  # The Oracle tests are left out of a plain `./gradlew test`, which the jobs above run: ORACLE_TESTS enables them.
  # Its shards run the root module's; its part `spring` the sample app's, the coroutines module's and the root module's
  # Spring tests on an Oracle datasource, as the Postgres job does: a graph engine's job proves nothing of the SQL
  # Drivine writes for Oracle.
  test-oracle-part:
    name: test (Oracle, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'nightly' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/2", "2/2", "spring", "nightly"]' || '["1/2", "2/2", "spring"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: ORACLE
          part: ${{ matrix.part }}
          name: Oracle

  # The check the job gave before it was split: it passes when every part passed. It runs whatever they concluded,
  # as no job here may be skipped (see `tree`).
  test-oracle:
    name: test (Oracle)
    needs: test-oracle-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts concluded ${{ needs.test-oracle-part.result }}."
          [ "${{ needs.test-oracle-part.result }}" = success ]

  # The Postgres tests run in a plain `./gradlew test`, so APOC_SORT_MAPS's job runs them. This runs the sample app's and
  # the root module's Spring tests on a Postgres datasource, which no other job does. It isn't split: it has no nightly
  # class, and takes less time than a part of the others.
  test-postgres:
    runs-on: ubuntu-latest
    name: test (Postgres)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-part
        with:
          variant: POSTGRES
          part: all
          name: Postgres
