              - now: 1000000
                actions:
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], status: "OPERATIONAL"}]}
              - now: 1000000
                actions:
                  - {execute: {statement: "CREATE INDEX FOR (n:Person) ON (n.email)"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "_DrivineSchema", properties: ["scope"], status: "OPERATIONAL"}, {kind: "RANGE_INDEX", label: "Person", properties: ["name", "email"], status: "OPERATIONAL"}]}
              - now: 1000000
