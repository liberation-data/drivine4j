      neo4j: {violation: true, blockedByIndex: false, buildTimeout: false, alreadyIndexed: false}
      memgraph: {violation: true, blockedByIndex: false, buildTimeout: false, alreadyIndexed: false}
      falkordb: {violation: true, blockedByIndex: false, buildTimeout: false, alreadyIndexed: false}
