        items:
          - kind: "VECTOR_INDEX"
            label: "Doc"
            properties: ["embedding"]
            name: "doc_vec"
            dimensions: 3
            similarity: "COSINE"
          - {kind: "FULLTEXT_INDEX", label: "Doc", properties: ["title", "body"], analyzer: "english"}
          - {kind: "RANGE_INDEX", label: "Person", properties: ["name", "born"], name: "r"}
          - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}
        aliases: [[], [], ["person_name", "legacy"], []]
      oracle:
        items:
          - kind: "VECTOR_INDEX"
            label: "Doc"
            properties: ["embedding"]
            name: "doc_vec"
            dimensions: 3
            similarity: "COSINE"
          - {kind: "FULLTEXT_INDEX", label: "Doc", properties: ["title", "body"], analyzer: "english"}
          - {kind: "RANGE_INDEX", label: "Person", properties: ["name", "born"], name: "r"}
          - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}
        aliases: [[], [], ["person_name", "legacy"], []]
      sqlite:
        items:
          - kind: "VECTOR_INDEX"
            label: "Doc"
            properties: ["embedding"]
            name: "doc_vec"
