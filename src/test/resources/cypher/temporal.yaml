      - cypher: "MATCH (n:CyTemporal) WHERE n.id =~ 'datetime[0-9]' RETURN n.id ORDER BY n.at"
        only: [neo4j, sql]
        rows: ["datetime2", "datetime4", "datetime7", "datetime1", "datetime5", "datetime0", "datetime6", "datetime3"]
      - cypher: "MATCH (n:CyTemporal) WHERE n.at IN [date('2065-06-27'), date('+821765819-09-24'), date('-1806-10-13'), date('+839561317-09-05'), date('2044-03-01'), date('2077-03-08'), date('1966-02-20'), date('1989-05-18')] RETURN count(n)"
