declarations:
  - name: "Identical declarations are one"
    specs:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
    items: [{kind: "RANGE_INDEX", label: "Person", properties: ["name"]}]
  - name: "One key's declarations in two orders disagree"
    specs:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name", "born"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["born", "name"]}
    conflict: "Conflicting schema declarations for RANGE_INDEX on Person[name, born] (they disagree on portable parameters): RangeIndexSpec(label=Person, properties=[name, born], name=null, ignoreCase=false); RangeIndexSpec(label=Person, properties=[born, name], name=null, ignoreCase=false)"
  - name: "Other names disagree"
    specs:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "a"}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "b"}
    conflict: "Conflicting schema declarations for RANGE_INDEX on Person[name] (they disagree on portable parameters): RangeIndexSpec(label=Person, properties=[name], name=a, ignoreCase=false); RangeIndexSpec(label=Person, properties=[name], name=b, ignoreCase=false)"
  - name: "Two vector sizes disagree"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE"}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 16, similarity: "COSINE"}
    conflict: "Conflicting schema declarations for VECTOR_INDEX on Chunk[embedding] (they disagree on portable parameters): VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[]); VectorIndexSpec(label=Chunk, property=embedding, dimensions=16, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[])"
  - name: "A vector declaration that pins engine options wins whole"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE"}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE"}
    items:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
  - name: "Two that pin engine options differently disagree"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", efRuntime: 10}
    conflict: "Conflicting schema declarations for VECTOR_INDEX on Chunk[embedding] (more than one declaration pins engine options): VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[Neo4jVectorOptions(quantizationEnabled=false, hnswM=null, hnswEfConstruction=null)]); VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[FalkorDbVectorOptions(hnswM=null, hnswEfConstruction=null, efRuntime=10)])"
  - name: "A portable HNSW parameter is part of the declaration"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE"}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", hnswM: 16}
    conflict: "Conflicting schema declarations for VECTOR_INDEX on Chunk[embedding] (they disagree on portable parameters): VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[]); VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=16, hnswEfConstruction=null, engineOptions=[])"
  - name: "A constraint that knows its node id property wins"
    specs:
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], nodeIdProperty: "uuid"}
    items: [{kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], nodeIdProperty: "uuid"}]
  - name: "Of constraints that know their node id property, the first wins"
    specs:
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], nodeIdProperty: "uuid"}
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], nodeIdProperty: "id"}
    items: [{kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], nodeIdProperty: "uuid"}]
  - name: "Two that pin the same engine options are one"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
    items:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
  - name: "A conflict names each distinct declaration once, without its engine options"
    specs:
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 8, similarity: "COSINE", quantizationEnabled: false}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 16, similarity: "COSINE"}
      - kind: "VECTOR_INDEX"
        label: "Chunk"
        properties: ["embedding"]
        options: {dimensions: 16, similarity: "COSINE"}
    conflict: "Conflicting schema declarations for VECTOR_INDEX on Chunk[embedding] (they disagree on portable parameters): VectorIndexSpec(label=Chunk, property=embedding, dimensions=8, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[]); VectorIndexSpec(label=Chunk, property=embedding, dimensions=16, similarity=COSINE, name=null, hnswM=null, hnswEfConstruction=null, engineOptions=[])"
  - name: "Keys are kept in the order first declared, of every kind"
    specs:
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      - {kind: "FULLTEXT_INDEX", label: "Doc", properties: ["title"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
    items:
      - {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
      - {kind: "FULLTEXT_INDEX", label: "Doc", properties: ["title"]}
  - name: "An index that ignores case is another item than one that doesn't"
    specs:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"], ignoreCase: true}
    items:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"]}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"], ignoreCase: true}
  - name: "Declarations that ignore case are compared as declared, and the conflict names the copies they are made over"
    specs:
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"], ignoreCase: true}
      - {kind: "RANGE_INDEX", label: "Person", properties: ["email"], name: "Person_email_ci_range", ignoreCase: true}
    conflict: "Conflicting schema declarations for RANGE_INDEX on Person[__drivine.lower.email] (they disagree on portable parameters): RangeIndexSpec(label=Person, properties=[email], name=null, ignoreCase=true); RangeIndexSpec(label=Person, properties=[email], name=Person_email_ci_range, ignoreCase=true)"
