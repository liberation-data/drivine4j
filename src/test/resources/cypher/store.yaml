    functions:
      - |-
        CREATE OR REPLACE FUNCTION drivine_nulls_equal(cy_x JSON, cy_y JSON) RETURN NUMBER IS
            FUNCTION eq(a JSON_ELEMENT_T, b JSON_ELEMENT_T) RETURN NUMBER IS
                r NUMBER := 1;
                e NUMBER;
                la JSON_ARRAY_T;
                lb JSON_ARRAY_T;
                oa JSON_OBJECT_T;
                ob JSON_OBJECT_T;
                ks JSON_KEY_LIST;
                too_long EXCEPTION;
                PRAGMA EXCEPTION_INIT(too_long, -40478);
            BEGIN
                IF a.is_Null OR b.is_Null THEN RETURN NULL; END IF;
                IF a.is_Array AND b.is_Array THEN
                    la := TREAT(a AS JSON_ARRAY_T);
                    lb := TREAT(b AS JSON_ARRAY_T);
                    IF la.get_Size <> lb.get_Size THEN RETURN 0; END IF;
                    FOR i IN 0 .. la.get_Size - 1 LOOP
                        e := eq(la.get(i), lb.get(i));
                        IF e = 0 THEN RETURN 0; END IF;
                        IF e IS NULL THEN r := NULL; END IF;
                    END LOOP;
                    RETURN r;
                END IF;
                IF a.is_Object AND b.is_Object THEN
                    oa := TREAT(a AS JSON_OBJECT_T);
                    ob := TREAT(b AS JSON_OBJECT_T);
                    IF oa.get_Size <> ob.get_Size THEN RETURN 0; END IF;
                    ks := oa.get_Keys;
                    FOR i IN 1 .. ks.COUNT LOOP
                        IF NOT ob.has(ks(i)) THEN RETURN 0; END IF;
                        e := eq(oa.get(ks(i)), ob.get(ks(i)));
                        IF e = 0 THEN RETURN 0; END IF;
                        IF e IS NULL THEN r := NULL; END IF;
                    END LOOP;
                    RETURN r;
                END IF;
                IF a.is_Number AND b.is_Number THEN RETURN CASE WHEN a.to_Number = b.to_Number THEN 1 ELSE 0 END; END IF;
                IF a.is_String AND b.is_String THEN
                    BEGIN
                        RETURN CASE WHEN a.to_String = b.to_String THEN 1 ELSE 0 END;
                    EXCEPTION WHEN too_long THEN
                        RETURN CASE WHEN DBMS_LOB.COMPARE(a.to_Clob, b.to_Clob) = 0 THEN 1 ELSE 0 END;
                    END;
                END IF;
                IF a.is_Boolean AND b.is_Boolean THEN RETURN CASE WHEN a.to_Boolean = b.to_Boolean THEN 1 ELSE 0 END; END IF;
                RETURN 0;
            END;
        BEGIN
            RETURN eq(JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_x RETURNING CLOB)), JSON_ELEMENT_T.parse(JSON_SERIALIZE(cy_y RETURNING CLOB)));
        END;
      - |-
        CREATE OR REPLACE FUNCTION drivine_era(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
        BEGIN
            IF ASCII(t) < 49 THEN
                RETURN REGEXP_REPLACE(t, '^(-[0-9]{4}|0000)', TO_CHAR(TO_NUMBER(REGEXP_SUBSTR(t, '^-?[0-9]{4}')) - 1, 'FM0000'));
            END IF;
            RETURN t;
        END;
      - |-
        CREATE OR REPLACE FUNCTION drivine_era_date(t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
        BEGIN
            IF SUBSTR(t, 1, 1) = '-' THEN
                RETURN TO_CHAR(TO_NUMBER(SUBSTR(t, 1, 5)) + 1, 'FM0000') || SUBSTR(t, 6);
            END IF;
            RETURN t;
        END;
      - |-
        CREATE OR REPLACE FUNCTION drivine_temporal_key(k VARCHAR2, t VARCHAR2) RETURN VARCHAR2 DETERMINISTIC IS
            l PLS_INTEGER := LENGTH(t);
            p PLS_INTEGER := INSTR(t, 'T');
            z PLS_INTEGER := 0;
            o NUMBER := 0;
            y NUMBER;
            m NUMBER;
            d NUMBER;
            u NUMBER;
            c NUMBER;
            tm VARCHAR2(40);
            f VARCHAR2(9);
            FUNCTION days(yy NUMBER, mm NUMBER) RETURN NUMBER IS
            BEGIN
                IF mm IN (4, 6, 9, 11) THEN RETURN 30; END IF;
                IF mm = 2 THEN
                    IF MOD(yy, 4) = 0 AND (MOD(yy, 100) <> 0 OR MOD(yy, 400) = 0) THEN RETURN 29; END IF;
                    RETURN 28;
                END IF;
                RETURN 31;
            END;
            FUNCTION digits(n NUMBER, w PLS_INTEGER) RETURN VARCHAR2 IS
            BEGIN
                RETURN LPAD(TO_CHAR(n), w, '0');
            END;
        BEGIN
            IF t IS NULL OR k IS NULL OR k = 'duration' THEN RETURN NULL; END IF;
            IF k IN ('time', 'datetime') THEN
                IF SUBSTR(t, l, 1) = 'Z' THEN
                    z := 1;
                ELSE
                    z := 6;
                    o := CASE WHEN SUBSTR(t, l - 5, 1) = '-' THEN -1 ELSE 1 END * (TO_NUMBER(SUBSTR(t, l - 4, 2)) * 3600 + TO_NUMBER(SUBSTR(t, l - 1, 2)) * 60);
                END IF;
            END IF;
            IF k = 'date' THEN
                RETURN digits(TO_NUMBER(SUBSTR(t, 1, l - 6)) + 1000000000, 10) || SUBSTR(t, l - 4, 2) || SUBSTR(t, l - 1, 2);
            ELSIF k IN ('localdatetime', 'datetime') THEN
                y := TO_NUMBER(SUBSTR(t, 1, p - 7));
                m := TO_NUMBER(SUBSTR(t, p - 5, 2));
                d := TO_NUMBER(SUBSTR(t, p - 2, 2));
                tm := SUBSTR(t, p + 1, l - p - z);
            ELSE
                tm := SUBSTR(t, 1, l - z);
            END IF;
            f := SUBSTR(SUBSTR(tm, 10) || '000000000', 1, 9);
            u := TO_NUMBER(SUBSTR(tm, 1, 2)) * 3600 + TO_NUMBER(SUBSTR(tm, 4, 2)) * 60 + TO_NUMBER(SUBSTR(tm, 7, 2));
            IF k = 'localtime' THEN RETURN digits(u * 1000000000 + TO_NUMBER(f), 14); END IF;
            IF k = 'time' THEN RETURN digits(u * 1000000000 + TO_NUMBER(f) - o * 1000000000 + 64800000000000, 15) || digits(o + 64800, 6); END IF;
            IF k = 'localdatetime' THEN
                RETURN digits(y + 1000000000, 10) || SUBSTR(t, p - 5, 2) || SUBSTR(t, p - 2, 2) || SUBSTR(tm, 1, 2) || SUBSTR(tm, 4, 2) || SUBSTR(tm, 7, 2) || f;
            END IF;
            u := u - o;
            c := CASE WHEN u < 0 THEN -1 WHEN u >= 86400 THEN 1 ELSE 0 END;
            u := u - c * 86400;
            IF c < 0 THEN
                IF d > 1 THEN d := d - 1; ELSIF m > 1 THEN m := m - 1; d := days(y, m); ELSE y := y - 1; m := 12; d := 31; END IF;
            ELSIF c > 0 THEN
                IF d < days(y, m) THEN d := d + 1; ELSIF m < 12 THEN m := m + 1; d := 1; ELSE y := y + 1; m := 1; d := 1; END IF;
            END IF;
            RETURN digits(y + 1000000000, 10) || digits(m, 2) || digits(d, 2) || digits(TRUNC(u / 3600), 2) || digits(MOD(TRUNC(u / 60), 60), 2) || digits(MOD(u, 60), 2) || f || digits(o + 64800, 6);
        END;
    ensuring: |2-
