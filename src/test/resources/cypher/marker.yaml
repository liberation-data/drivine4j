# The schema marker and the stamps: what each store keeps of the marker `_DrivineSchema` and of the store's stamp
# `DrivineStore`, the statements that read and write them, the marker's inventory as it is written and read back, the
# version token, and the node stamp's form. Captured from drivine4j, the reference, with no store. See README.md.

graph: "drivine"
marker:
  label: "_DrivineSchema"
  scopeProperty: "scope"
  defaultScope: "schema"
  separator: "\n"
  runtimePrefix: "runtime:"
  staleRuntimePrefix: "runtime-stale:"
  constraint: {kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"]}
  scopesCypher: "MATCH (m:`_DrivineSchema`) RETURN DISTINCT m.scope"
  stores:
    neo4j:
      prepare: null
      read:
        version: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.version ORDER BY m.appliedAt DESC LIMIT 1"
        items: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.items ORDER BY m.appliedAt DESC LIMIT 1"
      readParameters: ["scope"]
      # The server's clock, timestamp(), binding no $now, as drivine4j writes it; the SQL stores bind the caller's. Kept on
      # purpose: one clock for every store would be a change of its own, made in every library at once.
      merge: "MERGE (m:`_DrivineSchema` {scope: $scope}) SET m.version = $version, m.items = $items, m.appliedAt = timestamp()"
      mergeParameters: ["scope", "version", "items"]
      deleteAllButNewest: "MATCH (m:`_DrivineSchema` {scope: $scope}) WITH m ORDER BY m.appliedAt DESC SKIP 1 DELETE m"
      delete: "MATCH (m:`_DrivineSchema` {scope: $scope}) DELETE m"
      scopes: null
      itemsMark: ""
      constraint:
        - "CREATE CONSTRAINT `_DrivineSchema_scope_unique` IF NOT EXISTS FOR (n:`_DrivineSchema`) REQUIRE (n.`scope`) IS UNIQUE"
    memgraph:
      prepare: null
      read:
        version: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.version ORDER BY m.appliedAt DESC LIMIT 1"
        items: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.items ORDER BY m.appliedAt DESC LIMIT 1"
      readParameters: ["scope"]
      # The server's clock, timestamp(), binding no $now, as drivine4j writes it; the SQL stores bind the caller's. Kept on
      # purpose: one clock for every store would be a change of its own, made in every library at once.
      merge: "MERGE (m:`_DrivineSchema` {scope: $scope}) SET m.version = $version, m.items = $items, m.appliedAt = timestamp()"
      mergeParameters: ["scope", "version", "items"]
      deleteAllButNewest: "MATCH (m:`_DrivineSchema` {scope: $scope}) WITH m ORDER BY m.appliedAt DESC SKIP 1 DELETE m"
      delete: "MATCH (m:`_DrivineSchema` {scope: $scope}) DELETE m"
      scopes: null
      itemsMark: ""
      constraint:
        - "CREATE CONSTRAINT ON (n:_DrivineSchema) ASSERT n.scope IS UNIQUE"
    falkordb:
      prepare: null
      read:
        version: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.version ORDER BY m.appliedAt DESC LIMIT 1"
        items: "MATCH (m:`_DrivineSchema` {scope: $scope}) RETURN m.items ORDER BY m.appliedAt DESC LIMIT 1"
      readParameters: ["scope"]
      # The server's clock, timestamp(), binding no $now, as drivine4j writes it; the SQL stores bind the caller's. Kept on
      # purpose: one clock for every store would be a change of its own, made in every library at once.
      merge: "MERGE (m:`_DrivineSchema` {scope: $scope}) SET m.version = $version, m.items = $items, m.appliedAt = timestamp()"
      mergeParameters: ["scope", "version", "items"]
      deleteAllButNewest: "MATCH (m:`_DrivineSchema` {scope: $scope}) WITH m ORDER BY m.appliedAt DESC SKIP 1 DELETE m"
      delete: "MATCH (m:`_DrivineSchema` {scope: $scope}) DELETE m"
      scopes: null
      itemsMark: ""
      constraint:
        - {native: ["GRAPH.CONSTRAINT", "CREATE", "{graphName}", "UNIQUE", "NODE", "_DrivineSchema", "PROPERTIES", "1", "scope"]}
    postgres:
      prepare: "ensuring"
      read:
        version: "SELECT (n.props ->> 'version') FROM drivine_node n WHERE n.labels @> '[\"_DrivineSchema\"]' AND (n.props ->> 'scope') = CAST($scope AS text) ORDER BY CASE WHEN jsonb_typeof((n.props -> 'appliedAt')) = 'number' THEN (n.props ->> 'appliedAt')::numeric END DESC NULLS LAST, n.nid DESC LIMIT 1"
        items: "SELECT (n.props ->> 'items') FROM drivine_node n WHERE n.labels @> '[\"_DrivineSchema\"]' AND (n.props ->> 'scope') = CAST($scope AS text) ORDER BY CASE WHEN jsonb_typeof((n.props -> 'appliedAt')) = 'number' THEN (n.props ->> 'appliedAt')::numeric END DESC NULLS LAST, n.nid DESC LIMIT 1"
      readParameters: ["scope"]
      merge: |-
        WITH found AS (SELECT m.nid FROM drivine_node m WHERE m.labels @> '["_DrivineSchema"]' AND (m.props ->> 'scope') = CAST($scope AS text) ORDER BY CASE WHEN jsonb_typeof((m.props -> 'appliedAt')) = 'number' THEN (m.props ->> 'appliedAt')::numeric END DESC NULLS LAST, m.nid DESC LIMIT 1),
        written AS (
            UPDATE drivine_node n
            SET props = jsonb_strip_nulls(n.props || jsonb_build_object('version', CAST($version AS text), 'items', CAST($items AS text), 'appliedAt', CAST($now AS bigint)))
            FROM found WHERE n.nid = found.nid
            RETURNING n.nid)
        INSERT INTO drivine_node (labels, props)
        SELECT '["_DrivineSchema"]',
               jsonb_strip_nulls(jsonb_build_object('scope', CAST($scope AS text), 'version', CAST($version AS text), 'items', CAST($items AS text), 'appliedAt', CAST($now AS bigint)))
        WHERE NOT EXISTS (SELECT 1 FROM found)
      mergeParameters: ["scope", "version", "items", "now"]
      deleteAllButNewest: |-
        DELETE FROM drivine_node WHERE nid IN (
            SELECT nid FROM (SELECT n.nid, row_number() OVER (ORDER BY CASE WHEN jsonb_typeof((n.props -> 'appliedAt')) = 'number' THEN (n.props ->> 'appliedAt')::numeric END DESC NULLS LAST, n.nid DESC) AS position FROM drivine_node n WHERE n.labels @> '["_DrivineSchema"]' AND (n.props ->> 'scope') = CAST($scope AS text)) ranked
            WHERE position > 1)
      delete: "DELETE FROM drivine_node n WHERE n.labels @> '[\"_DrivineSchema\"]' AND (n.props ->> 'scope') = CAST($scope AS text)"
      scopes: null
      itemsMark: ""
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineSchemascope_4cab9cbb ON drivine_node (((props ->> 'scope'))) WHERE labels @> '[\"_DrivineSchema\"]'"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', '_DrivineSchema', '["scope"]', '_DrivineSchema_scope_unique', 'drivine_uq_DrivineSchemascope_4cab9cbb', '{}')
          ON CONFLICT (kind, label, properties) DO NOTHING
    oracle:
      prepare: "ensuring"
      read:
        version: "SELECT JSON_VALUE(n.props, '$.version' RETURNING CLOB) FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == \"_DrivineSchema\")') AND JSON_VALUE(n.props, '$.scope') = $scope ORDER BY JSON_VALUE(n.props, '$.appliedAt' RETURNING NUMBER) DESC NULLS LAST, n.nid DESC FETCH FIRST 1 ROWS ONLY"
        items: "SELECT JSON_VALUE(n.props, '$.items' RETURNING CLOB) FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == \"_DrivineSchema\")') AND JSON_VALUE(n.props, '$.scope') = $scope ORDER BY JSON_VALUE(n.props, '$.appliedAt' RETURNING NUMBER) DESC NULLS LAST, n.nid DESC FETCH FIRST 1 ROWS ONLY"
      readParameters: ["scope"]
      merge: |-
        MERGE INTO drivine_node n
        USING (SELECT (SELECT m.nid FROM drivine_node m WHERE JSON_EXISTS(m.labels, '$[*]?(@ == "_DrivineSchema")') AND JSON_VALUE(m.props, '$.scope') = $scope ORDER BY JSON_VALUE(m.props, '$.appliedAt' RETURNING NUMBER) DESC NULLS LAST, m.nid DESC FETCH FIRST 1 ROWS ONLY) AS nid FROM dual) found
        ON (n.nid = found.nid)
        WHEN MATCHED THEN UPDATE SET n.props = JSON_MERGEPATCH(n.props, JSON_OBJECT('version' VALUE $version, 'items' VALUE $items, 'appliedAt' VALUE $now RETURNING JSON))
        WHEN NOT MATCHED THEN INSERT (labels, props)
            VALUES ('["_DrivineSchema"]', JSON_OBJECT('scope' VALUE $scope, 'version' VALUE $version, 'items' VALUE $items, 'appliedAt' VALUE $now ABSENT ON NULL RETURNING JSON))
      mergeParameters: ["scope", "version", "items", "now"]
      deleteAllButNewest: |-
        DELETE FROM drivine_node WHERE nid IN (
            SELECT nid FROM (SELECT n.nid, ROW_NUMBER() OVER (ORDER BY JSON_VALUE(n.props, '$.appliedAt' RETURNING NUMBER) DESC NULLS LAST, n.nid DESC) AS position FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "_DrivineSchema")') AND JSON_VALUE(n.props, '$.scope') = $scope)
            WHERE position > 1)
      delete: "DELETE FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == \"_DrivineSchema\")') AND JSON_VALUE(n.props, '$.scope') = $scope"
      scopes: null
      itemsMark: "items:"
      constraint:
        - |-
          DECLARE
              e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
              e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
          BEGIN
              FOR attempt IN 1 .. 300 LOOP
                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE INDEX IF NOT EXISTS drivine_ix_scope_6833e54 ON drivine_node (JSON_VALUE(props, ''$.scope''))';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'RANGE_INDEX' AS kind, '_DrivineSchema' AS label, '["scope"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, '_DrivineSchema_scope_range', 'drivine_ix_scope_6833e54', '{"unique": "drivine_uq_DrivineSchemascope_4cab9cbb"}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
              -- Another process recorded it between the MERGE's read and its insert: it is recorded.
              NULL;
          END;
        - |-
          DECLARE
              e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
              e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
          BEGIN
              FOR attempt IN 1 .. 300 LOOP
                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineSchemascope_4cab9cbb ON drivine_node n (CASE WHEN JSON_EXISTS(n.labels, ''$[*]?(@ == "_DrivineSchema")'') AND JSON_EXISTS(n.props, ''$.scope'') THEN JSON_VALUE(n.props, ''$.scope'') END)';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          DECLARE
              v_labelled VARCHAR2(128);
          BEGIN
              SELECT MAX(JSON_VALUE(details, '$.labelled')) INTO v_labelled FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = '_DrivineSchema' AND properties = '["scope"]';
              IF v_labelled IS NOT NULL THEN
                  EXECUTE IMMEDIATE 'DROP INDEX IF EXISTS ' || v_labelled;
              END IF;
              UPDATE drivine_schema SET details = JSON_MERGEPATCH(details, '{"unique": "drivine_uq_DrivineSchemascope_4cab9cbb", "labelled": null}') WHERE kind = 'RANGE_INDEX' AND label = '_DrivineSchema' AND properties = '["scope"]';
              COMMIT;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'UNIQUENESS_CONSTRAINT' AS kind, '_DrivineSchema' AS label, '["scope"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, '_DrivineSchema_scope_unique', 'drivine_uq_DrivineSchemascope_4cab9cbb', '{}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
              -- Another process recorded it between the MERGE's read and its insert: it is recorded.
              NULL;
          END;
    sqlite:
      prepare: "ddl[0]"
      read:
        version: "SELECT (CASE json_type(n.props, '$.\"version\"') WHEN 'text' THEN n.props ->> '$.\"version\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"version\"' END) FROM drivine_node n WHERE instr(n.labels, '\"_DrivineSchema\"') > 0 AND (CASE json_type(n.props, '$.\"scope\"') WHEN 'text' THEN n.props ->> '$.\"scope\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"scope\"' END) = CAST($scope AS TEXT) ORDER BY (CASE WHEN json_type(n.props, '$.\"appliedAt\"') IN ('integer', 'real') THEN n.props ->> '$.\"appliedAt\"' END) DESC NULLS LAST, n.nid DESC LIMIT 1"
        items: "SELECT (CASE json_type(n.props, '$.\"items\"') WHEN 'text' THEN n.props ->> '$.\"items\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"items\"' END) FROM drivine_node n WHERE instr(n.labels, '\"_DrivineSchema\"') > 0 AND (CASE json_type(n.props, '$.\"scope\"') WHEN 'text' THEN n.props ->> '$.\"scope\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"scope\"' END) = CAST($scope AS TEXT) ORDER BY (CASE WHEN json_type(n.props, '$.\"appliedAt\"') IN ('integer', 'real') THEN n.props ->> '$.\"appliedAt\"' END) DESC NULLS LAST, n.nid DESC LIMIT 1"
      readParameters: ["scope"]
      merge: |-
        INSERT INTO drivine_node (nid, labels, props)
        SELECT (SELECT m.nid FROM drivine_node m WHERE instr(m.labels, '"_DrivineSchema"') > 0 AND (CASE json_type(m.props, '$."scope"') WHEN 'text' THEN m.props ->> '$."scope"' WHEN 'null' THEN NULL ELSE m.props -> '$."scope"' END) = CAST($scope AS TEXT) ORDER BY (CASE WHEN json_type(m.props, '$."appliedAt"') IN ('integer', 'real') THEN m.props ->> '$."appliedAt"' END) DESC NULLS LAST, m.nid DESC LIMIT 1),
               '["_DrivineSchema"]',
               json_patch('{}', json_object('scope', CAST($scope AS TEXT), 'version', $version, 'items', $items, 'appliedAt', $now))
        WHERE 1
        ON CONFLICT (nid) DO UPDATE SET props = json_patch(props, json_object('version', $version, 'items', $items, 'appliedAt', $now))
      mergeParameters: ["scope", "version", "items", "now"]
      deleteAllButNewest: |-
        DELETE FROM drivine_node WHERE nid IN (
            SELECT nid FROM (SELECT n.nid, row_number() OVER (ORDER BY (CASE WHEN json_type(n.props, '$."appliedAt"') IN ('integer', 'real') THEN n.props ->> '$."appliedAt"' END) DESC NULLS LAST, n.nid DESC) AS position FROM drivine_node n WHERE instr(n.labels, '"_DrivineSchema"') > 0 AND (CASE json_type(n.props, '$."scope"') WHEN 'text' THEN n.props ->> '$."scope"' WHEN 'null' THEN NULL ELSE n.props -> '$."scope"' END) = CAST($scope AS TEXT)) ranked
            WHERE position > 1)
      delete: "DELETE FROM drivine_node WHERE nid IN (SELECT n.nid FROM drivine_node n WHERE instr(n.labels, '\"_DrivineSchema\"') > 0 AND (CASE json_type(n.props, '$.\"scope\"') WHEN 'text' THEN n.props ->> '$.\"scope\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"scope\"' END) = CAST($scope AS TEXT))"
      scopes: "SELECT DISTINCT (CASE json_type(n.props, '$.\"scope\"') WHEN 'text' THEN n.props ->> '$.\"scope\"' WHEN 'null' THEN NULL ELSE n.props -> '$.\"scope\"' END) FROM drivine_node n WHERE instr(n.labels, '\"_DrivineSchema\"') > 0"
      itemsMark: ""
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq_DrivineSchemascope_4cab9cbb ON drivine_node ((CASE json_type(props, '$.\"scope\"') WHEN 'text' THEN props ->> '$.\"scope\"' WHEN 'null' THEN NULL ELSE props -> '$.\"scope\"' END)) WHERE instr(labels, '\"_DrivineSchema\"') > 0"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', '_DrivineSchema', '["scope"]', '_DrivineSchema_scope_unique', 'drivine_uq_DrivineSchemascope_4cab9cbb', '{}')
          ON CONFLICT (kind, label, properties) DO NOTHING
