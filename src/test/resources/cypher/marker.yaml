storeStamp:
  label: "DrivineStore"
  keyProperty: "key"
  key: "singleton"
  constraint: {kind: "UNIQUENESS_CONSTRAINT", label: "DrivineStore", properties: ["key"]}
  parameters: ["key", "storeId", "assignedAt", "engine", "layout"]
  restampParameters: ["key", "layout"]
  stores:
    neo4j:
      engine: "NEO4J"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt, layout: s.layout } AS stamp
        ORDER BY s.assignedAt, s.storeId
      foreignNodes: |-
        MATCH (n)
        WHERE NOT n:`DrivineStore` AND NOT n:`_DrivineSchema`
        RETURN 1 AS foreignNode
        LIMIT 1
      restampLayout: null
      layoutObjects: null
      layout: 1
      constraint:
        - "CREATE CONSTRAINT `DrivineStore_key_unique` IF NOT EXISTS FOR (n:`DrivineStore`) REQUIRE (n.`key`) IS UNIQUE"
    memgraph:
      engine: "MEMGRAPH"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt, layout: s.layout } AS stamp
        ORDER BY s.assignedAt, s.storeId
      foreignNodes: |-
        MATCH (n)
        WHERE NOT n:`DrivineStore` AND NOT n:`_DrivineSchema`
        RETURN 1 AS foreignNode
        LIMIT 1
      restampLayout: null
      layoutObjects: null
      layout: 1
      constraint:
        - "CREATE CONSTRAINT ON (n:DrivineStore) ASSERT n.key IS UNIQUE"
    falkordb:
      engine: "FALKORDB"
      prepare: null
      assignIfAbsent: |-
        MERGE (s:DrivineStore { key: $key })
        ON CREATE SET s.storeId = $storeId,
                      s.assignedAt = $assignedAt,
                      s.engine = $engine
      readStamps: |-
        MATCH (s:DrivineStore)
        RETURN { id: s.storeId, assignedAt: s.assignedAt, layout: s.layout } AS stamp
        ORDER BY s.assignedAt, s.storeId
      foreignNodes: |-
        MATCH (n)
        WHERE NOT n:`DrivineStore` AND NOT n:`_DrivineSchema`
        RETURN 1 AS foreignNode
        LIMIT 1
      restampLayout: null
      layoutObjects: null
      layout: 1
      constraint:
        - {native: ["GRAPH.CONSTRAINT", "CREATE", "{graphName}", "UNIQUE", "NODE", "DrivineStore", "PROPERTIES", "1", "key"]}
    postgres:
      engine: "POSTGRES"
      prepare: "ensuring"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]',
               jsonb_build_object('key', CAST($key AS text), 'storeId', CAST($storeId AS text), 'assignedAt', CAST($assignedAt AS text), 'engine', CAST($engine AS text), 'layout', CAST($layout AS integer))
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE n.labels @> '["DrivineStore"]' AND (n.props ->> 'key') = CAST($key AS text))
      readStamps: |-
        SELECT jsonb_build_object('id', (n.props ->> 'storeId'), 'assignedAt', (n.props ->> 'assignedAt'), 'layout', (n.props -> 'layout'))
        FROM drivine_node n WHERE n.labels @> '["DrivineStore"]'
        ORDER BY (n.props ->> 'assignedAt'), (n.props ->> 'storeId')
      foreignNodes: "SELECT 1 FROM drivine_node n WHERE NOT (n.labels @> '[\"DrivineStore\"]' OR n.labels @> '[\"_DrivineSchema\"]') LIMIT 1"
      restampLayout: |-
        UPDATE drivine_node n SET props = n.props || jsonb_build_object('layout', CAST($layout AS integer))
        WHERE n.labels @> '["DrivineStore"]' AND (n.props ->> 'key') = CAST($key AS text)
          AND NOT EXISTS (SELECT 1 FROM drivine_node o WHERE NOT (o.labels @> '["DrivineStore"]' OR o.labels @> '["_DrivineSchema"]'))
      layoutObjects: |-
        SELECT jsonb_build_object('name', indexname, 'type', 'INDEX') FROM pg_indexes
        WHERE schemaname = current_schema() AND tablename = 'drivine_node'
        UNION ALL
        SELECT jsonb_build_object('name', tablename, 'type', 'TABLE') FROM pg_tables
        WHERE schemaname = current_schema() AND tablename = 'drivine_lock2'
        ORDER BY 1
      layout: 2
      constraint:
        - "CREATE UNIQUE INDEX IF NOT EXISTS drivine_uq2_DrivineStorekey_e211949b ON drivine_node (((props -> 'key'))) WHERE labels @> '[\"DrivineStore\"]'"
        - |-
          INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
          VALUES ('UNIQUENESS_CONSTRAINT', 'DrivineStore', '["key"]', 'DrivineStore_key_unique', 'drivine_uq2_DrivineStorekey_e211949b', '{"form": 2}')
          ON CONFLICT (kind, label, properties) DO NOTHING
    oracle:
      engine: "ORACLE"
      prepare: "ensuring"
      assignIfAbsent: |-
        INSERT INTO drivine_node (labels, props)
        SELECT '["DrivineStore"]', JSON_OBJECT('key' VALUE $key, 'storeId' VALUE $storeId, 'assignedAt' VALUE $assignedAt, 'engine' VALUE $engine, 'layout' VALUE TO_NUMBER($layout))
        FROM dual
        WHERE NOT EXISTS (SELECT 1 FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "DrivineStore")') AND JSON_VALUE(n.props, '$.key') = $key)
      readStamps: |-
        SELECT JSON_OBJECT('id' VALUE JSON_VALUE(n.props, '$.storeId'), 'assignedAt' VALUE JSON_VALUE(n.props, '$.assignedAt'), 'layout' VALUE JSON_VALUE(n.props, '$.layout' RETURNING NUMBER) RETURNING JSON)
        FROM drivine_node n WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "DrivineStore")')
        ORDER BY JSON_VALUE(n.props, '$.assignedAt'), JSON_VALUE(n.props, '$.storeId')
      foreignNodes: "SELECT 1 FROM drivine_node n WHERE NOT (INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(n.labels), ']'), '[') || ',\"', ',\"DrivineStore\",\"') > 0 OR INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(n.labels), ']'), '[') || ',\"', ',\"_DrivineSchema\",\"') > 0) FETCH FIRST 1 ROWS ONLY"
      restampLayout: |-
        UPDATE drivine_node n SET n.props = JSON_TRANSFORM(n.props, SET '$.layout' = TO_NUMBER($layout))
        WHERE JSON_EXISTS(n.labels, '$[*]?(@ == "DrivineStore")') AND JSON_VALUE(n.props, '$.key') = $key
          AND NOT EXISTS (SELECT 1 FROM drivine_node o WHERE NOT (INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(o.labels), ']'), '[') || ',"', ',"DrivineStore","') > 0 OR INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(o.labels), ']'), '[') || ',"', ',"_DrivineSchema","') > 0))
      layoutObjects: |-
        SELECT JSON_OBJECT('name' VALUE LOWER(object_name), 'type' VALUE object_type RETURNING JSON) FROM user_objects
        WHERE object_type IN ('INDEX', 'TABLE', 'TRIGGER') AND LOWER(object_name) LIKE 'drivine\_%' ESCAPE '\'
        ORDER BY object_name
      layout: 2
      constraint:
        - |-
          DECLARE
              e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
              e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
          BEGIN
              FOR attempt IN 1 .. 300 LOOP
                  BEGIN
                      EXECUTE IMMEDIATE 'CREATE INDEX IF NOT EXISTS drivine_ix2_key_19e5f ON drivine_node (CASE WHEN CASE JSON_VALUE(props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN COALESCE(JSON_VALUE(props, ''$.key.s''), JSON_VALUE(props, ''$.key.v'')) WHEN ''number'' THEN TO_CHAR(JSON_VALUE(props, ''$.key'' RETURNING NUMBER), ''TM9'') WHEN ''double'' THEN CASE WHEN JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) = FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE)) AND JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) >= -9223372036854775808 AND JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) < 9223372036854775808 THEN TO_CHAR(CAST(FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) AS NUMBER) * 4294967296 + CAST(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) - FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) * 4294967296 AS NUMBER), ''TM9'') ELSE ''d'' || TO_CHAR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE)) END ELSE JSON_VALUE(props, ''$.key'') END IS NOT NULL THEN CASE JSON_VALUE(props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN JSON_VALUE(props, ''$.key."$t"'' RETURNING VARCHAR2(16)) WHEN ''double'' THEN ''number'' ELSE JSON_VALUE(props, ''$.key.type()'' RETURNING VARCHAR2(16)) END END, CASE JSON_VALUE(props, ''$.key.type()'' RETURNING VARCHAR2(16)) WHEN ''object'' THEN COALESCE(JSON_VALUE(props, ''$.key.s''), JSON_VALUE(props, ''$.key.v'')) WHEN ''number'' THEN TO_CHAR(JSON_VALUE(props, ''$.key'' RETURNING NUMBER), ''TM9'') WHEN ''double'' THEN CASE WHEN JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) = FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE)) AND JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) >= -9223372036854775808 AND JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) < 9223372036854775808 THEN TO_CHAR(CAST(FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) AS NUMBER) * 4294967296 + CAST(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) - FLOOR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE) / 4294967296) * 4294967296 AS NUMBER), ''TM9'') ELSE ''d'' || TO_CHAR(JSON_VALUE(props, ''$.key'' RETURNING BINARY_DOUBLE)) END ELSE JSON_VALUE(props, ''$.key'') END)';
                      EXIT;
                  EXCEPTION
                      WHEN e_exists THEN EXIT;
                      WHEN e_busy THEN
                          IF attempt = 300 THEN RAISE; END IF;
                          DBMS_SESSION.SLEEP(0.1);
                  END;
              END LOOP;
          END;
        - |-
          BEGIN
              MERGE INTO drivine_schema c
              USING (SELECT 'RANGE_INDEX' AS kind, 'DrivineStore' AS label, '["key"]' AS properties FROM dual) k
              ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
              WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                  VALUES (k.kind, k.label, k.properties, 'DrivineStore_key_range', 'drivine_ix2_key_19e5f', '{"form": 2, "unique": "drivine_uq2_DrivineStorekey_e211949b"}');
          EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
