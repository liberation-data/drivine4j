        only: [neo4j, sql]
      - cypher: "CREATE (:CyTemporal {id: 'time0', at: time('05:01:41-01:13')}), (:CyTemporal {id: 'time1', at: time('21:56:37.317258000+00:46')}), (:CyTemporal {id: 'time2', at: time('02:00:12.756000000-15:51')}), (:CyTemporal {id: 'time3', at: time('23:59:59.896000000-15:13')}), (:CyTemporal {id: 'time4', at: time('11:44:02.351977000-14:40')}), (:CyTemporal {id: 'time5', at: time('00:00:00.636515000+18:00')}), (:CyTemporal {id: 'time6', at: time('01:54:18.783017000Z')}), (:CyTemporal {id: 'time7', at: time('00:00:00.156083000-18:00')})"
        only: [neo4j, sql]
      - cypher: "CREATE (:CyTemporal {id: 'localdatetime0', at: localdatetime('2081-09-22T12:04:27.895794000')}), (:CyTemporal {id: 'localdatetime1', at: localdatetime('2010-11-13T01:31:46.696000000')}), (:CyTemporal {id: 'localdatetime2', at: localdatetime('2075-10-19T08:03:20')}), (:CyTemporal {id: 'localdatetime3', at: localdatetime('-749579651-02-05T06:46:44.697560000')}), (:CyTemporal {id: 'localdatetime4', at: localdatetime('1988-02-24T07:36:53.243000000')}), (:CyTemporal {id: 'localdatetime5', at: localdatetime('1933-11-08T00:00:00.476886000')}), (:CyTemporal {id: 'localdatetime6', at: localdatetime('1938-09-11T00:00:00.222765348')}), (:CyTemporal {id: 'localdatetime7', at: localdatetime('2036-10-15T00:00:00.304000000')})"
        only: [neo4j, sql]
      - cypher: "CREATE (:CyTemporal {id: 'datetime0', at: datetime('+308673642-03-14T12:55:21-18:00')}), (:CyTemporal {id: 'datetime1', at: datetime('1989-03-01T00:00:00.609289164+07:25')}), (:CyTemporal {id: 'datetime2', at: datetime('-8997-07-31T16:07:06.922963255+07:31')}), (:CyTemporal {id: 'datetime3', at: datetime('+980281921-01-15T17:43:39-18:00')}), (:CyTemporal {id: 'datetime4', at: datetime('1925-07-04T05:45:22.355634000+05:27')}), (:CyTemporal {id: 'datetime5', at: datetime('2008-11-28T10:21:08+03:36')}), (:CyTemporal {id: 'datetime6', at: datetime('+948027483-03-02T14:49:43.418664000-18:00')}), (:CyTemporal {id: 'datetime7', at: datetime('1932-02-22T04:38:45.447000000+07:36')})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal) WHERE n.id =~ 'date[0-9]' RETURN n.id ORDER BY n.at"
        only: [neo4j, sql]
