plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.20'
    id 'com.google.devtools.ksp' version '2.2.20-2.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Versions the Boot BOM would manage down, which the root project's build used to set for this one
// when it applied the Spring Boot plugin. Boot manages Kotlin to 1.9, and would take the Kotlin
// compiler's own tools down with it. jfalkordb 0.13.0 is built on Jedis 8; Boot manages Jedis to 6.0.0,
// which lacks DefaultJedisClientConfig.Builder.autoNegotiateProtocol and fails every FalkorDB connection.
ext['kotlin.version'] = '2.2.20'
ext['jedis.version'] = '8.0.1'

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.7'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Depend on root project for core library
    implementation rootProject

    // Apply code generation processor
    ksp project(':drivine4j-codegen')

    // Spring Boot Starter for tests
    testImplementation project(':drivine4j-spring-boot-starter')

    // Spring Boot dependencies needed for tests
    testImplementation 'org.springframework.boot:spring-boot-starter:3.5.7'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.7'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop:3.5.7'
    testImplementation 'org.springframework:spring-tx:6.2.3'
    testImplementation 'org.springframework:spring-test:6.2.3'

    // Testcontainers for Neo4j
    testImplementation 'org.testcontainers:neo4j:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'

    // The JDBC driver a POSTGRES datasource needs, as an application adds it: CI runs the sample's
    // stateless tests on Postgres. The version is the one Spring Boot manages.
    testImplementation 'org.postgresql:postgresql:42.7.8'

    // Neptune IAM SigV4 auth
    testImplementation 'software.amazon.awssdk:auth:2.31.3'
    testImplementation 'software.amazon.awssdk:regions:2.31.3'
    testImplementation 'software.amazon.awssdk:http-client-spi:2.31.3'

    // Testing - versions managed by Spring Boot BOM
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Make generated sources visible to the IDE and compilers
kotlin {
    // Note: KSP automatically registers generated sources in Gradle 8+
    // Manual registration is no longer needed and can cause issues in Gradle 9+
    compilerOptions {
        freeCompilerArgs.addAll '-Xcontext-parameters'
    }
}

test {
    useJUnitPlatform()
    // See the root build: the collection sort strategy is an input of the tests.
    inputs.property('collectionSortStrategy', providers.environmentVariable('DATABASE_DATASOURCES_NEO_COLLECTION_SORT_STRATEGY').orElse(''))
    // The images the tests run are pinned in one file, and each pin is an input of the tests.
    rootProject.file('gradle/test-images.txt').readLines()
        .collect { it.trim() }.findAll { it && !it.startsWith('#') }
        .each { line ->
            def (named, pinned) = line.split(/\s+/)
            systemProperty "drivine.test.image.${named}", pinned
        }
}
