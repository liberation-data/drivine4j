        only: [neo4j, sql]
        rows: [8]
      - cypher: "MATCH (n:CyTemporal) WHERE n.at IN [time('05:01:41-01:13'), time('21:56:37.317258000+00:46'), time('02:00:12.756000000-15:51'), time('23:59:59.896000000-15:13'), time('11:44:02.351977000-14:40'), time('00:00:00.636515000+18:00'), time('01:54:18.783017000Z'), time('00:00:00.156083000-18:00')] RETURN count(n)"
