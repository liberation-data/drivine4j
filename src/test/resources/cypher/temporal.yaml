# openCypher's temporal values: their fields, arithmetic and comparisons, run from an empty graph. See README.md.
# A graph engine's driver gives a temporal value as one of its own, and a SQL store gives its ISO text, so the
# cases read a value's fields; the text is read only where the step runs on the SQL stores alone.
label: CyTemporal

cases:
  - name: "Fields of a date, time and moment"
    description: "A date, a time and a moment made from text or a map give their fields."
    steps:
      - cypher: "WITH date('2024-03-15') AS d RETURN {year: d.year, month: d.month, day: d.day, dayOfWeek: d.dayOfWeek, ordinalDay: d.ordinalDay, week: d.week, quarter: d.quarter}"
        rows: [{year: 2024, month: 3, day: 15, dayOfWeek: 5, ordinalDay: 75, week: 11, quarter: 1}]
      - cypher: |
          WITH datetime('2024-03-15T10:30:45.123+02:00') AS t
          RETURN {hour: t.hour, minute: t.minute, second: t.second, millisecond: t.millisecond, offsetMinutes: t.offsetMinutes, timezone: t.timezone, epochMillis: t.epochMillis}
        rows: [{hour: 10, minute: 30, second: 45, millisecond: 123, offsetMinutes: 120, timezone: "+02:00", epochMillis: 1710491445123}]
      - cypher: |
          RETURN {leap: date({year: 2024, month: 2, day: 29}).ordinalDay,
                  noon: datetime({year: 2024, month: 1, day: 1, hour: 12, timezone: 'Z'}).epochSeconds,
                  local: localtime('10:30').hour, zoned: time('10:30:00Z').minute,
                  minutes: localdatetime({year: 2024, month: 1, day: 1, hour: 9, minute: 45}).minute}
        rows: [{leap: 60, noon: 1704110400, local: 10, zoned: 30, minutes: 45}]

  - name: "Fields of a duration"
    description: "A duration made from text or a map gives its fields."
    steps:
      - cypher: |
          WITH duration('P1Y2M3DT4H5M6S') AS d
          RETURN {years: d.years, months: d.months, monthsOfYear: d.monthsOfYear, days: d.days, hours: d.hours,
                  minutes: d.minutes, minutesOfHour: d.minutesOfHour, seconds: d.seconds, secondsOfMinute: d.secondsOfMinute}
        rows: [{years: 1, months: 14, monthsOfYear: 2, days: 3, hours: 4, minutes: 245, minutesOfHour: 5, seconds: 14706, secondsOfMinute: 6}]
      - cypher: "WITH duration({days: 1, hours: 12}) AS d RETURN {days: d.days, hours: d.hours}"
        rows: [{days: 1, hours: 12}]

  - name: "Adding durations"
    description: "A duration added to a moment lands on the month's last day if the day doesn't exist; durations add to each other."
    steps:
      - cypher: |
          RETURN {endOfFebruary: (date('2024-01-31') + duration('P1M')).day,
                  nextDay: (datetime('2024-03-15T23:30:00Z') + duration('PT1H')).day,
                  fortnightBefore: (date('2024-03-15') - duration('P15D')).month,
                  days: (duration('P1D') + duration('PT12H')).days,
                  hours: (duration('P1D') + duration('PT12H')).hours,
                  doubled: (duration('PT1H') * 2).minutes}
        rows: [{endOfFebruary: 29, nextDay: 16, fortnightBefore: 2, days: 1, hours: 12, doubled: 120}]
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('2024-03-15')}), (:CyTemporal {id: 'b', day: date('2024-01-01')})"
      - note: "A moment read from the store, its kind told by its text."
        cypher: "MATCH (n:CyTemporal) RETURN (n.day + duration('P1D')).day ORDER BY n.id"
        rows: [16, 2]
      - note: "Bound values nested in one another, which Postgres would pull up and write out again as it plans, out of memory."
        cypher: "MATCH (n:CyTemporal) RETURN (n.day + duration({days: $days})).day ORDER BY n.id"
        parameters: {days: 3}
        rows: [18, 4]

  - name: "Comparing moments"
    description: "Moments compare as instants whatever their offsets; durations compare only as equal or not."
    steps:
      - cypher: |
          RETURN {before: date('2024-03-15') < date('2024-03-16'),
                  otherOffset: datetime('2024-03-15T10:00:00+02:00') = datetime('2024-03-15T08:00:00Z'),
                  earlier: datetime('2024-03-15T10:00:00+02:00') < datetime('2024-03-15T08:00:01Z'),
                  durations: duration('P1D') = duration('PT24H')}
        rows: [{before: true, otherOffset: false, earlier: true, durations: false}]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: '2024-06-01T00:00:00Z'}), (:CyTemporal {id: 'b', at: '2023-12-31T23:00:00-02:00'}), (:CyTemporal {id: 'c', at: '2023-06-01T00:00:00Z'})"
      - cypher: "MATCH (n:CyTemporal) WHERE datetime(n.at) > datetime('2024-01-01T00:00:00Z') RETURN n.id ORDER BY n.id"
        rows: ["a", "b"]

  - name: "duration.between"
    description: "The duration between two moments is in months, then days, then seconds, or in one unit with inDays, inSeconds or inMonths."
    steps:
      - cypher: |
          WITH duration.between(date('2024-01-15'), date('2024-03-20')) AS d
          RETURN {months: d.months, days: d.days,
                  inDays: duration.inDays(date('2024-01-01'), date('2024-03-01')).days,
                  inSeconds: duration.inSeconds(datetime('2024-01-01T00:00:00Z'), datetime('2024-01-01T01:00:00Z')).seconds,
                  inMonths: duration.inMonths(date('2024-01-31'), date('2024-03-01')).months}
        rows: [{months: 2, days: 5, inDays: 60, inSeconds: 3600, inMonths: 1}]
      - note: "Between a date and a time of day, only the times of day are compared, a date's being its midnight (drivine4j#418)."
        cypher: |
          RETURN {between: duration.between(date('1984-10-11'), localtime('16:30')).minutes,
                  inDays: duration.inDays(date('1984-10-11'), localtime('16:30')).days,
                  inSeconds: duration.inSeconds(date('1984-10-11'), localtime('16:30')).seconds,
                  back: duration.between(localdatetime('2018-01-01T23:00'), localtime('01:00')).minutes,
                  zoned: duration.between(time('10:00+01:00'), datetime('1984-10-11T12:00+02:00')).minutes,
                  local: duration.between(datetime('1984-10-11T12:00+02:00'), localtime('16:30')).minutes,
                  date: duration.between(time('10:00+01:00'), date('1984-10-11')).minutes,
                  inMonths: duration.inMonths(date('1984-10-11'), localtime('16:30')).months}
        rows: [{between: 990, inDays: 0, inSeconds: 59400, back: -1320, zoned: 60, local: 270, date: -600, inMonths: 0}]
      - note: "And on the SQL stores, as text."
        only: [sql]
        cypher: "RETURN [duration.between(date('1984-10-11'), localtime('16:30')), duration.inDays(date('1984-10-11'), localtime('16:30'))]"
        rows: [["PT16H30M", "PT0S"]]
      - note: "A negative duration's seconds are floored, and its fraction of a second is from 0 up to 1 (drivine4j#418)."
        cypher: |
          WITH duration.between(localdatetime('2018-01-02T10:00:00.1'), localdatetime('2018-01-01T10:00:00.2')) AS d
          RETURN {seconds: d.seconds, nanosecondsOfSecond: d.nanosecondsOfSecond, millisecondsOfSecond: d.millisecondsOfSecond,
                  milliseconds: d.milliseconds, hours: d.hours, minutes: d.minutes, minutesOfHour: d.minutesOfHour,
                  secondsOfMinute: d.secondsOfMinute}
        rows: [{seconds: -86400, nanosecondsOfSecond: 100000000, millisecondsOfSecond: 100, milliseconds: -86399900, hours: -24,
                minutes: -1440, minutesOfHour: 0, secondsOfMinute: 0}]
      - note: "And of a fraction below a millisecond."
        cypher: |
          WITH duration('PT-0.0005S') AS d
          RETURN {seconds: d.seconds, milliseconds: d.milliseconds, microseconds: d.microseconds, nanoseconds: d.nanoseconds,
                  millisecondsOfSecond: d.millisecondsOfSecond, microsecondsOfSecond: d.microsecondsOfSecond, nanosecondsOfSecond: d.nanosecondsOfSecond}
        rows: [{seconds: -1, milliseconds: -1, microseconds: -500, nanoseconds: -500000, millisecondsOfSecond: 999, microsecondsOfSecond: 999500,
                nanosecondsOfSecond: 999500000}]

  - name: "Truncation and the statement's moment"
    description: "A moment truncates to a unit, and every clock function in a statement reads the same moment."
    steps:
      - cypher: |
          RETURN {firstOfMonth: date.truncate('month', date('2024-03-15')).day,
                  onTheHour: datetime.truncate('hour', datetime('2024-03-15T10:30:45Z')).minute,
                  midnight: datetime.truncate('day', datetime('2024-03-15T10:30:45Z')).hour,
                  one: date.statement() = date(), clock: localtime() = localtime.statement(), time: time() = time.statement(),
                  local: localdatetime() = localdatetime.statement()}
        rows: [{firstOfMonth: 1, onTheHour: 0, midnight: 0, one: true, clock: true, time: true, local: true}]

  - name: "Adding a month to a month's last day"
    description: "A month added to the last day of a month keeps the day where the next month has it."
    steps:
      - cypher: |
          RETURN {leap: (date('2024-02-29') + duration('P1M')).day,
                  april: (date('2024-04-30') + duration('P1M')).day,
                  back: (date('2024-03-31') - duration('P1M')).day,
                  clockDay: (localdatetime('2024-02-29T10:30:00.5') + duration('P1M')).day,
                  clockMillis: (localdatetime('2024-02-29T10:30:00.5') + duration('P1M')).millisecond}
        rows: [{leap: 29, april: 30, back: 29, clockDay: 29, clockMillis: 500}]

  - name: "Calendar months between moments"
    description: "The months between two moments are whole calendar months, for times too and across offsets."
    steps:
      - cypher: |
          RETURN {lastDaysMonths: duration.between(date('2024-01-31'), date('2024-02-29')).months,
                  lastDaysDays: duration.between(date('2024-01-31'), date('2024-02-29')).days,
                  earlierMonths: duration.between(datetime('2024-01-15T12:00:00Z'), datetime('2024-02-15T06:00:00Z')).months,
                  earlierDays: duration.between(datetime('2024-01-15T12:00:00Z'), datetime('2024-02-15T06:00:00Z')).days,
                  earlierHours: duration.between(datetime('2024-01-15T12:00:00Z'), datetime('2024-02-15T06:00:00Z')).hours,
                  backMonths: duration.between(date('2024-03-20'), date('2024-01-15')).months,
                  backDays: duration.between(date('2024-03-20'), date('2024-01-15')).days,
                  times: duration.between(time('10:00:00+02:00'), time('09:30:00Z')).minutes,
                  localTimes: duration.between(localtime('10:00'), localtime('09:00')).hours,
                  offsets: duration.between(datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T10:00:00Z')).hours,
                  mixedDays: duration.between(date('2024-01-01'), datetime('2024-01-02T12:00:00+01:00')).days,
                  mixedHours: duration.between(date('2024-01-01'), datetime('2024-01-02T12:00:00+01:00')).hours}
        rows:
          - lastDaysMonths: 0
            lastDaysDays: 29
            earlierMonths: 0
            earlierDays: 30
            earlierHours: 18
            backMonths: -2
            backDays: -5
            times: 90
            localTimes: -1
            offsets: 2
            mixedDays: 1
            mixedHours: 12

  - name: "Offset without a colon"
    description: "An offset written without a colon, like +0200, is read as the offset it is."
    steps:
      - cypher: "WITH datetime('2024-03-15T10:30:00+0200') AS t RETURN {timezone: t.timezone, offsetMinutes: t.offsetMinutes, hour: t.hour, epochMillis: t.epochMillis}"
        rows: [{timezone: "+02:00", offsetMinutes: 120, hour: 10, epochMillis: 1710491400000}]
      - cypher: "WITH time('10:15-0530') AS t RETURN {timezone: t.timezone, minute: t.minute}"
        rows: [{timezone: "-05:30", minute: 15}]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: '2024-03-15T10:30:00+0200'})"
      - cypher: "MATCH (n:CyTemporal) WITH datetime(n.at) AS t RETURN {timezone: t.timezone, offsetMinutes: t.offsetMinutes, hour: t.hour, epochMillis: t.epochMillis}"
        rows: [{timezone: "+02:00", offsetMinutes: 120, hour: 10, epochMillis: 1710491400000}]

  - name: "Zero offset is UTC"
    description: "A zero offset, however it's written, is UTC's Z."
    steps:
      - cypher: "WITH datetime('2024-03-15T10:00:00+00:00') AS t RETURN {offset: t.offset, timezone: t.timezone, utc: t = datetime('2024-03-15T10:00:00Z'), time: time('10:00-0000').offset}"
        rows: [{offset: "Z", timezone: "Z", utc: true, time: "Z"}]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: '2024-03-15T10:00:00+00:00'})"
      - cypher: |
          MATCH (n:CyTemporal) WITH datetime(n.at) AS t
          RETURN {offset: t.offset, timezone: (t + duration('PT1H')).timezone, utc: t = datetime('2024-03-15T10:00:00Z'), time: time(t).offset}
        rows: [{offset: "Z", timezone: "Z", utc: true, time: "Z"}]

  - name: "Negative, weekly and fractional durations"
    description: "A duration can be negative, in weeks, or a fraction of a second."
    steps:
      - cypher: |
          WITH duration('-P1DT2H') AS n, duration('P2W') AS w, duration('PT1.5S') AS f
          RETURN {days: n.days, hours: n.hours, weekDays: w.days, weeks: w.weeks, millis: f.milliseconds, secs: f.seconds,
                  mapWeeks: duration({weeks: 1, days: 1}).days, dayBefore: (date('2024-03-01') + duration('-P1D')).day,
                  weekLater: (date('2024-03-15') + duration('P1W')).day}
        rows: [{days: -1, hours: -2, weekDays: 14, weeks: 2, millis: 1500, secs: 1, mapWeeks: 8, dayBefore: 29, weekLater: 22}]

  - name: "Fractions of a second and wrapping times"
    description: "A moment keeps the fraction of its second, and a time of day wraps past midnight."
    steps:
      - cypher: |
          WITH datetime('2024-03-15T10:30:45.123456Z') AS t
          RETURN {micro: t.microsecond, nano: t.nanosecond, milli: t.millisecond,
                  nextMinute: (datetime('2024-03-15T10:30:59.999Z') + duration('PT0.002S')).minute,
                  carried: (localtime('10:30:45.5') + duration('PT0.25S')).millisecond,
                  wrapped: (localtime('23:30') + duration('PT1H')).hour,
                  zonedMinute: (time('10:00:00+02:00') - duration('PT45M')).minute,
                  zone: (time('10:00:00+02:00') - duration('PT45M')).timezone}
        rows: [{micro: 123456, nano: 123456000, milli: 123, nextMinute: 31, carried: 750, wrapped: 0, zonedMinute: 15, zone: "+02:00"}]
      - note: A fraction no real number holds exactly, as .001, still gives its fields whole.
        cypher: |
          WITH localdatetime('2024-03-15T10:30:33.001') AS t, duration('PT33.007S') AS d
          RETURN {milli: t.millisecond, micro: t.microsecond, durationMicros: d.microseconds, ofSecond: d.microsecondsOfSecond,
                  hour: localtime('10:59:59.999999').hour, epochMillis: datetime('2024-03-15T10:30:33.123999Z').epochMillis}
        rows: [{milli: 1, micro: 1000, durationMicros: 33007000, ofSecond: 7000, hour: 10, epochMillis: 1710498633123}]
      - note: A duration made from a map keeps the fraction of a second its smaller units make.
        cypher: "RETURN [toString(duration({milliseconds: 1500})), toString(duration({seconds: 1, microseconds: 7})), toString(duration({nanoseconds: 1000}))]"
        rows: [["PT1.5S", "PT1.000007S", "PT0.000001S"]]

  - name: "The current moment in a time zone, or of null"
    description: "date.statement(), datetime.transaction(), localtime.realtime() and the rest give the moment in the time zone they are given, and null where they are given null (drivine4j#425)."
    steps:
      - note: "Given null, each gives null, as in Neo4j, not the moment."
        cypher: |
          RETURN [date.statement(null), date.transaction(null), date.realtime(null), localtime.statement(null), localtime.transaction(null),
                  localtime.realtime(null), time.statement(null), time.transaction(null), time.realtime(null), localdatetime.statement(null),
                  localdatetime.transaction(null), localdatetime.realtime(null), datetime.statement(null), datetime.transaction(null),
                  datetime.realtime(null)]
        rows: [[null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]]
      - note: "And given null by a parameter."
        cypher: "RETURN datetime.transaction($z) IS NULL"
        parameters: {z: null}
        rows: [true]
      - note: "Given a zone, the moment there. The clocks at -12:00 and +14:00 are 26 hours apart: a day and 2 hours, of which .hours gives the 2; the date at +14:00 is a day or two after the date at -12:00."
        cypher: |
          RETURN {offset: datetime.statement('+05:00').offset, time: time.transaction('-03:30').offset, given: datetime.realtime($z).offset,
                  days: duration.inDays(date.realtime('-12:00'), date.realtime('+14:00')).days IN [1, 2],
                  local: duration.between(localdatetime.statement('-12:00'), localdatetime.statement('+14:00')).hours,
                  clock: duration.between(localtime.statement('-05:00'), localtime.statement('+05:00')).hours IN [10, -14]}
        parameters: {z: "+01:00"}
        rows: [{offset: "+05:00", time: "-03:30", given: "+01:00", days: true, local: 2, clock: true}]

  - name: "Week-year fields, duration parts and zoned inequality"
    description: "A moment gives its week-year and offset fields, a duration its parts of a larger unit, and zoned values at different offsets are unequal."
    steps:
      - cypher: |
          WITH datetime('2024-12-30T10:00:00Z') AS t, datetime('2024-03-15T10:00:00-05:30') AS u
          RETURN {weekYear: t.weekYear, week: t.week, weekDay: t.weekDay, offset: u.offset, offsetSeconds: u.offsetSeconds,
                  unequal: datetime('2024-03-15T10:00:00+02:00') <> datetime('2024-03-15T08:00:00Z'), same: t <> datetime('2024-12-30T10:00:00Z'),
                  ordered: (duration('P1D') < duration('P2D')) IS NULL, transaction: datetime.transaction().year > 2000, realtime: date.realtime().year > 2000}
        rows: [{weekYear: 2025, week: 1, weekDay: 1, offset: "-05:30", offsetSeconds: -19800, unequal: true, same: false, ordered: true, transaction: true, realtime: true}]
      - cypher: |
          WITH duration('P1Y8M17DT3H4M5.006007S') AS d
          RETURN {quarters: d.quarters, quartersOfYear: d.quartersOfYear, monthsOfQuarter: d.monthsOfQuarter, weeks: d.weeks, daysOfWeek: d.daysOfWeek,
                  ms: d.millisecondsOfSecond, us: d.microsecondsOfSecond, ns: d.nanosecondsOfSecond, minutesOfHour: duration('PT-90M').minutesOfHour}
        rows: [{quarters: 6, quartersOfYear: 2, monthsOfQuarter: 2, weeks: 2, daysOfWeek: 3, ms: 6, us: 6007, ns: 6007000, minutesOfHour: -30}]

  - name: "Dividing and scaling durations"
    description: "A duration is divided and multiplied."
    steps:
      - cypher: |
          RETURN {quarterHour: (duration('PT1H') / 4).minutes, halfMonthDays: (duration('P1M') / 2).days,
                  halfMonthHours: (duration('P1M') / 2).hours, tripled: (3 * duration('P1D')).days, halfDay: (duration('P1D') * 0.5).hours}
        rows: [{quarterHour: 15, halfMonthDays: 15, halfMonthHours: 5, tripled: 3, halfDay: 12}]

  - name: "Truncating to each unit"
    description: "A moment truncates to each unit, keeping its offset; times and dates truncate too."
    steps:
      - cypher: |
          WITH datetime('2024-05-15T10:30:45.123456+02:00') AS t
          WITH datetime.truncate('year', t) AS year, datetime.truncate('quarter', t) AS quarter, datetime.truncate('month', t) AS month,
               datetime.truncate('week', t) AS week, datetime.truncate('day', t) AS day, datetime.truncate('hour', t) AS hour,
               datetime.truncate('minute', t) AS minute, datetime.truncate('second', t) AS second, datetime.truncate('millisecond', t) AS millisecond
          RETURN {year: [year.month, year.day, year.hour, year.minute, year.second, year.microsecond],
                  quarter: [quarter.month, quarter.day, quarter.hour, quarter.minute, quarter.second, quarter.microsecond],
                  month: [month.month, month.day, month.hour, month.minute, month.second, month.microsecond],
                  week: [week.month, week.day, week.hour, week.minute, week.second, week.microsecond],
                  day: [day.month, day.day, day.hour, day.minute, day.second, day.microsecond],
                  hour: [hour.month, hour.day, hour.hour, hour.minute, hour.second, hour.microsecond],
                  minute: [minute.month, minute.day, minute.hour, minute.minute, minute.second, minute.microsecond],
                  second: [second.month, second.day, second.hour, second.minute, second.second, second.microsecond],
                  millisecond: [millisecond.month, millisecond.day, millisecond.hour, millisecond.minute, millisecond.second, millisecond.microsecond],
                  zone: day.timezone}
        rows:
          - year: [1, 1, 0, 0, 0, 0]
            quarter: [4, 1, 0, 0, 0, 0]
            month: [5, 1, 0, 0, 0, 0]
            week: [5, 13, 0, 0, 0, 0]
            day: [5, 15, 0, 0, 0, 0]
            hour: [5, 15, 10, 0, 0, 0]
            minute: [5, 15, 10, 30, 0, 0]
            second: [5, 15, 10, 30, 45, 0]
            millisecond: [5, 15, 10, 30, 45, 123000]
            zone: "+02:00"
      - cypher: |
          RETURN {localHour: localtime.truncate('hour', localtime('10:30:45')).minute,
                  timeZone: time.truncate('minute', time('10:30:45+02:00')).timezone,
                  timeSecond: time.truncate('minute', time('10:30:45+02:00')).second,
                  monday: date.truncate('week', date('2024-05-15')).day,
                  firstOfMonth: date.truncate('month', datetime('2024-05-15T10:30:00Z')).day,
                  localMidnight: localdatetime.truncate('day', datetime('2024-05-15T10:30:00Z')).hour}
        rows: [{localHour: 0, timeZone: "+02:00", timeSecond: 0, monday: 13, firstOfMonth: 1, localMidnight: 0}]

  - name: "Truncating to many years, a week-based year or a microsecond"
    description: "A millennium starts in 2000 and a century in 1900, a week-based year on the Monday of its first ISO week, and a microsecond keeps the microseconds."
    steps:
      - cypher: |
          WITH date.truncate('weekYear', date('1984-01-01')) AS w, date.truncate('weekYear', date('2020-12-31')) AS w2,
               datetime.truncate('decade', datetime('1984-10-11T12:31:14+01:00')) AS d
          RETURN {millennium: date.truncate('millennium', date('2017-10-11')).year, lastMillennium: date.truncate('millennium', date('1999-12-31')).year,
                  century: date.truncate('century', date('2017-05-05')).year, decade: date.truncate('decade', date('2019-05-05')).year,
                  decadeStart: [d.year, d.month, d.day, d.hour, d.timezone],
                  weekYear: [w.year, w.month, w.day], weekYearBefore: [w2.year, w2.month, w2.day],
                  weekYearZone: datetime.truncate('weekYear', datetime('2021-01-03T10:00+02:00')).timezone,
                  localMicros: localtime.truncate('microsecond', localtime('12:31:14.645876')).microsecond,
                  micros: datetime.truncate('microsecond', datetime('2017-10-11T12:31:14.645876-01:00')).microsecond}
        only: [neo4j, sql]
        note: "Memgraph and FalkorDB have no date.truncate()."
        rows:
          - millennium: 2000
            lastMillennium: 1000
            century: 2000
            decade: 2010
            decadeStart: [1980, 1, 1, 0, "+01:00"]
            weekYear: [1983, 1, 3]
            weekYearBefore: [2019, 12, 30]
            weekYearZone: "+02:00"
            localMicros: 645876
            micros: 645876
      - cypher: "RETURN [date.truncate('millennium', date('2017-10-11')), localdatetime.truncate('decade', date('1984-10-11')), time.truncate('microsecond', time('12:31:14.645876+01:00'))]"
        only: [sql]
        rows: [["2000-01-01", "1980-01-01T00:00:00", "12:31:14.645876+01:00"]]

  - name: "Truncating with fields"
    description: "A truncation's third argument, a map, gives the value cut short fields in place of its own, as Neo4j lays them over it."
    steps:
      - cypher: |
          WITH date.truncate('month', date('1984-10-11'), {year: 2000, dayOfWeek: 3}) AS moved, date.truncate('weekYear', date('1984-01-01'), {day: 5}) AS w
          RETURN {day: date.truncate('month', date('1984-10-11'), {day: 2}).day,
                  dayOfWeek: date.truncate('month', date('1984-10-11'), {dayOfWeek: 2}).day,
                  sunday: date.truncate('week', date('1984-10-11'), {dayOfWeek: 7}).day,
                  month: date.truncate('year', date('1984-10-11'), {month: 3}).month,
                  moved: [moved.year, moved.month, moved.day], weekYear: [w.year, w.month, w.day],
                  none: date.truncate('millennium', date('2017-10-11'), {}).year,
                  noMap: date.truncate('month', date('2017-10-11'), null).day}
        only: [neo4j, sql]
        note: "The year and month first, then the day of the week, which moves the value within its ISO week."
        rows: [{day: 2, dayOfWeek: 2, sunday: 14, month: 3, moved: [2000, 9, 27], weekYear: [1983, 1, 5], none: 2000, noMap: 1}]
      - cypher: |
          WITH datetime('2017-10-11T12:31:14.645876+01:00') AS t
          WITH t, datetime.truncate('millisecond', t, {second: 3}) AS second, localtime.truncate('hour', t, {minute: 6}) AS hour
          RETURN {second: [second.second, second.microsecond], hour: [hour.hour, hour.minute],
                  millisecond: datetime.truncate('microsecond', t, {millisecond: 5}).microsecond,
                  carried: datetime.truncate('millisecond', t, {microsecond: 7}).microsecond,
                  microsecond: datetime.truncate('second', t, {microsecond: 7}).microsecond,
                  both: datetime.truncate('millisecond', t, {millisecond: 7, microsecond: 8}).microsecond,
                  bothFromSecond: datetime.truncate('second', t, {millisecond: 7, microsecond: 8}).microsecond}
        only: [neo4j, sql]
        note: "A millisecond or a microsecond makes the whole fraction, but a microsecond given a value cut to the millisecond is added to it."
        rows: [{second: [3, 645000], hour: [12, 6], millisecond: 5000, carried: 645007, microsecond: 7, both: 7000, bothFromSecond: 7008}]
      - cypher: |
          RETURN {hour: datetime.truncate('second', datetime('2017-10-11T12:31:14+01:00'), {hour: null}).hour,
                  month: date.truncate('day', date('1984-10-11'), {month: null}).month,
                  monday: date.truncate('day', date('1984-10-11'), {dayOfWeek: null}).day,
                  fraction: datetime.truncate('millisecond', datetime('2017-10-11T12:31:14.645876+01:00'), {millisecond: null, microsecond: 8}).microsecond}
        only: [neo4j, sql]
        note: "A field that is null is given as its least: no hour, the first month, Monday."
        rows: [{hour: 0, month: 1, monday: 8, fraction: 0}]
      - cypher: |
          WITH datetime.truncate('day', datetime('2017-10-11T12:31:14+01:00'), {timezone: '+05:00'}) AS zoned,
               time.truncate('hour', time('12:31:14-01:00'), {timezone: '+05:00'}) AS time
          RETURN {zoned: [zoned.day, zoned.hour, zoned.timezone], time: [time.hour, time.timezone],
                  fromLocal: datetime.truncate('day', localdatetime('2017-10-11T12:31:14'), {timezone: '+05:00'}).timezone,
                  utc: datetime.truncate('day', datetime('2017-10-11T12:31:14+01:00'), {timezone: '+00:00'}).timezone,
                  fromDate: datetime.truncate('day', date('2017-10-11'), {}).timezone}
        only: [neo4j, sql]
        note: "A time zone keeps the wall clock, and a value of none is at UTC."
        rows: [{zoned: [11, 0, "+05:00"], time: [12, "+05:00"], fromLocal: "+05:00", utc: "Z", fromDate: "Z"}]
      - cypher: "RETURN [date.truncate('millennium', date('2017-10-11'), {day: 2}), datetime.truncate('weekYear', datetime('1984-01-01T12:31:14+01:00'), {day: 5}), localtime.truncate('millisecond', localtime('12:31:14.645876'), {microsecond: 7})]"
        only: [sql]
        rows: [["2000-01-02", "1983-01-05T00:00:00+01:00", "12:31:14.645007"]]
      - cypher: "RETURN date.truncate('month', date('1984-02-11'), {day: 31})"
        only: [neo4j, sql]
        note: "A day the month does not have."
        error: true

  - name: "Moments from maps with fractions and offsets"
    description: "A moment or time made from a map takes its fraction of a second and its offset."
    steps:
      - cypher: |
          RETURN {millis: datetime({year: 2024, month: 3, day: 15, hour: 10, minute: 30, second: 45, millisecond: 123, timezone: '+02:00'}).epochMillis,
                  zone: datetime({year: 2024, month: 3, day: 15, hour: 10, timezone: '+02:00'}).timezone,
                  offset: time({hour: 10, minute: 30, timezone: '+02:00'}).offsetMinutes,
                  micro: localtime({hour: 10, minute: 30, second: 5, microsecond: 7}).microsecond,
                  nano: localtime({hour: 1, minute: 0, second: 0, nanosecond: 5000}).microsecond}
        rows: [{millis: 1710491445123, zone: "+02:00", offset: 120, micro: 7, nano: 5}]

  - name: "Dates from a week, an ordinal day or a quarter"
    description: "A date or a moment made from a map takes a week of the week-based year and a day of the week, a day of the year, or a quarter and a day of the quarter, in place of a month and a day."
    steps:
      - cypher: |
          RETURN {week: date({year: 1984, week: 10}), weekDay: date({year: 1984, week: 10, dayOfWeek: 3}), ordinal: date({year: 1984, ordinalDay: 202}),
                  quarter: date({year: 1984, quarter: 3}), quarterDay: date({year: 1984, quarter: 3, dayOfQuarter: 45})}
        only: [sql]
        rows: [{week: "1984-03-05", weekDay: "1984-03-07", ordinal: "1984-07-20", quarter: "1984-07-01", quarterDay: "1984-08-14"}]
      - cypher: |
          WITH date({year: 2020, week: 53}) AS long, date({year: 2020, week: 53, dayOfWeek: 7}) AS sunday, date({year: 2019, week: 1}) AS before,
               date({year: 2021, week: 1}) AS after, date({year: 2015, week: 53, dayOfWeek: 5}) AS friday
          RETURN [[long.year, long.month, long.day], [sunday.year, sunday.month, sunday.day], [before.year, before.month, before.day],
                  [after.year, after.month, after.day], [friday.year, friday.month, friday.day]]
        only: [neo4j, sql]
        note: "The year is the week-based year: its first week is the one with January 4th, which may start in the year before. 2020 and 2015 have 53 weeks."
        rows: [[[2020, 12, 28], [2021, 1, 3], [2018, 12, 31], [2021, 1, 4], [2016, 1, 1]]]
      - cypher: |
          WITH date({year: 2019, week: 53}) AS w, date({year: 2023, quarter: 1, dayOfQuarter: 91}) AS q1, date({year: 2023, quarter: 2, dayOfQuarter: 92}) AS q2
          RETURN [[w.year, w.month, w.day], [q1.year, q1.month, q1.day], [q2.year, q2.month, q2.day]]
        only: [neo4j, sql]
        note: "Week 53 of a year of 52 weeks is the first week of the next, and a day of the quarter past its last runs into the next quarter, as Neo4j has them."
        rows: [[[2019, 12, 30], [2023, 4, 1], [2023, 7, 1]]]
      - cypher: |
          WITH date({year: 2024, ordinalDay: 366}) AS leap, date({year: 2023, ordinalDay: 365}) AS common, date({year: 2024, ordinalDay: 60}) AS feb29,
               date({year: 2023, ordinalDay: 60}) AS mar1, date({year: 2024, quarter: 4, dayOfQuarter: 92}) AS q4, date({year: 2024, quarter: 1, dayOfQuarter: 91}) AS q1
          RETURN [[leap.month, leap.day], [common.month, common.day], [feb29.month, feb29.day], [mar1.month, mar1.day], [q4.month, q4.day], [q1.month, q1.day]]
        only: [neo4j, sql]
        rows: [[[12, 31], [12, 31], [2, 29], [3, 1], [12, 31], [3, 31]]]
      - cypher: |
          WITH date({year: 2023, week: null}) AS w, date({year: 2023, week: 2, dayOfWeek: null}) AS d, date({year: 2023, ordinalDay: null}) AS o,
               date({year: 2023, quarter: 2, dayOfQuarter: null}) AS q
          RETURN [[w.month, w.day], [d.month, d.day], [o.month, o.day], [q.month, q.day]]
        only: [neo4j, sql]
        note: "A field that is null is given as its least: the first week, day of the week, day of the year or day of the quarter."
        rows: [[[1, 2], [1, 9], [1, 1], [4, 1]]]
      - cypher: |
          WITH localdatetime({year: 1984, week: 10, dayOfWeek: 3, hour: 12, minute: 31, second: 14, millisecond: 645}) AS l,
               datetime({year: 2020, week: 53, dayOfWeek: 7, hour: 23, timezone: '-05:00'}) AS w,
               datetime({year: 1984, ordinalDay: 202, hour: 12, timezone: '+01:00'}) AS o,
               localdatetime({year: 2024, quarter: 4, dayOfQuarter: 92, hour: 23, minute: 59}) AS q
          RETURN [[l.day, l.hour, l.millisecond], [w.year, w.day, w.hour, w.timezone], [o.month, o.day, o.hour, o.timezone], [q.month, q.day, q.minute]]
        only: [neo4j, sql]
        note: "A moment takes them beside its time and its offset."
        rows: [[[7, 12, 645], [2021, 3, 23, "-05:00"], [7, 20, 12, "+01:00"], [12, 31, 59]]]
      - cypher: |
          UNWIND [[2020, 53, 7], [2019, 53, 1], [1984, 10, null], [2024, null, null]] AS p
          WITH date({year: p[0], week: p[1], dayOfWeek: p[2]}) AS d
          RETURN [d.year, d.month, d.day]
        only: [neo4j, sql]
        note: "Fields an expression gives, worked out as the statement runs."
        rows: [[2021, 1, 3], [2019, 12, 30], [1984, 3, 5], [2024, 1, 1]]
      - cypher: |
          UNWIND [[2024, 366, 4, 92], [2023, 1, 1, 91], [2023, null, null, null]] AS p
          WITH date({year: p[0], ordinalDay: p[1]}) AS o, date({year: p[0], quarter: p[2], dayOfQuarter: p[3]}) AS q
          RETURN [o.month, o.day, q.year, q.month, q.day]
        only: [neo4j, sql]
        rows: [[12, 31, 2024, 12, 31], [1, 1, 2023, 4, 1], [1, 1, 2023, 1, 1]]
      - cypher: "RETURN date({year: 2020, week: 54})"
        only: [neo4j, sql]
        note: "Neo4j: 22007: data exception - invalid date, time, or datetime format. A week runs to 53, a day of the week to 7, a quarter to 4."
        error: true
      - cypher: "RETURN date({year: 2023, ordinalDay: 366})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A day of the year runs to the year's last, 365 in a common year."
        error: true
      - cypher: "RETURN date({year: 2024, quarter: 4, dayOfQuarter: 93})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A day of the quarter runs to 92."
        error: true
      - cypher: "UNWIND [[2023, 366]] AS p RETURN date({year: p[0], ordinalDay: p[1]})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A field past its range that an expression gives fails as the statement runs."
        error: true
      - cypher: "UNWIND [[2024, 5]] AS p RETURN date({year: p[0], quarter: p[1]})"
        only: [neo4j, sql]
        error: true
      - cypher: "UNWIND [[2020, 54]] AS p RETURN date({year: p[0], week: p[1]})"
        only: [neo4j, sql]
        error: true

  - name: "Day of the quarter and the fields of the week at the year's turn"
    description: "A date or a moment gives the day of its quarter, and the week, week-based year and day of the year where the week-based year is not the year."
    steps:
      - cypher: |
          RETURN [date('1984-10-11').dayOfQuarter, date('2024-12-31').dayOfQuarter, date('2023-03-31').dayOfQuarter, date('2024-03-31').dayOfQuarter,
                  date('2024-01-01').dayOfQuarter, datetime('2024-05-20T10:00+02:00').dayOfQuarter, localdatetime('2024-08-01T23:00').dayOfQuarter]
        only: [neo4j, sql]
        rows: [[11, 92, 90, 91, 1, 50, 32]]
      - cypher: |
          RETURN [date('2021-01-03').week, date('2021-01-03').weekYear, date('2021-01-03').dayOfWeek, date('2018-12-31').week, date('2018-12-31').weekYear,
                  date('2020-12-31').week, date('2024-12-31').ordinalDay, date('2021-01-03').quarter]
        only: [neo4j, sql]
        rows: [[53, 2020, 7, 1, 2019, 53, 366, 1]]
      - cypher: "CREATE (:CyTemporal {at: date('1984-10-11')}), (:CyTemporal {at: localdatetime('1984-11-11T12:31:14')})"
        only: [neo4j, sql]
      - note: "A value read from the store, its kind told by its text."
        cypher: "MATCH (n:CyTemporal) RETURN [n.at.quarter, n.at.dayOfQuarter, n.at.week, n.at.weekYear, n.at.ordinalDay, n.at.weekDay] ORDER BY n.at.month"
        only: [neo4j, sql]
        rows: [[4, 11, 41, 1984, 285, 4], [4, 42, 45, 1984, 316, 7]]

  - name: "Dates, times and moments from another temporal value"
    description: "A map's date, time or datetime gives the value made the fields of another temporal value, and the map's other fields are laid over them."
    steps:
      - cypher: |
          WITH date('1984-11-11') AS d, localdatetime('1984-11-11T12:31:14.645') AS l, datetime('1984-11-11T23:30-05:00') AS z
          WITH date({date: d}) AS a, date({date: l}) AS b, date({date: z}) AS c
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.year, c.month, c.day]]
        only: [neo4j, sql]
        note: "A date from a date, a local moment or a zoned one: the date its wall clock reads."
        rows: [[[1984, 11, 11], [1984, 11, 11], [1984, 11, 11]]]
      - cypher: |
          WITH localtime('12:31:14.645') AS lt, time('12:31:14.645+01:00') AS t, localdatetime('1984-03-07T12:31:14') AS l, datetime('1984-10-11T23:00-05:00') AS z
          WITH localtime({time: lt}) AS a, localtime({time: t}) AS b, localtime({time: l}) AS c, localtime({time: z}) AS e
          RETURN [[a.hour, a.minute, a.second, a.millisecond], [b.hour, b.minute, b.second, b.millisecond], [c.hour, c.minute, c.second], [e.hour, e.minute]]
        only: [neo4j, sql]
        note: "A time of day from a time of day or a moment, local or zoned: the time its wall clock reads."
        rows: [[[12, 31, 14, 645], [12, 31, 14, 645], [12, 31, 14], [23, 0]]]
      - cypher: |
          WITH localtime('12:31:14.645') AS lt, time('12:31:14.645+01:00') AS t, localdatetime('1984-03-07T12:31:14') AS l, datetime('1984-10-11T23:00-05:00') AS z
          WITH time({time: lt}) AS a, time({time: t}) AS b, time({time: l}) AS c, time({time: z}) AS e
          RETURN [[a.hour, a.millisecond, a.timezone], [b.hour, b.millisecond, b.timezone], [c.hour, c.second, c.timezone], [e.hour, e.timezone]]
        only: [neo4j, sql]
        note: "A zoned time keeps the offset of a zoned value, and is at UTC from a local one."
        rows: [[[12, 645, "Z"], [12, 645, "+01:00"], [12, 14, "Z"], [23, "-05:00"]]]
      - cypher: |
          WITH date('1984-10-11') AS d, localtime('12:31:14.645') AS lt, time('12:31:14+01:00') AS t, localdatetime('1984-03-07T12:31:14') AS l, datetime('1984-10-11T12:00-05:00') AS z
          WITH localdatetime({date: d}) AS a, localdatetime({date: z, time: lt}) AS b, localdatetime({date: l, time: t}) AS c, localdatetime({datetime: z}) AS e, localdatetime({datetime: l}) AS f
          RETURN [[a.year, a.month, a.day, a.hour, a.minute], [b.month, b.day, b.hour, b.minute, b.millisecond], [c.month, c.day, c.hour, c.second], [e.day, e.hour], [f.month, f.day, f.second]]
        only: [neo4j, sql]
        note: "A local moment takes its date from one value and its time from another, or both from a moment; with no time, midnight."
        rows: [[[1984, 10, 11, 0, 0], [10, 11, 12, 31, 645], [3, 7, 12, 14], [11, 12], [3, 7, 14]]]
      - cypher: |
          WITH date('1984-10-11') AS d, localtime('12:31:14.645') AS lt, time('12:31:14+01:00') AS t, localdatetime('1984-03-07T12:31:14') AS l, datetime('1984-10-11T12:00-05:00') AS z
          WITH datetime({date: d}) AS a, datetime({date: z}) AS b, datetime({date: d, time: t}) AS c, datetime({date: d, time: lt}) AS e, datetime({datetime: z}) AS f,
               datetime({datetime: l}) AS g, datetime({date: l, time: z}) AS h
          RETURN [[a.day, a.hour, a.timezone], [b.day, b.hour, b.timezone], [c.day, c.hour, c.minute, c.timezone], [e.hour, e.millisecond, e.timezone],
                  [f.day, f.hour, f.timezone], [g.month, g.day, g.second, g.timezone], [h.month, h.day, h.hour, h.timezone]]
        only: [neo4j, sql]
        note: "A zoned moment keeps the offset of what gives its time, and is at UTC where that is local or nothing gives it: the offset of what gives the date alone is dropped."
        rows: [[[11, 0, "Z"], [11, 0, "Z"], [11, 12, 31, "+01:00"], [12, 645, "Z"], [11, 12, "-05:00"], [3, 7, 14, "Z"], [3, 7, 12, "-05:00"]]]
      - cypher: |
          WITH date('1984-11-11') AS d
          WITH date({date: d, year: 2023}) AS a, date({date: d, month: 2}) AS b, date({date: d, day: 28}) AS c, date({date: date('2024-03-15'), day: 30, month: 4}) AS e,
               date({date: date('2024-01-31'), day: 15, month: 2}) AS f
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.year, c.month, c.day], [e.year, e.month, e.day], [f.year, f.month, f.day]]
        only: [neo4j, sql]
        note: "A year, a month and a day given replace the value's, together: January 31st with the month 2 and the day 15 is February 15th."
        rows: [[[2023, 11, 11], [1984, 2, 11], [1984, 11, 28], [2024, 4, 30], [2024, 2, 15]]]
      - cypher: |
          WITH date('1984-11-11') AS d
          WITH date({date: d, week: 1}) AS a, date({date: d, dayOfWeek: 3}) AS b, date({date: d, ordinalDay: 28}) AS c, date({date: d, quarter: 3}) AS e, date({date: d, dayOfQuarter: 5}) AS f
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.year, c.month, c.day], [e.year, e.month, e.day], [f.year, f.month, f.day]]
        only: [neo4j, sql]
        note: "A week keeps the day of the week, a day of the week the week, a quarter the month of the quarter and the day, a day of the quarter the quarter, and an ordinal day the year."
        rows: [[[1984, 1, 8], [1984, 11, 7], [1984, 1, 28], [1984, 8, 11], [1984, 10, 5]]]
      - cypher: |
          WITH date({date: date('1816-12-30'), week: 2, dayOfWeek: 3}) AS a, date({date: date('1816-12-31'), week: 2}) AS b, date({date: date('1816-12-31'), year: 1817, week: 2}) AS c,
               date({date: date('2020-12-30'), year: 2021, week: 2}) AS e, date({date: date('2020-12-30'), year: 2021}) AS f
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.year, c.month, c.day], [e.year, e.month, e.day], [f.year, f.month, f.day]]
        only: [neo4j, sql]
        note: "Beside a week the year is the week-based year: 1816-12-31 is in the first week of 1817, and 2020-12-30 in the 53rd of 2020. Without one, it is the year."
        rows: [[[1817, 1, 8], [1817, 1, 7], [1817, 1, 7], [2021, 1, 13], [2021, 12, 30]]]
      - cypher: |
          WITH date({date: date('2019-12-30'), week: 53}) AS a, date({date: date('2020-12-30'), year: 2019, week: 53}) AS b, date({date: date('2024-03-15'), dayOfQuarter: 92}) AS c,
               date({date: date('2023-03-15'), dayOfQuarter: 92}) AS e, date({date: date('2024-03-31'), quarter: 2}) AS f, date({date: date('2024-01-31'), quarter: 2}) AS g,
               date({date: date('2024-12-31'), ordinalDay: 366}) AS h
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.month, c.day], [e.month, e.day], [f.month, f.day], [g.month, g.day], [h.month, h.day]]
        only: [neo4j, sql]
        note: "As a map of them has it, week 53 of a year of 52 runs into the next, as does a day of the quarter past its last; a quarter moves to the month's last day where it has fewer."
        rows: [[[2020, 12, 28], [2020, 1, 1], [4, 1], [4, 2], [6, 30], [4, 30], [12, 31]]]
      - cypher: |
          WITH date('2024-03-15') AS d, localtime('12:31:14.645') AS lt
          WITH date({date: d, day: null}) AS a, date({date: d, month: null}) AS b, date({date: d, week: null}) AS c, date({date: d, ordinalDay: null}) AS e, date({date: d, quarter: null}) AS f,
               localtime({time: lt, hour: null}) AS g, localtime({time: lt, millisecond: null}) AS h
          RETURN [[a.month, a.day], [b.month, b.day], [c.month, c.day], [e.month, e.day], [f.month, f.day], [g.hour, g.minute, g.millisecond], [h.second, h.millisecond]]
        only: [neo4j, sql]
        note: "A field given as null is its least, not the value's: the first day, month, week or quarter, and no hour or fraction."
        rows: [[[3, 1], [1, 15], [1, 5], [1, 1], [3, 15], [0, 31, 645], [14, 0]]]
      - cypher: |
          WITH localtime('12:31:14.645876') AS lt
          WITH localtime({time: lt, second: 42}) AS a, localtime({time: lt, millisecond: 5}) AS b, localtime({time: lt, microsecond: 7}) AS c, localtime({time: lt, millisecond: 5, microsecond: 6}) AS e,
               localtime({time: localtime('10:11:12'), hour: 3, minute: null}) AS f
          RETURN [[a.second, a.microsecond], [b.second, b.microsecond], [c.microsecond], [e.microsecond], [f.hour, f.minute, f.second]]
        only: [neo4j, sql]
        note: "A second given keeps the fraction; a millisecond or a microsecond given makes the whole fraction."
        rows: [[[42, 645876], [14, 5000], [7], [5006], [3, 0, 12]]]
      - cypher: |
          WITH time({time: time('12:31:14.645+01:00'), minute: 5}) AS a, localdatetime({datetime: localdatetime('2024-03-15T10:11:12.123456'), millisecond: 7}) AS b,
               localdatetime({datetime: localdatetime('2024-03-15T10:11:12.123456'), minute: 7}) AS c, datetime({datetime: datetime('2024-03-15T10:00+03:00'), hour: null}) AS e
          RETURN [[a.hour, a.minute, a.millisecond, a.timezone], [b.second, b.microsecond], [c.minute, c.microsecond], [e.day, e.hour, e.timezone]]
        only: [neo4j, sql]
        rows: [[[12, 5, 645, "+01:00"], [12, 7000], [7, 123456], [15, 0, "+03:00"]]]
      - cypher: |
          WITH date('1984-10-11') AS d, localtime('12:31:14.645') AS lt, time('12:31:14+01:00') AS t
          WITH localdatetime({date: d, hour: 10, minute: 10, second: 10}) AS a, datetime({date: datetime('1984-10-11T12:00-05:00'), hour: 10}) AS b,
               localdatetime({date: d, hour: 5, minute: 3, second: 2, nanosecond: 1000}) AS c, localdatetime({year: 1984, month: 10, day: 11, time: lt}) AS e,
               datetime({year: 2024, week: 3, dayOfWeek: 2, time: t}) AS f, localdatetime({year: 2024, ordinalDay: 3, time: lt}) AS g,
               localdatetime({year: 2024, quarter: 3, dayOfQuarter: 2, time: lt}) AS h
          RETURN [[a.day, a.hour, a.minute, a.second], [b.day, b.hour, b.timezone], [c.second, c.microsecond], [e.month, e.day, e.minute, e.millisecond],
                  [f.month, f.day, f.hour, f.timezone], [g.month, g.day, g.hour], [h.month, h.day, h.hour]]
        only: [neo4j, sql]
        note: "A value that gives the date beside fields of the time, and one that gives the time beside fields of the date."
        rows: [[[11, 10, 10, 10], [11, 10, "Z"], [2, 1], [10, 11, 31, 645], [1, 16, 12, "+01:00"], [1, 3, 12], [7, 2, 12]]]
      - cypher: |
          WITH date('1984-10-11') AS d, localtime('12:31:14.645') AS lt
          WITH localdatetime({date: d, time: lt, day: 28, second: 42}) AS a, localdatetime({date: date('2024-03-15'), time: localtime('10:11:12'), week: 1}) AS b,
               datetime({date: date('2024-03-15'), hour: 10, timezone: '+01:00', week: 2}) AS c, localdatetime({date: date('2024-03-15'), time: localtime('10:11:12'), year: 2020, hour: 1}) AS e
          RETURN [[a.day, a.second, a.millisecond], [b.month, b.day, b.hour], [c.month, c.day, c.hour, c.timezone], [e.year, e.hour, e.minute]]
        only: [neo4j, sql]
        rows: [[[28, 42, 645], [1, 5, 10], [1, 12, 10, "+01:00"], [2020, 1, 11]]]
      - cypher: |
          WITH date({date: date('2024-02-29'), year: 2023, dayOfWeek: 4}) AS a, date({date: date('2024-02-29'), year: 2020, dayOfWeek: 4}) AS b,
               date({date: date('2021-01-02'), year: 2021, dayOfWeek: 1}) AS c, date({date: date('2020-12-31'), year: 2021, dayOfWeek: 7}) AS e,
               date({date: date('2026-01-01'), year: 2019, dayOfWeek: 5}) AS f, datetime({datetime: datetime('2024-02-29T23:30+05:00'), year: 2023, dayOfWeek: 3, timezone: '-05:00'}) AS g
          RETURN [[a.year, a.month, a.day], [b.year, b.month, b.day], [c.year, c.month, c.day], [e.year, e.month, e.day], [f.year, f.month, f.day], [g.year, g.month, g.day, g.hour, g.timezone]]
        only: [neo4j, sql]
        note: "Beside a day of the week the year moves the date so many years, to February 28th from the 29th of a common year, where alone it fails; then the day of the week moves it within its week, which may be in another year."
        rows: [[[2023, 3, 2], [2020, 2, 27], [2020, 12, 28], [2022, 1, 2], [2019, 1, 4], [2023, 3, 1, 13, "-05:00"]]]
      - cypher: |
          UNWIND [[date('2024-02-29'), 2023, 1], [date('2024-03-15'), 1999, 2]] AS p
          WITH date({date: p[0], year: p[1], dayOfWeek: p[2]}) AS a
          RETURN [a.year, a.month, a.day]
        only: [neo4j, sql]
        note: "The same, with the value, the year and the day of the week given by expressions."
        rows: [[2023, 2, 27], [1999, 3, 16]]
      - cypher: "RETURN [date({date: date('1984-11-11'), week: 1}), date({date: localdatetime('1984-11-11T12:31:14'), quarter: 3}), date({date: datetime('1984-11-11T23:30-05:00'), ordinalDay: 28})]"
        only: [sql]
        rows: [["1984-01-08", "1984-08-11", "1984-01-28"]]

  - name: "Zoned times and moments from another temporal value"
    description: "A time zone given beside a zoned value moves it there, the same moment; beside a local value, or none, it names the value's offset."
    steps:
      - cypher: |
          WITH time({time: time('23:00+01:00'), timezone: '+05:00'}) AS a, time({time: time('01:00+01:00'), timezone: '-05:00'}) AS b, time({time: time('10:00Z'), timezone: '+05:30'}) AS c,
               time({time: localtime('10:00'), timezone: '-02:00'}) AS e, time({time: datetime('2024-03-15T23:00+01:00'), timezone: '+05:00'}) AS f, time({time: localdatetime('2024-03-15T23:00')}) AS g,
               time({time: time('10:00+01:00'), timezone: 'Z'}) AS h, time({time: time('12:31:14+01:00'), second: 42, timezone: '+05:00'}) AS i
          RETURN [[a.hour, a.timezone], [b.hour, b.timezone], [c.hour, c.minute, c.timezone], [e.hour, e.timezone], [f.hour, f.timezone], [g.hour, g.timezone], [h.hour, h.timezone],
                  [i.hour, i.minute, i.second, i.timezone]]
        only: [neo4j, sql]
        note: "A time of day moved past midnight wraps round; the fields given are laid over it before it moves."
        rows: [[[3, "+05:00"], [19, "-05:00"], [15, 30, "+05:30"], [10, "-02:00"], [3, "+05:00"], [23, "Z"], [9, "Z"], [16, 31, 42, "+05:00"]]]
      - cypher: |
          WITH datetime({datetime: datetime('2024-03-15T23:00-05:00'), timezone: '+05:00'}) AS a, datetime({datetime: datetime('2024-03-15T23:00-05:00'), hour: 1, timezone: '+05:00'}) AS b,
               datetime({datetime: localdatetime('1984-03-07T12:31:14'), timezone: '+05:00'}) AS c, datetime({datetime: datetime('2024-03-15T10:30:20.5+03:00'), minute: 0, timezone: 'Z'}) AS e,
               datetime({datetime: datetime('2024-03-15T10:00+01:00'), timezone: '-12:00'}) AS f
          RETURN [[a.day, a.hour, a.timezone], [b.day, b.hour, b.timezone], [c.day, c.hour, c.minute, c.timezone], [e.hour, e.minute, e.second, e.millisecond, e.timezone], [f.day, f.hour, f.timezone]]
        only: [neo4j, sql]
        note: "A moment moved to another offset may move to another day."
        rows: [[[16, 9, "+05:00"], [15, 11, "+05:00"], [7, 12, 31, "+05:00"], [7, 0, 20, 500, "Z"], [14, 21, "-12:00"]]]
      - cypher: |
          WITH datetime({date: date('2024-03-15'), time: time('23:00-05:00'), timezone: '+05:00'}) AS a, datetime({date: date('2024-03-15'), time: time('23:11:12-05:00'), day: 31, timezone: '+05:00'}) AS b,
               datetime({date: date('2024-03-15'), time: time('10:11:12+01:00'), hour: 22, timezone: '-01:00'}) AS c, datetime({date: date('2024-03-15'), time: localtime('10:11:12'), timezone: '+01:00', hour: 22}) AS e,
               datetime({date: date('2024-03-15'), timezone: '+01:00'}) AS f, datetime({date: datetime('2024-03-15T10:00+03:00'), timezone: '+01:00'}) AS g,
               datetime({date: date('2024-03-15'), time: datetime('2020-01-01T23:30+02:00'), timezone: '-03:00'}) AS h
          RETURN [[a.month, a.day, a.hour, a.timezone], [b.month, b.day, b.hour, b.minute, b.timezone], [c.day, c.hour, c.timezone], [e.hour, e.minute, e.timezone], [f.day, f.hour, f.timezone],
                  [g.day, g.hour, g.timezone], [h.year, h.day, h.hour, h.minute, h.timezone]]
        only: [neo4j, sql]
        note: "The date and the time are put together at the offset of what gives the time, then moved: March 31st 23:11:12-05:00 is April 1st at +05:00."
        rows: [[[3, 16, 9, "+05:00"], [4, 1, 9, 11, "+05:00"], [15, 20, "-01:00"], [22, 11, "+01:00"], [15, 0, "+01:00"], [15, 0, "+01:00"], [2024, 15, 18, 30, "-03:00"]]]

  - name: "Temporal values from another an expression gives"
    description: "A value read from the store or unwound, its kind told by its text, gives a date, a time or a moment."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', at: date('1984-10-11')}), (:CyTemporal {id: 'b', at: localdatetime('1984-11-11T12:31:14')}), (:CyTemporal {id: 'c', at: datetime('1984-12-11T23:00-05:00')})"
        only: [neo4j, sql]
      - cypher: |
          MATCH (n:CyTemporal) WITH n ORDER BY n.id
          WITH date({date: n.at, day: 1}) AS d, datetime({date: n.at, hour: 10, timezone: '+01:00'}) AS z
          RETURN [d.month, d.day, z.month, z.day, z.hour, z.timezone]
        only: [neo4j, sql]
        rows: [[10, 1, 10, 11, 10, "+01:00"], [11, 1, 11, 11, 10, "+01:00"], [12, 1, 12, 11, 10, "+01:00"]]
      - cypher: |
          MATCH (n:CyTemporal) WHERE n.id <> 'a' WITH n ORDER BY n.id
          WITH localtime({time: n.at, minute: 1}) AS l, time({time: n.at, timezone: '+05:00'}) AS t, datetime({datetime: n.at, day: 2}) AS z
          RETURN [l.hour, l.minute, t.hour, t.minute, t.timezone, z.month, z.day, z.hour, z.timezone]
        only: [neo4j, sql]
        note: "A local moment read is given the offset, and a zoned one moved to it."
        rows: [[12, 1, 12, 31, "+05:00", 11, 2, 12, "Z"], [23, 1, 9, 0, "+05:00", 12, 2, 23, "-05:00"]]
      - cypher: |
          UNWIND [date('2024-03-15'), localdatetime('2023-07-01T10:00'), datetime('2022-05-04T23:00-05:00')] AS d
          WITH date({date: d, day: 2}) AS a
          RETURN [a.year, a.month, a.day]
        only: [neo4j, sql]
        rows: [[2024, 3, 2], [2023, 7, 2], [2022, 5, 2]]

  - name: "Temporal values from another that make no date"
    description: "Fields laid over another temporal value that make a day its month has none of fail, as the statement runs."
    steps:
      - cypher: "RETURN date({date: date('2024-01-31'), month: 2})"
        only: [neo4j, sql]
        note: "Neo4j: 22007: data exception - invalid date, time, or datetime format. February 31st: the month isn't moved to its last day."
        error: true
      - cypher: "RETURN date({date: date('2024-02-29'), year: 2023})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. February 29th of a common year."
        error: true
      - cypher: "RETURN date({date: date('2023-12-31'), ordinalDay: 366})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "RETURN date({date: date('2024-02-29'), year: 2023, quarter: 1})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. The year is laid over the date before the quarter moves it."
        error: true
      - cypher: "UNWIND [date('2024-01-31')] AS d RETURN date({date: d, month: 2})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "RETURN localdatetime({date: date('2024-01-31'), month: 2, hour: 1})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A moment's too, which Oracle reads as a JSON value's, null where it is no moment."
        error: true
      - cypher: "RETURN datetime({datetime: datetime('2024-01-31T10:00Z'), month: 2})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "UNWIND [datetime('2023-12-31T10:00Z')] AS d RETURN datetime({date: d, ordinalDay: 366, hour: 1})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "UNWIND [[date('2024-03-15'), 5]] AS p RETURN date({date: p[0], quarter: p[1]})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A field past its range that an expression gives."
        error: true

  - name: "Temporal values from another that an expression gives as none"
    description: "Another temporal value or a time zone an expression gives that is null, or of a kind that hasn't what it is to give, fails as the statement runs, not given as null."
    steps:
      - cypher: "UNWIND [null] AS d RETURN date({date: d, day: 1})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "OPTIONAL MATCH (n:CyNothing) RETURN date({date: n.at})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A property of a node that isn't there."
        error: true
      - cypher: "UNWIND [null] AS t RETURN datetime({date: date('2024-03-15'), time: t})"
        only: [neo4j, sql]
        note: "Neo4j: 22007."
        error: true
      - cypher: "UNWIND [localtime('10:00')] AS d RETURN date({date: d})"
        only: [neo4j, sql]
        note: "Neo4j: 22G05. A time of day gives no date."
        error: true
      - cypher: "UNWIND [date('2024-03-15')] AS t RETURN time({time: t, timezone: '+01:00'})"
        only: [neo4j, sql]
        note: "Neo4j: 22G05. A date gives no time of day."
        error: true
      - cypher: "UNWIND ['hello'] AS t RETURN localtime({time: t})"
        only: [neo4j, sql]
        note: "Neo4j: 22007. A text that is no temporal value."
        error: true
      - cypher: "UNWIND [null] AS z RETURN datetime({datetime: datetime('2024-03-15T10:00Z'), timezone: z})"
        only: [neo4j, sql]
        note: "Neo4j: 22G06. A time zone that is null."
        error: true
      - cypher: "UNWIND [null] AS z RETURN time({time: localtime('10:00'), timezone: z})"
        only: [neo4j, sql]
        note: "Neo4j: 22G06."
        error: true
      - cypher: "UNWIND ['hello'] AS z RETURN datetime({date: date('2024-03-15'), timezone: z})"
        only: [neo4j, sql]
        note: "Neo4j: 22000. A text that is no time zone."
        error: true
      - cypher: "UNWIND [1] AS z RETURN datetime({year: 2024, month: 1, day: 1, timezone: z})"
        only: [neo4j, sql]
        note: "A time zone an expression gives that is no text fails, rather than give null (drivine4j#424)."
        error: true
      - cypher: "UNWIND [1] AS z RETURN datetime({date: date('2024-03-15'), timezone: z})"
        only: [sql]
        note: "And beside another value."
        error: true
      - note: "A zone by name an expression gives, which no SQL store's text holds, fails the statement there rather than give null; Neo4j gives the moment in that zone (drivine4j#424)."
        only: [sql]
        cypher: "UNWIND ['Europe/Stockholm'] AS z RETURN datetime({year: 2024, month: 1, day: 1, timezone: z})"
        error: true
      - note: "And an offset with seconds, beside another moment."
        only: [sql]
        cypher: "UNWIND ['+02:05:59'] AS z RETURN datetime({datetime: datetime('2024-03-15T10:00Z'), timezone: z})"
        error: true
      - note: "An offset an expression gives is read as the statement runs, as before."
        cypher: "UNWIND ['+01:00'] AS z RETURN [datetime({year: 2024, month: 1, day: 1, timezone: z}).offset, datetime({datetime: datetime('2024-03-15T10:00Z'), timezone: z}).hour]"
        rows: [["+01:00", 11]]
      - note: "A zone a parameter gives is read where the statement compiles."
        cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: $z}).offset"
        parameters: {z: "-03:30"}
        rows: ["-03:30"]
      - note: "A zone by name an expression gives for a time of day fails too."
        only: [sql]
        cypher: "UNWIND ['Europe/Stockholm'] AS z RETURN time({hour: 12, timezone: z})"
        error: true
      - note: "An offset whose seconds are none, written or given, is that offset; UTC's an expression gives, however written, is Z."
        cypher: "UNWIND ['-00:00'] AS z RETURN [datetime({year: 2024, month: 1, day: 1, timezone: '+02:00:00'}).offset, time({hour: 12, timezone: $z}).offset, time({hour: 12, timezone: z}).offset]"
        parameters: {z: "-00:00:00"}
        rows: [["+02:00", "Z", "Z"]]

  - name: "Converting between temporal kinds"
    description: "A temporal value of one kind is made from a value of another."
    steps:
      - cypher: |
          WITH datetime('2024-03-15T23:30:00-02:00') AS t
          RETURN {day: date(t).day, hour: localdatetime(t).hour, zone: time(t).timezone, clock: localtime(t).minute,
                  midnight: date(localdatetime('2024-03-15T10:30')).day}
        rows: [{day: 15, hour: 23, zone: "-02:00", clock: 30, midnight: 15}]

  - name: "Temporal null"
    description: "A temporal value of null is null, through functions, arithmetic and fields."
    steps:
      - cypher: |
          RETURN {date: date(null) IS NULL, datetime: datetime(null) IS NULL, duration: duration(null) IS NULL,
                  plus: (null + duration('P1D')) IS NULL, field: date(null).year IS NULL,
                  between: duration.between(date(null), date('2024-03-15')) IS NULL, times: (duration('P1D') * null) IS NULL,
                  sum: (duration('P1D') + duration(null)) IS NULL, moved: (date('2024-03-15') + duration(null)) IS NULL,
                  days: duration(null).days IS NULL}
        rows: [{date: true, datetime: true, duration: true, plus: true, field: true, between: true, times: true, sum: true, moved: true, days: true}]
      - cypher: "CREATE (:CyTemporal {id: 'a', to: date('2024-03-15')})"
      - note: "A property the node doesn't have."
        cypher: "MATCH (n:CyTemporal) RETURN duration.between(n.from, n.to) IS NULL"
        rows: [true]
      - note: "A moment or time made of it, and moved, is null, and is written as no property."
        cypher: |
          MATCH (n:CyTemporal) SET n.next = datetime(n.at) + duration('P1D')
          RETURN [datetime(n.at) + duration('P1D'), localdatetime(n.at) + duration('P1D'), time(n.at) + duration('PT1H'),
                  localtime(n.at) + duration('PT1H'), n.next IS NULL]
        rows: [[null, null, null, null, true]]

  - name: "Temporal round trip through the store"
    description: "A temporal value written to the store is read back as the value it was."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-03-15T10:30:00+02:00'), day: date('2024-03-15'), d: duration('P1M2D')})"
      - cypher: |
          MATCH (n:CyTemporal)
          RETURN {hour: n.at.hour, zone: n.at.timezone, months: n.d.months, days: n.d.days, plus: (date('2024-01-31') + n.d).day,
                  minus: (n.day - duration('P1D')).day, durationPlus: (n.d + duration('P1D')).days,
                  otherOffset: n.at = datetime('2024-03-15T08:30:00Z'), same: datetime(n.at) = datetime('2024-03-15T10:30:00+02:00'),
                  later: (duration('P1D') + n.day).month, reversed: (n.d + date('2024-01-31')).day,
                  shorter: (duration('P1M3D') - n.d).days}
        rows: [{hour: 10, zone: "+02:00", months: 1, days: 2, plus: 2, minus: 14, durationPlus: 3, otherOffset: false, same: true, later: 3, reversed: 2, shorter: 1}]

  - name: "Temporal values through WITH, ORDER BY and collect"
    description: "A temporal value is carried through WITH, ORDER BY and collect."
    steps:
      - cypher: "UNWIND [date('2024-03-15'), date('2024-01-02')] AS d WITH d ORDER BY d RETURN collect(d.month)"
        rows: [[1, 3]]
      - cypher: "UNWIND [datetime('2024-03-15T10:00:00+02:00')] AS t WITH collect(t) AS ts RETURN [x IN ts | x.hour]"
        rows: [[10]]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-03-15T10:00:00+02:00')}), (:CyTemporal {id: 'b', at: datetime('2024-03-15T09:00:00Z')})"
      - cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY datetime(n.at)"
        rows: ["a", "b"]
      - note: "Bound by a WITH, a zoned value keeps its kind: it sorts and compares as the moment it is."
        cypher: "MATCH (n:CyTemporal) WITH n, datetime(n.at) AS t RETURN n.id ORDER BY t"
        rows: ["a", "b"]
      - cypher: "WITH datetime('2024-03-15T10:00:00+02:00') AS a, datetime('2024-03-15T09:00:00Z') AS b RETURN a < b"
        rows: [true]

  - name: "Temporal kind through expressions"
    description: "A temporal value keeps its kind through coalesce, CASE, a list, UNWIND, an index, collect and a list comprehension."
    steps:
      - cypher: |
          RETURN {coalesce: (coalesce(null, duration('PT1H')) * 2).minutes,
                  case: (CASE WHEN true THEN duration('PT1H') ELSE duration('PT2H') END * 2).minutes,
                  index: ([duration('PT1H')][0] * 2).minutes, comprehension: [d IN [duration('PT1H')] | (d * 2).minutes],
                  projected: [x IN [d IN [duration('PT1H')] | d * 2] | (x * 2).minutes]}
        rows: [{coalesce: 120, case: 120, index: 120, comprehension: [120], projected: [240]}]
      - cypher: "UNWIND [duration('PT1H'), duration('PT2H')] AS d RETURN (d * 2).minutes"
        rows: [120, 240]
      - cypher: "WITH [duration('PT1H')] AS ds, 0 AS i RETURN (ds[i] * 2).minutes"
        rows: [120]
      - cypher: "UNWIND [duration('PT1H')] AS d WITH collect(d) AS ds RETURN [x IN ds | (x * 2).minutes]"
        rows: [[120]]
      - note: "A zoned value so kept sorts as the moment it is, whatever its offset."
        cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts UNWIND ts AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]
      - note: "A list reversed, its tail, or two lists of one kind together, keep their items' kind."
        cypher: "UNWIND reverse([datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00')]) AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]
      - cypher: "UNWIND tail([datetime('2024-01-01T00:00:00Z'), datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00')]) AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]
      - cypher: "UNWIND [datetime('2024-03-15T09:00:00Z')] + [datetime('2024-03-15T10:00:00+02:00')] AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]
      - cypher: "UNWIND [1, 2] AS i WITH CASE i WHEN 1 THEN datetime('2024-03-15T10:00:00+02:00') ELSE datetime('2024-03-15T09:00:00Z') END AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]

  - name: "Zoned kind through head, last, a slice, min and max"
    description: "A zoned value taken from a list by head(), last() or a slice, and one min() or max() gives, sorts and compares as the moment it is, whatever its offset."
    steps:
      - cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts UNWIND [[0], [1]] AS i RETURN i[0] ORDER BY head([ts[i[0]]])"
        rows: [0, 1]
      - cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts UNWIND [0, 1] AS i RETURN i ORDER BY last(ts[..i + 1]) DESC"
        rows: [1, 0]
      - cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts UNWIND [0, 1] AS i RETURN i ORDER BY head(ts[i..])"
        rows: [0, 1]
      - cypher: "UNWIND [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS t RETURN [max(t).hour, min(t).hour]"
        rows: [[9, 10]]
      - cypher: "UNWIND [[1, datetime('2024-03-15T10:00:00+02:00')], [1, datetime('2024-03-15T09:00:00Z')], [2, datetime('2024-03-15T07:30:00Z')]] AS r WITH r[0] AS k, r[1] AS t WITH k, max(t) AS m RETURN k ORDER BY m"
        rows: [2, 1]
      - cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts RETURN [head(ts) < last(ts), head(ts).hour]"
        rows: [[true, 10]]

  - name: "Zoned kind in a list, and in a list of lists"
    description: "A list of zoned values, and a list of lists of them, sorts and gives min() and max() item by item, each item as the moment it is, whatever its offset; a list that starts another first, a null item after any moment."
    steps:
      - cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH [t] AS ts RETURN ts[0].hour ORDER BY ts"
        rows: [10, 8, 9]
      - cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH [t] AS ts RETURN ts[0].hour ORDER BY ts DESC"
        rows: [9, 8, 10]
      - note: "Collected by group."
        cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH t.hour AS h, collect(t) AS ts RETURN h ORDER BY ts"
        rows: [10, 8, 9]
      - note: "Unwound from a list of lists."
        cypher: "UNWIND [[datetime('2024-03-15T09:00:00Z')], [datetime('2024-03-15T10:00:00+02:00')], [datetime('2024-03-15T08:30:00Z')]] AS ts RETURN ts[0].hour ORDER BY ts"
        rows: [10, 8, 9]
      - note: "A list of lists of them."
        cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH [[t]] AS l RETURN l[0][0].hour ORDER BY l"
        rows: [10, 8, 9]
      - cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH t.hour AS h, collect([t]) AS l RETURN h ORDER BY l"
        rows: [10, 8, 9]
      - note: "A list that starts another comes first; a null item after any moment."
        cypher: "WITH [datetime('2024-03-15T10:00:00+02:00')] AS x, [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS y UNWIND [y, x] AS l RETURN size(l) ORDER BY l"
        rows: [1, 2]
      - cypher: "WITH [datetime('2024-03-15T10:00:00+02:00'), null] AS x, [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS y UNWIND [x, y] AS l RETURN size([i IN l WHERE i IS NULL]) ORDER BY l"
        rows: [0, 1]
      - note: "A long list, whose moments are past 4000 bytes of text."
        cypher: "UNWIND [0, 1] AS k WITH k, [x IN range(1, 200) | datetime('2024-03-15T09:00:00Z') + duration({minutes: x - k})] AS l RETURN k ORDER BY l"
        rows: [1, 0]
      - note: "min() and max() of them."
        cypher: "UNWIND [[datetime('2024-03-15T09:00:00Z')], [datetime('2024-03-15T10:00:00+02:00')], [datetime('2024-03-15T08:30:00Z')]] AS l RETURN [min(l)[0].hour, max(l)[0].hour]"
        rows: [[10, 9]]
      - cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH [[t]] AS l RETURN [min(l)[0][0].hour, max(l)[0][0].hour]"
        rows: [[10, 9]]
      - note: "A time of day with an offset, as a moment."
        cypher: "UNWIND [time('10:00:00+02:00'), time('09:00:00Z'), time('08:30:00Z')] AS t WITH [t] AS ts RETURN ts[0].hour ORDER BY ts"
        rows: [10, 8, 9]
      - cypher: "UNWIND [time('10:00:00+02:00'), time('09:00:00Z'), time('08:30:00Z')] AS t WITH [t] AS l RETURN [min(l)[0].hour, max(l)[0].hour]"
        rows: [[10, 9]]
      - note: "Taken from a list kept in order, by head() and last()."
        cypher: "UNWIND [datetime('2024-03-15T09:00:00Z'), datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T08:30:00Z')] AS t WITH t ORDER BY t WITH collect(t) AS ts RETURN [head(ts).hour, last(ts).hour]"
        rows: [[10, 9]]

  - name: "Zoned kind in an unwound list and in a map"
    description: "A zoned value taken from an unwound list of lists by head(), last() or an index, and one a map holds, sorts, compares and gives min() and max() as the moment it is, whatever its offset."
    steps:
      - cypher: "UNWIND [[datetime('2024-03-15T10:00:00+02:00')], [datetime('2024-03-15T09:00:00Z')]] AS ts RETURN ts[0].hour ORDER BY head(ts)"
        rows: [10, 9]
      - cypher: "UNWIND [[datetime('2024-03-15T10:00:00+02:00')], [datetime('2024-03-15T09:00:00Z')]] AS ts RETURN ts[0].hour ORDER BY ts[0]"
        rows: [10, 9]
      - cypher: "UNWIND [[datetime('2024-03-15T10:00:00+02:00')], [datetime('2024-03-15T09:00:00Z')]] AS ts RETURN ts[0].hour ORDER BY last(ts)"
        rows: [10, 9]
      - cypher: "UNWIND [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: datetime('2024-03-15T09:00:00Z')}] AS m RETURN m.t.hour ORDER BY m.t"
        rows: [10, 9]
      - cypher: "UNWIND [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: datetime('2024-03-15T09:00:00Z')}] AS m RETURN m.t.hour ORDER BY m['t'] DESC"
        rows: [9, 10]
      - cypher: "UNWIND [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: datetime('2024-03-15T09:00:00Z')}] AS m RETURN [max(m.t).hour, min(m.t).hour]"
        rows: [[9, 10]]
      - note: "A null entry after any moment; a map bound by a WITH, and one taken from a list by its place."
        cypher: "UNWIND [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: null}, {t: datetime('2024-03-15T09:00:00Z')}] AS m RETURN m.t.hour ORDER BY m.t"
        rows: [10, 9, null]
      - cypher: "WITH {t: datetime('2024-03-15T10:00:00+02:00')} AS a, {t: datetime('2024-03-15T09:00:00Z')} AS b RETURN [a.t < b.t, a['t'] > b['t'], [a, b][0].t < [a, b][1].t]"
        rows: [[true, false, true]]
      - cypher: "WITH [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: datetime('2024-03-15T09:00:00Z')}] AS ms UNWIND [1, 0] AS i RETURN i ORDER BY ms[i].t"
        rows: [0, 1]
      - note: "Maps collected, and one taken from them by head() and last()."
        cypher: "UNWIND [{t: datetime('2024-03-15T10:00:00+02:00')}, {t: datetime('2024-03-15T09:00:00Z')}] AS m WITH collect(m) AS ms RETURN [head(ms).t < last(ms).t, head(ms).t.hour]"
        rows: [[true, 10]]
      - note: "Maps a write carries on, read from the row it makes."
        cypher: "WITH {t: datetime('2024-03-15T10:00:00+02:00')} AS a, {t: datetime('2024-03-15T09:00:00Z')} AS b CREATE (:CyTemporal {id: 'w'}) RETURN [a.t < b.t, a.t.hour]"
        rows: [[true, 10]]

  - name: "Zoned kind through quantifiers, reduce and writes"
    description: "A zoned value keeps its kind in a quantifier, reduce, a pattern comprehension and a statement that writes."
    steps:
      - cypher: |
          WITH [datetime('2024-03-15T10:00:00+02:00')] AS xs, [datetime('2024-03-15T09:00:00Z')] AS ys
          RETURN any(x IN xs WHERE any(y IN ys WHERE x < y))
        rows: [true]
      - cypher: |
          WITH [datetime('2024-03-15T10:00:00+02:00'), datetime('2024-03-15T09:00:00Z')] AS ts
          RETURN reduce(m = null, t IN ts | CASE WHEN m IS NULL OR t < m THEN t ELSE m END).hour
        rows: [10]
      - cypher: "WITH datetime('2024-03-15T10:00:00+02:00') AS a, datetime('2024-03-15T09:00:00Z') AS b RETURN reduce(s = false, x IN [1] | a < b)"
        rows: [true]
      - cypher: "CREATE (x:CyTemporal {id: 'x'}), (x)-[:AT]->(:CyTemporal {id: 'a', at: datetime('2024-03-15T10:00:00+02:00')}), (x)-[:AT]->(:CyTemporal {id: 'b', at: datetime('2024-03-15T09:00:00Z')})"
      - cypher: "MATCH (x:CyTemporal {id: 'x'}) UNWIND [(x)-->(m) | datetime(m.at)] AS t RETURN t.hour ORDER BY t"
        rows: [10, 9]
      - cypher: "WITH datetime('2024-03-15T10:00:00+02:00') AS a, datetime('2024-03-15T09:00:00Z') AS b CREATE (:CyTemporal {id: 'c'}) RETURN a < b"
        rows: [true]
      - note: "Through writes one after another, and of the value a later WITH gives a variable again."
        cypher: |
          CREATE (n:CyTemporal {id: 'd'}) WITH n, datetime('2024-03-15T10:00:00+02:00') AS a SET n.x = 1
          WITH n, a, datetime('2024-03-15T09:00:00Z') AS b SET n.y = 2 RETURN a < b
        rows: [true]
      - cypher: "WITH duration('P1D') AS a CREATE (n:CyTemporal {id: 'e'}) WITH n, datetime('2024-03-15T10:00:00+02:00') AS a SET n.v = 1 RETURN a.hour"
        rows: [10]
      - note: "A variable a FOREACH or a CALL { … } binds again within is, after it, the value it was."
        cypher: "WITH datetime('2024-03-15T10:00:00+02:00') AS x FOREACH (x IN [duration('P1D')] | CREATE (:CyTemporal {id: 'f'})) RETURN x.hour"
        rows: [10]
      - cypher: "WITH datetime('2024-03-15T10:00:00+02:00') AS a CALL { WITH a WITH duration('P1D') AS a CREATE (:CyTemporal {id: 'g', d: a}) } RETURN a.hour"
        rows: [10]

  - name: "Temporal values from CALL"
    description: "A temporal value returned by CALL { } keeps its kind, and a UNION's takes the kind each query gives it."
    steps:
      - cypher: "CALL { RETURN duration('PT1H') AS d } RETURN (d * 2).minutes"
        rows: [120]
      - cypher: "CALL { RETURN date('2024-03-01') AS d } RETURN (d + duration('P1M')).month"
        rows: [4]
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('2024-03-15')})"
      - cypher: "MATCH (n:CyTemporal) CALL { WITH n RETURN n.day AS d } RETURN (d + duration('P1D')).day"
        rows: [16]
      - cypher: "MATCH (n:CyTemporal) CALL { WITH n CALL { WITH n RETURN n.day + duration('P1D') AS e } RETURN e AS d } RETURN (d + duration('P1D')).day"
        rows: [17]
      - note: "A value of a UNION is of a kind where each of its queries makes it of that one, else of the kind its text tells."
        cypher: "CREATE (:CyTemporal {id: 'b', day: datetime('2023-12-31T23:30:00-02:00')})"
      - cypher: "CALL { RETURN date('2024-03-01') AS d UNION ALL MATCH (n:CyTemporal) RETURN n.day AS d } RETURN d.year ORDER BY toString(d)"
        rows: [2023, 2024, 2024]

  - name: "Temporal values added to lists and text"
    description: "A temporal value is added to a list or a text as any value is."
    steps:
      - cypher: |
          WITH ['x'] AS list, 'Due ' AS due
          RETURN {appended: size(list + date('2024-03-15')), prepended: size(datetime('2024-03-15T10:00:00Z') + list),
                  duration: size(list + duration('P1D')), durationFirst: size(duration('P1D') + list),
                  text: due + date('2024-03-15'), durationText: 'Every ' + duration('P1D')}
        rows: [{appended: 2, prepended: 2, duration: 2, durationFirst: 2, text: "Due 2024-03-15", durationText: "Every P1D"}]
      - note: "What a moment is added to is a list or a text again, of no temporal kind."
        cypher: "WITH 'Due ' AS due WITH due + date('2024-03-15') AS label RETURN label = 'Due 2024-03-15'"
        rows: [true]
      - cypher: "WITH ['x'] AS list RETURN size((list + datetime('2024-03-15T10:00:00Z')) + duration('P1D'))"
        rows: [3]
      - cypher: "CREATE (:CyTemporal {id: 'a', history: [date('2024-01-01')]})"
      - cypher: "MATCH (n:CyTemporal) SET n.history = n.history + date('2024-03-15') RETURN [d IN n.history | d.day]"
        rows: [[1, 15]]

  - name: "Map entries named like temporal fields"
    description: "A map's entry named like a temporal field (day, year, hours, timezone) is just the entry."
    steps:
      - cypher: "UNWIND [{day: 3, year: 2020, hours: 4, timezone: 'x'}] AS r RETURN {day: r.day, year: r.year, hours: r.hours, timezone: r.timezone}"
        rows: [{day: 3, year: 2020, hours: 4, timezone: "x"}]

  - name: "Arithmetic on temporal values read from the store"
    description: "+, -, * and / of a temporal value read from the store, where the statement doesn't know its kind: Neo4j works it out. The SQL stores write temporal arithmetic only where a side is known to be temporal, so with both sides read from the store, or a duration read from the store times or divided by a number, they gave null; they now fail by name until it is compiled (drivine4j#418). A side written in the statement is still worked out."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', d1: duration('P1DT2H'), d2: duration('PT30M'), at: datetime('2024-01-01T10:00Z'), n: 5})"
      - note: "A side written in the statement: worked out on every store."
        cypher: "MATCH (n:CyTemporal) RETURN [toString(n.d1 + duration('PT30M')), toString(n.d1 - duration('PT30M')), toString(n.at + duration('P1D')), n.n + 1]"
        rows: [["P1DT2H30M", "P1DT1H30M", "2024-01-02T10:00:00Z", 6]]
      - note: "Two durations read from the store, added."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.d1 + n.d2"
        error: true
      - note: "Subtracted."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.d1 - n.d2"
        error: true
      - note: "A moment and a duration read from the store, added."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.at + n.d2"
        error: true
      - note: "Subtracted."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.at - n.d2"
        error: true
      - note: "A duration read from the store, times a number."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.d1 * 2"
        error: true
      - note: "Divided by one."
        only: [sql]
        cypher: "MATCH (n:CyTemporal) RETURN n.d1 / 2"
        error: true
      - note: "What Neo4j gives for each."
        only: [neo4j]
        cypher: "MATCH (n:CyTemporal) RETURN [toString(n.d1 + n.d2), toString(n.d1 - n.d2), toString(n.at + n.d2), toString(n.at - n.d2), toString(n.d1 * 2), toString(n.d1 / 2)]"
        rows: [["P1DT2H30M", "P1DT1H30M", "2024-01-01T10:30:00Z", "2024-01-01T09:30:00Z", "P2DT4H", "PT13H"]]

  - name: "Temporal functions on stored values"
    description: "A temporal value read from the store truncates, becomes a duration, and gives the duration between it and another."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-03-15T10:30:00+02:00'), from: date('2024-01-15'), to: date('2024-03-20'), d: duration('P1M2D')})"
      - cypher: |
          MATCH (n:CyTemporal)
          RETURN {minute: datetime.truncate('hour', n.at).minute, zone: datetime.truncate('day', n.at).timezone,
                  months: duration.between(n.from, n.to).months, days: duration.between(n.from, n.to).days,
                  inDays: duration.inDays(n.from, n.to).days, durationDays: duration(toString(n.d)).days}
        rows: [{minute: 0, zone: "+02:00", months: 2, days: 5, inDays: 65, durationDays: 2}]

  - name: "Dates take whole days of a duration"
    description: "A date takes a duration's time in whole days."
    steps:
      - cypher: "RETURN {hourBefore: (date('2024-03-15') - duration('PT1H')).day, dayAndHourBefore: (date('2024-03-15') - duration('PT25H')).day, dayAndHourAfter: (date('2024-03-15') + duration('PT25H')).day}"
        rows: [{hourBefore: 15, dayAndHourBefore: 14, dayAndHourAfter: 16}]
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('2024-03-15')})"
      - note: "A date read from the store, its kind told by its text."
        cypher: "MATCH (n:CyTemporal) RETURN [(n.day - duration('PT1H')).day, (n.day - duration('PT25H')).day]"
        rows: [[15, 14]]

  - name: "ISO text on SQL stores"
    description: "On a SQL store a temporal value comes back as its ISO text."
    steps:
      - only: [sql]
        cypher: |
          RETURN [date('2024-03-15'), datetime('2024-03-15T10:30:45.123+02:00'), localdatetime('2024-03-15T10:30'), localtime('10:30'),
                  duration('P1Y2M3DT4H5M6S'), duration({days: 1, hours: 12}), duration('PT0S'), time('10:30+0200')]
        rows: [["2024-03-15", "2024-03-15T10:30:45.123+02:00", "2024-03-15T10:30:00", "10:30:00", "P1Y2M3DT4H5M6S", "P1DT12H", "PT0S", "10:30:00+02:00"]]

  - name: "A temporal list beside a text list"
    description: "Two lists of temporal values are ordered item by item, and a temporal value beside a text is not ordered, though its ISO text would be."
    steps:
      - cypher: "RETURN [[date('2024-01-01')] < [date('2024-01-02')], [duration('P1D')] <= [duration('P1D')], [date('2024-01-01')] < [localdatetime('2024-01-02T00:00')]]"
        except: [memgraph, falkordb, neptune]
        rows: [[true, true, null]]
      - note: "A zoned value is ordered as the moment it is, and two durations that differ are not ordered."
        cypher: "RETURN [[datetime('2024-01-01T10:00+02:00')] < [datetime('2024-01-01T09:00Z')], [duration('P1D')] < [duration('P2D')], [time('10:00+01:00')] < [time('09:30Z')], [localtime('10:00')] < [localtime('10:00:00.5')]]"
        except: [memgraph, falkordb, neptune]
        rows: [[true, null, true, true]]
      - cypher: "RETURN [[date('2024-01-01')] < ['2024-01-02'], ['2024-01-02'] > [date('2024-01-01')], [duration('P1D')] < ['P2D'], [localdatetime('2024-01-01T10:00')] <= ['2024-01-01T10:00']]"
        except: [memgraph, falkordb, neptune]
        rows: [[null, null, null, null]]

  - name: "A temporal value beside a text that spells it"
    description: "A temporal value is not equal to a text, nor in a list of texts, though its ISO text would be; a list of them is not equal to a list of texts; nor is it ordered beside one."
    steps:
      - cypher: "RETURN [date('2024-01-01') = '2024-01-01', date('2024-01-01') <> '2024-01-01', date('2024-01-01') IN ['2024-01-01'], '2024-01-01' IN [date('2024-01-01')]]"
        rows: [[false, true, false, false]]
      - note: "Of each kind, the text written as it is and as the value's ISO text. Memgraph has no time()."
        except: [memgraph]
        cypher: |
          RETURN [duration('P1D') = 'P1D', duration('P1D') <> 'P1D', localdatetime('2024-01-01T10:00') = '2024-01-01T10:00',
                  localdatetime('2024-01-01T10:00') = '2024-01-01T10:00:00', datetime('2024-01-01T10:00Z') = '2024-01-01T10:00Z',
                  datetime('2024-01-01T10:00Z') = '2024-01-01T10:00:00Z', localtime('10:00') = '10:00:00', time('10:00Z') = '10:00:00Z']
        rows: [[false, true, false, false, false, false, false, false]]
      - cypher: "RETURN [[date('2024-01-01')] = ['2024-01-01'], [date('2024-01-01')] <> ['2024-01-01'], [duration('P1D')] = ['P1D'], [datetime('2024-01-01T10:00:00Z')] = ['2024-01-01T10:00:00Z']]"
        rows: [[false, true, false, false]]
      - note: "Item by item: a temporal value and a text at the same place."
        cypher: "RETURN [[date('2024-01-01'), 'x'] = ['2024-01-01', 'x'], [1, date('2024-01-01')] = [1, '2024-01-01'], ['2024-01-01', date('2024-01-02')] = [date('2024-01-01'), '2024-01-02'], [date('2024-01-01'), 'x'] = [date('2024-01-01'), 'x']]"
        rows: [[false, false, false, true]]
      - note: "Bound by a WITH, and an item taken from such a list."
        cypher: "WITH [date('2024-01-01')] AS ds, ['2024-01-01'] AS ss RETURN [ds = ss, ds <> ss, ss = ds, date('2024-01-01') IN ss, '2024-01-01' IN ds, ds[0] = ss[0]]"
        rows: [[false, true, false, false, false, false]]
      - note: "A text given as a parameter, and a list of them."
        cypher: "RETURN [date('2024-01-01') = $d, $d = date('2024-01-01'), $d IN [date('2024-01-01')], [date('2024-01-01')] = $l, date('2024-01-01') IN $l]"
        parameters: {d: "2024-01-01", l: ["2024-01-01"]}
        rows: [[false, false, false, false, false]]
      - note: "A list given as a parameter that holds a null, compared item by item."
        cypher: "WITH [date('2024-01-01'), null] AS ds RETURN [[date('2024-01-01'), null] = $l, $l = [date('2024-01-01'), null], ds = $l]"
        parameters: {l: ["2024-01-01", null]}
        rows: [[false, false, false]]
      - note: "A list of lists of them, beside lists of texts, and of maps that hold their texts at their kind's name."
        cypher: |
          WITH [[date('2024-01-01')]] AS dss
          RETURN [dss = [['2024-01-01']], [[date('2024-01-01')]] = $ll, [[date('2024-01-01'), null]] = $ln, [date('2024-01-01')] IN [['2024-01-01']],
                  ['2024-01-01'] IN dss, [[date('2024-01-01')]] = $lm, [date('2024-01-01')] IN [[{date: '2024-01-01'}]], [date('2024-01-01')] IN dss]
        parameters: {ll: [["2024-01-01"]], ln: [["2024-01-01", null]], lm: [[{date: "2024-01-01"}]]}
        rows: [[false, false, false, false, false, false, false, true]]
      - note: "Nor is it equal to a map that holds its text at its kind's name, written or given."
        cypher: "WITH date('2024-01-01') AS d, [date('2024-01-01')] AS ds RETURN [{date: '2024-01-01'} IN ds, $m IN ds, ds = $l, d IN $l]"
        parameters: {m: {date: "2024-01-01"}, l: [{date: "2024-01-01"}]}
        rows: [[false, false, false, false]]
      - note: "A text the statement works out, and the text a simple CASE compares."
        cypher: "RETURN [date('2024-01-01') = toString(date('2024-01-01')), toString(date('2024-01-01')) = date('2024-01-01'), CASE date('2024-01-01') WHEN '2024-01-01' THEN 'text' WHEN date('2024-01-01') THEN 'date' END]"
        rows: [[false, false, "date"]]
      - note: "Null is compared with nothing: the comparison is null, unless another pair of items differs."
        cypher: |
          RETURN [date('2024-01-01') = null, date(null) = '2024-01-01', date('2024-01-01') <> null, date(null) <> '2024-01-01',
                  date('2024-01-01') IN ['2024-01-01', null], date(null) IN ['2024-01-01'], [date('2024-01-01'), null] = ['2024-01-01', null],
                  [date('2024-01-01'), null] = ['x', 'y']]
        rows: [[null, null, null, null, null, null, false, false]]
      - note: "A list written with a null, compared item by item with a text given as a parameter."
        cypher: "RETURN [$d IN [date('2024-01-01'), null], date('2024-01-01') IN [$d, null]]"
        parameters: {d: "2024-01-01"}
        rows: [[null, null]]
      - note: "A temporal value is equal to no value of another kind, a temporal value of another kind among them."
        cypher: "RETURN [date('2024-01-01') = localdatetime('2024-01-01T00:00'), datetime('2024-01-01T00:00Z') = localdatetime('2024-01-01T00:00'), date('2024-01-01') = 1, date('2024-01-01') = ['2024-01-01']]"
        rows: [[false, false, false, false]]
      - note: "Nor is it ordered beside a text. Memgraph refuses to order values of two kinds; as in the case before, the other engines aren't pinned."
        except: [memgraph, falkordb, neptune]
        cypher: "RETURN [date('2024-01-01') < '2024-01-02', '2024-01-02' > date('2024-01-01'), localdatetime('2024-01-01T10:00') <= '2024-01-01T10:00:00']"
        rows: [[null, null, null]]
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('2024-01-01')})"
      - note: "Read from the store too: a SQL store holds it as its tag, which a text that spells it is not (#161)."
        cypher: "MATCH (n:CyTemporal) RETURN n.day = '2024-01-01'"
        only: [neo4j, sql]
        rows: [false]

  - name: "A text parameter in a list or a map beside a temporal value"
    description: "A temporal value is in no list written of texts given as parameters, nor is a list or a map that holds one equal to one that holds such a text at its place, though its ISO text would be (drivine4j#779)."
    steps:
      - note: "Each kind beside its ISO text given as $s, bare, in a list, in a list of lists and in a map; and in a map beside the text written."
        cypher: |
          RETURN [date('2024-01-01') = $s, date('2024-01-01') IN [$s], $s IN [date('2024-01-01')], [date('2024-01-01')] = [$s], [date('2024-01-01')] <> [$s], [[date('2024-01-01')]] = [[$s]], [date('2024-01-01')] IN [[$s]],
                  {k: date('2024-01-01')} = {k: $s}, {k: date('2024-01-01')} <> {k: $s}, {k: date('2024-01-01'), n: 1} = {k: $s, n: 1}, {k: date('2024-01-01')} = {k: '2024-01-01'}]
        parameters: {s: "2024-01-01"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - cypher: |
          RETURN [localdatetime('2024-01-01T10:00') = $s, localdatetime('2024-01-01T10:00') IN [$s], $s IN [localdatetime('2024-01-01T10:00')], [localdatetime('2024-01-01T10:00')] = [$s], [localdatetime('2024-01-01T10:00')] <> [$s], [[localdatetime('2024-01-01T10:00')]] = [[$s]], [localdatetime('2024-01-01T10:00')] IN [[$s]],
                  {k: localdatetime('2024-01-01T10:00')} = {k: $s}, {k: localdatetime('2024-01-01T10:00')} <> {k: $s}, {k: localdatetime('2024-01-01T10:00'), n: 1} = {k: $s, n: 1}, {k: localdatetime('2024-01-01T10:00')} = {k: '2024-01-01T10:00:00'}]
        parameters: {s: "2024-01-01T10:00:00"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - cypher: |
          RETURN [datetime('2024-01-01T10:00Z') = $s, datetime('2024-01-01T10:00Z') IN [$s], $s IN [datetime('2024-01-01T10:00Z')], [datetime('2024-01-01T10:00Z')] = [$s], [datetime('2024-01-01T10:00Z')] <> [$s], [[datetime('2024-01-01T10:00Z')]] = [[$s]], [datetime('2024-01-01T10:00Z')] IN [[$s]],
                  {k: datetime('2024-01-01T10:00Z')} = {k: $s}, {k: datetime('2024-01-01T10:00Z')} <> {k: $s}, {k: datetime('2024-01-01T10:00Z'), n: 1} = {k: $s, n: 1}, {k: datetime('2024-01-01T10:00Z')} = {k: '2024-01-01T10:00:00Z'}]
        parameters: {s: "2024-01-01T10:00:00Z"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - cypher: |
          RETURN [localtime('10:00') = $s, localtime('10:00') IN [$s], $s IN [localtime('10:00')], [localtime('10:00')] = [$s], [localtime('10:00')] <> [$s], [[localtime('10:00')]] = [[$s]], [localtime('10:00')] IN [[$s]],
                  {k: localtime('10:00')} = {k: $s}, {k: localtime('10:00')} <> {k: $s}, {k: localtime('10:00'), n: 1} = {k: $s, n: 1}, {k: localtime('10:00')} = {k: '10:00:00'}]
        parameters: {s: "10:00:00"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - note: "Memgraph has no time()."
        except: [memgraph]
        cypher: |
          RETURN [time('10:00Z') = $s, time('10:00Z') IN [$s], $s IN [time('10:00Z')], [time('10:00Z')] = [$s], [time('10:00Z')] <> [$s], [[time('10:00Z')]] = [[$s]], [time('10:00Z')] IN [[$s]],
                  {k: time('10:00Z')} = {k: $s}, {k: time('10:00Z')} <> {k: $s}, {k: time('10:00Z'), n: 1} = {k: $s, n: 1}, {k: time('10:00Z')} = {k: '10:00:00Z'}]
        parameters: {s: "10:00:00Z"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - cypher: |
          RETURN [duration('P1D') = $s, duration('P1D') IN [$s], $s IN [duration('P1D')], [duration('P1D')] = [$s], [duration('P1D')] <> [$s], [[duration('P1D')]] = [[$s]], [duration('P1D')] IN [[$s]],
                  {k: duration('P1D')} = {k: $s}, {k: duration('P1D')} <> {k: $s}, {k: duration('P1D'), n: 1} = {k: $s, n: 1}, {k: duration('P1D')} = {k: 'P1D'}]
        parameters: {s: "P1D"}
        rows: [[false, false, false, false, true, false, false, false, true, false, false]]
      - note: "Nor beside a map that holds its text at its kind's name, given or written; and the same value at the same place is equal."
        cypher: |
          RETURN [date('2024-01-01') IN [$m], [date('2024-01-01')] = [$m], {k: date('2024-01-01')} = {k: $m}, {k: date('2024-01-01')} = {k: {date: $s}},
                  {k: date('2024-01-01')} = {k: date('2024-01-01')}, {k: date('2024-01-01'), t: $s} = {k: date('2024-01-01'), t: $s}, [date('2024-01-01'), $s] = [date('2024-01-01'), $s]]
        parameters: {s: "2024-01-01", m: {date: "2024-01-01"}}
        rows: [[false, false, false, false, true, true, true]]
      - note: "A null given or written beside them: null, unless another pair of items or entries differs."
        cypher: |
          RETURN [date('2024-01-01') IN [$n], date('2024-01-01') IN [$s, null], [date('2024-01-01')] = [$n], {k: date('2024-01-01')} = {k: $n},
                  {k: date('2024-01-01'), n: null} = {k: $s, n: null}, [date('2024-01-01'), $n] = [$s, $n]]
        parameters: {s: "2024-01-01", n: null}
        rows: [[null, null, null, null, false, false]]

  - name: "Years before 1"
    description: "A year is numbered astronomically, as ISO 8601 numbers it: 0000 is 1 BC and -0044 is 45 BC, read, made, worked out, truncated, written and read back."
    steps:
      - cypher: |
          RETURN [toString(date('0000-06-01')), toString(date('-0001-12-31')), toString(date('-1234-06-01')),
                  toString(localdatetime('-0044-03-15T12:00:00.123')), toString(datetime('-0044-03-15T12:00:00+0200')),
                  date('-1234-06-01').year, date('0000-06-01').year, date('-0044-03-15').month, date('-0044-03-15').day]
        only: [neo4j, sql]
        note: "Neo4j's answers. Memgraph, FalkorDB and Neptune aren't pinned for a year before 1."
        rows: [["0000-06-01", "-0001-12-31", "-1234-06-01", "-0044-03-15T12:00:00.123", "-0044-03-15T12:00:00+02:00", -1234, 0, 3, 15]]
      - cypher: |
          RETURN [toString(date({year: 0})), toString(date({year: -1})), toString(date({year: -44, month: 3, day: 15})),
                  toString(datetime({year: -44, month: 3, day: 15, hour: 12, timezone: '+01:00'})), toString(localdatetime({year: 0, month: 1, day: 1}))]
        only: [neo4j, sql]
        rows: [["0000-01-01", "-0001-01-01", "-0044-03-15", "-0044-03-15T12:00:00+01:00", "0000-01-01T00:00:00"]]
      - cypher: |
          RETURN [toString(date('0001-01-01') - duration('P1D')), toString(date('0000-01-01') - duration('P1D')), toString(date('-0001-12-31') + duration('P1D')),
                  toString(duration.between(date('0000-01-01'), date('0001-01-01'))), toString(duration.between(date('-0001-01-01'), date('0001-01-01'))),
                  date('-0044-03-15') < date('0001-01-01'), datetime('-0044-03-15T12:00:00+02:00') < datetime('-0044-03-15T10:00:01Z')]
        only: [neo4j, sql]
        note: "Across the year 0, which Postgres and Oracle have no year of."
        rows: [["0000-12-31", "-0001-12-31", "0000-01-01", "P1Y", "P2Y", true, true]]
      - cypher: |
          RETURN [toString(date.truncate('millennium', date('0999-12-31'))), toString(date.truncate('century', date('0050-06-01'))),
                  toString(date.truncate('decade', date('0005-06-01'))), toString(date.truncate('millennium', date('-1234-06-01'))),
                  toString(date.truncate('year', date('-0044-03-15'))), toString(datetime.truncate('millennium', datetime('0999-12-31T10:00:00Z'))),
                  toString(localdatetime.truncate('century', localdatetime('0050-06-01T10:00:00')))]
        only: [neo4j, sql]
        note: "Memgraph and FalkorDB have no date.truncate()."
        rows: [["0000-01-01", "0000-01-01", "0000-01-01", "-1000-01-01", "-0044-01-01", "0000-01-01T00:00:00Z", "0000-01-01T00:00:00"]]
      - cypher: |
          RETURN [toString(date.truncate('millennium', date('-0001-06-01'))), toString(date.truncate('century', date('-0001-06-01'))),
                  toString(date.truncate('decade', date('-0001-06-01'))), toString(date.truncate('millennium', date('-0999-06-01'))),
                  toString(date.truncate('century', date('-0150-06-01'))), toString(date.truncate('decade', date('-0015-06-01')))]
        only: [neo4j, sql]
        note: "A year before 1 is truncated toward 0."
        rows: [["0000-01-01", "0000-01-01", "0000-01-01", "0000-01-01", "-0100-01-01", "-0010-01-01"]]
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('-0044-03-15'), at: datetime('-0044-03-15T12:00:00Z'), clock: localdatetime('0000-01-01T00:00:00')}), (:CyTemporal {id: 'b', day: date('0001-01-01') - duration('P1D')})"
        only: [neo4j, sql]
      - note: "Read from the store, their kind told by their text."
        cypher: "MATCH (n:CyTemporal) RETURN [n.id, toString(n.day), n.day.year, toString(n.day + duration('P1D')), toString(n.at + duration('P1Y')), n.clock.year] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", "-0044-03-15", -44, "-0044-03-16", "-0043-03-15T12:00:00Z", 0], ["b", "0000-12-31", 0, "0001-01-01", null, null]]
      - cypher: "MATCH (n:CyTemporal) WHERE n.day < date('0001-01-01') RETURN n.id ORDER BY n.id"
        only: [neo4j, sql]
        rows: ["a", "b"]

  - name: "A node found by a moment an unwound row holds"
    description: "A node is found by a moment it holds only where the row's moment is the same at the same offset, as moments compare: the same instant at another offset is another value (drivine4j#617)."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-03-15T10:00:00+02:00')}), (:CyTemporal {id: 'b', at: datetime('2024-03-15T08:00:00Z')})"
      - cypher: "UNWIND [datetime('2024-03-15T10:00:00+02:00')] AS t MATCH (n:CyTemporal {at: t}) RETURN n.id"
        rows: ["a"]
      - cypher: "UNWIND [datetime('2024-03-15T08:00:00Z')] AS t MATCH (n:CyTemporal {at: t}) RETURN n.id"
        rows: ["b"]
      - note: "Rows of more than one kind: what the row holds is known only as it is read."
        cypher: "UNWIND [{at: datetime('2024-03-15T10:00:00+02:00')}, {at: 'x'}, {at: 7}, {at: [1]}] AS row MATCH (n:CyTemporal {at: row.at}) RETURN n.id"
        rows: ["a"]
      - cypher: "UNWIND [{at: datetime('2024-03-15T08:00:00Z')}, {at: 'x'}] AS row MATCH (n:CyTemporal {at: row.at}) RETURN n.id"
        rows: ["b"]
      - note: "As a WHERE compares them."
        cypher: "UNWIND [{at: datetime('2024-03-15T10:00:00+02:00')}, {at: 'x'}] AS row MATCH (n:CyTemporal) WHERE n.at = row.at RETURN n.id"
        rows: ["a"]

  - name: "Zoned values at one instant"
    description: "Two moments, or two times, at one instant and two offsets are not equal, as Neo4j has them (#161): they are two values under =, IN, DISTINCT and a list's =, and order by their instant, then their offset, the larger offset later."
    steps:
      - cypher: "WITH datetime('2024-01-01T10:00:00+02:00') AS a, datetime('2024-01-01T08:00:00Z') AS b RETURN [a = b, a < b, a > b, a <= b, a >= b, a <> b, b IN [a], [a] = [b]]"
        only: [neo4j, sql]
        rows: [[false, false, true, false, true, true, false, false]]
      - cypher: "UNWIND [datetime('2024-01-01T10:00:00+02:00'), datetime('2024-01-01T08:00:00Z')] AS x RETURN count(DISTINCT x)"
        only: [neo4j, sql]
        rows: [2]
      - cypher: "WITH time('10:00:00+02:00') AS a, time('08:00:00Z') AS b RETURN [a = b, a > b, a < b]"
        only: [neo4j, sql]
        rows: [[false, true, false]]
      - cypher: "UNWIND [datetime('2024-01-01T08:00:00Z'), datetime('2024-01-01T10:00:00+02:00'), datetime('2024-01-01T09:00:00+02:00')] AS t RETURN toString(t) ORDER BY t"
        only: [neo4j, sql]
        rows: ["2024-01-01T09:00:00+02:00", "2024-01-01T08:00:00Z", "2024-01-01T10:00:00+02:00"]
      - cypher: "UNWIND [time('08:00:00Z'), time('10:00:00+02:00'), time('09:00:00+02:00')] AS t RETURN toString(t) ORDER BY t"
        only: [neo4j, sql]
        rows: ["09:00:00+02:00", "08:00:00Z", "10:00:00+02:00"]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-01-01T08:00:00Z'), t: time('08:00:00Z')}), (:CyTemporal {id: 'b', at: datetime('2024-01-01T10:00:00+02:00'), t: time('10:00:00+02:00')}), (:CyTemporal {id: 'c', at: datetime('2024-01-01T09:00:00+02:00'), t: time('09:00:00+02:00')})"
        only: [neo4j, sql]
      - note: "Read from the store, their kind told by their tags: two stored zoned values compare and sort by their instant, then their offset, where they sorted by their text before (drivine4j#524)."
        cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY n.at"
        only: [neo4j, sql]
        rows: ["c", "a", "b"]
      - cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY n.t DESC"
        only: [neo4j, sql]
        rows: ["b", "a", "c"]
      - cypher: "MATCH (a:CyTemporal {id: 'a'}), (n:CyTemporal) RETURN [n.id, n.at < a.at, n.at = a.at, n.t > a.t] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", false, true, false], ["b", false, false, true], ["c", true, false, false]]
      - cypher: "MATCH (n:CyTemporal) RETURN [toString(min(n.at)), toString(max(n.at)), toString(min(n.t)), toString(max(n.t))]"
        only: [neo4j, sql]
        rows: [["2024-01-01T09:00:00+02:00", "2024-01-01T10:00:00+02:00", "09:00:00+02:00", "10:00:00+02:00"]]
      - cypher: "MATCH (n:CyTemporal) RETURN count(DISTINCT n.at)"
        only: [neo4j, sql]
        rows: [3]
      - note: "Memgraph, probed (3.14): the same answers for moments; it has no zoned time."
        cypher: "WITH datetime('2024-01-01T10:00:00+02:00') AS a, datetime('2024-01-01T08:00:00Z') AS b RETURN [a = b, a < b, a > b, a <= b, b IN [a], [a] = [b]]"
        only: [memgraph]
        rows: [[false, false, true, false, false, false]]

  - name: "A zoned time across midnight"
    description: "A zoned time compares by its nanoseconds of the day in UTC, from -18 to 42 hours, with no wrap at midnight, as Neo4j compares it (#161): time('01:00+02:00') is -1 hour, before time('22:00Z')."
    steps:
      - cypher: "RETURN [time('01:00:00+02:00') < time('22:00:00Z'), time('01:00:00+02:00') = time('22:00:00Z'), time('01:00:00+02:00') > time('22:00:00Z'), time('00:30:00+01:00') < time('23:30:00Z')]"
        only: [neo4j, sql]
        rows: [[true, false, false, true]]
      - cypher: "UNWIND [time('01:00:00+02:00'), time('22:00:00Z'), time('23:30:00Z'), time('00:30:00+01:00')] AS t RETURN toString(t) ORDER BY t"
        only: [neo4j, sql]
        rows: ["01:00:00+02:00", "00:30:00+01:00", "22:00:00Z", "23:30:00Z"]
      - cypher: "UNWIND [time('01:00:00+02:00'), time('22:00:00Z'), time('23:30:00Z'), time('00:30:00+01:00')] AS t RETURN [toString(min(t)), toString(max(t))]"
        only: [neo4j, sql]
        rows: [["01:00:00+02:00", "23:30:00Z"]]
      - cypher: "UNWIND [['a', time('01:00:00+02:00')], ['b', time('22:00:00Z')], ['c', time('23:30:00Z')], ['d', time('00:30:00+01:00')]] AS r CREATE (:CyTemporal {id: r[0], t: r[1]})"
        only: [neo4j, sql]
      - note: "Read from the store."
        cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY n.t"
        only: [neo4j, sql]
        rows: ["a", "d", "b", "c"]
      - cypher: "MATCH (a:CyTemporal {id: 'a'}), (b:CyTemporal {id: 'b'}) RETURN [a.t < b.t, a.t = b.t, a.t > b.t]"
        only: [neo4j, sql]
        rows: [[true, false, false]]

  - name: "A zoned time at the offsets' limits"
    description: "The least zoned time is 00:00 at +18:00, 18 hours before midnight UTC, and the greatest 23:59:59.999999999 at -18:00, 42 hours after it less a nanosecond, as Neo4j orders them (#161)."
    steps:
      - cypher: "RETURN [time('00:00:00+18:00') < time('23:59:59.999999999-18:00'), time('00:00:00+18:00') = time('23:59:59.999999999-18:00'), time('00:00:00+18:00') > time('23:59:59.999999999-18:00'), time('00:00:00+18:00') < time('00:00:00Z'), time('00:00:00+18:00') = time('06:00:00Z')]"
        only: [neo4j, sql]
        rows: [[true, false, false, true, false]]
      - cypher: "UNWIND [time('23:59:59.999999999-18:00'), time('00:00:00Z'), time('00:00:00+18:00'), time('23:59:59.999999999Z'), time('00:00:00-18:00'), time('23:59:59.999999999+18:00')] AS t RETURN [t.hour, t.nanosecond, t.offsetSeconds] ORDER BY t"
        only: [neo4j, sql]
        rows: [[0, 0, 64800], [0, 0, 0], [23, 999999999, 64800], [0, 0, -64800], [23, 999999999, 0], [23, 999999999, -64800]]

  - name: "A date and the text that spells it"
    description: "A date is not equal to the text that spells it, read from the store or not, as Neo4j has it: a stored date is no longer found by its text (#161)."
    steps:
      - cypher: "RETURN [date('2024-01-01') = '2024-01-01', '2024-01-01' IN [date('2024-01-01')], date('2024-01-01') < '2024-01-02']"
        rows: [[false, false, null]]
      - cypher: "CREATE (:CyTemporal {id: 'a', d: date('2024-01-01'), s: '2024-01-01'}), (:CyTemporal {id: 'b', d: '2024-01-01'})"
      - cypher: "MATCH (n:CyTemporal) RETURN [n.id, n.d = date('2024-01-01'), n.d = '2024-01-01', n.d = n.s] ORDER BY n.id"
        rows: [["a", true, false, false], ["b", false, true, null]]
      - cypher: "MATCH (n:CyTemporal {d: date('2024-01-01')}) RETURN n.id"
        rows: ["a"]
      - cypher: "MATCH (n:CyTemporal {d: '2024-01-01'}) RETURN n.id"
        rows: ["b"]
      - cypher: "MATCH (n:CyTemporal) WHERE n.d = $d RETURN n.id"
        parameters: {d: "2024-01-01"}
        rows: ["b"]

  - name: "Durations of one length"
    description: "Two durations are equal only where their months, days and seconds are, and are in no order, as Neo4j has them: P1D is not PT24H. Memgraph compares durations as one length."
    steps:
      - cypher: "RETURN [duration('P1D') = duration('PT24H'), duration('P1D') < duration('PT25H'), duration('P1D') = duration('P1D'), duration('P1W') = duration('P7D')]"
        only: [neo4j, sql]
        rows: [[false, null, true, true]]
      - cypher: "CREATE (:CyTemporal {id: 'a', d: duration('P1D')}), (:CyTemporal {id: 'b', d: duration('PT24H')})"
        only: [neo4j, sql]
      - cypher: "MATCH (a:CyTemporal {id: 'a'}), (b:CyTemporal {id: 'b'}) RETURN [a.d = b.d, a.d < b.d, a.d = duration('P1D')]"
        only: [neo4j, sql]
        rows: [[false, null, true]]
      - note: "Memgraph, probed (3.14): durations of one length are equal, and ordered."
        cypher: "RETURN [duration('P1D') = duration('PT24H'), duration('P1D') < duration('PT25H')]"
        only: [memgraph]
        rows: [[true, true]]

  - name: "A named zone beside its offset"
    description: "A moment in a named zone is a value apart from the same moment at its offset, as Neo4j has it. The SQL stores hold no named zone (see README.md, Values in the store)."
    steps:
      - cypher: "RETURN datetime('2024-01-01T10:00:00+01:00[Europe/Paris]') = datetime('2024-01-01T10:00:00+01:00')"
        only: [neo4j, memgraph]
        rows: [false]

  - name: "UTC written as Z and as +00:00"
    description: "A moment at UTC is one value however its offset is written, Z or +00:00, as Neo4j has it: its canonical text writes Z. Memgraph reads Z as the named zone Etc/UTC, a value apart."
    steps:
      - cypher: "RETURN [datetime('2024-01-01T08:00:00Z') = datetime('2024-01-01T08:00:00+00:00'), toString(datetime('2024-01-01T08:00:00+00:00'))]"
        only: [neo4j, sql]
        rows: [[true, "2024-01-01T08:00:00Z"]]
      - note: "Memgraph, probed (3.14)."
        cypher: "RETURN datetime('2024-01-01T08:00:00Z') = datetime('2024-01-01T08:00:00+00:00')"
        only: [memgraph]
        rows: [false]

  - name: "The extremes of a year, an offset and a fraction"
    description: "A year from -999,999,999 to +999,999,999, an offset of ±18:00 and nine digits of a second's fraction are held, read back, compared and ordered, as Neo4j holds them (#161). Memgraph holds years 0000 to 9999 and microseconds alone."
    steps:
      - cypher: "RETURN [toString(date('+999999999-12-31')), toString(date('-999999999-01-01')), date('+999999999-12-31').year, date('-999999999-01-01') < date('-0001-12-31')]"
        only: [neo4j, sql]
        rows: [["+999999999-12-31", "-999999999-01-01", 999999999, true]]
      - cypher: "CREATE (:CyTemporal {id: 'max', at: datetime('+999999999-12-31T23:59:59.999999999-18:00'), d: date('+999999999-12-31')}), (:CyTemporal {id: 'min', at: datetime('-999999999-01-01T00:00:00+18:00'), d: date('-999999999-01-01')}), (:CyTemporal {id: 'now', at: datetime('2024-01-01T00:00:00Z'), d: date('2024-01-01')})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal) RETURN [n.id, n.at.year, n.at.nanosecond, n.at.offsetSeconds, n.d.year] ORDER BY n.at"
        only: [neo4j, sql]
        note: "The fields of a moment are read off its text: no store's timestamp reaches these years."
        rows: [["min", -999999999, 0, 64800, -999999999], ["now", 2024, 0, 0, 2024], ["max", 999999999, 999999999, -64800, 999999999]]
      - cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY n.d DESC"
        only: [neo4j, sql]
        rows: ["max", "now", "min"]
      - cypher: "MATCH (n:CyTemporal {at: datetime('+999999999-12-31T23:59:59.999999999-18:00')}) RETURN n.id"
        only: [neo4j, sql]
        rows: ["max"]

  - name: "Nanoseconds kept"
    description: "A moment written with nine digits of a second's fraction keeps them, read back, compared and ordered, as Neo4j keeps them (#161). Memgraph keeps microseconds."
    steps:
      - cypher: "RETURN [datetime('2024-01-01T00:00:00.123456789Z') = datetime('2024-01-01T00:00:00.123456788Z'), datetime('2024-01-01T00:00:00.123456789Z') > datetime('2024-01-01T00:00:00.123456788Z'), datetime('2024-01-01T00:00:00.123456789Z').nanosecond]"
        only: [neo4j, sql]
        rows: [[false, true, 123456789]]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime('2024-01-01T00:00:00.123456789Z'), t: localtime('10:00:00.000000001')}), (:CyTemporal {id: 'b', at: datetime('2024-01-01T00:00:00.123456788Z'), t: localtime('10:00:00')})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal) RETURN [n.id, n.at.nanosecond, n.t.nanosecond] ORDER BY n.at"
        only: [neo4j, sql]
        rows: [["b", 123456788, 0], ["a", 123456789, 1]]
      - cypher: "MATCH (n:CyTemporal) RETURN n.id ORDER BY n.t DESC"
        only: [neo4j, sql]
        rows: ["a", "b"]

  - name: "A sort key worked out as the statement runs"
    description: "A temporal value the statement works out, of its fields or by arithmetic, is held as the one written as text is, its sort key worked out of its text as Temporals.key works it out (see host.yaml, Temporal values' sort keys): so the two are equal, one under DISTINCT, and found by each other in the store, across a day and a year in UTC and at the offsets' limits."
    steps:
      - cypher: |
          RETURN [datetime({year: 2024, month: 1, day: 1, hour: 1, timezone: '+02:00'}) = datetime('2024-01-01T01:00:00+02:00'),
                  [datetime({year: 2024, month: 3, day: 1, hour: 0, minute: 30, timezone: '+01:00'})] = [datetime('2024-03-01T00:30:00+01:00')],
                  [datetime({year: 2024, month: 12, day: 31, hour: 23, timezone: '-02:00'})] = [datetime('2024-12-31T23:00:00-02:00')],
                  [time({hour: 1, timezone: '+02:00'})] = [time('01:00:00+02:00')],
                  [time({hour: 0, timezone: '+18:00'})] = [time('00:00:00+18:00')],
                  [time({hour: 23, minute: 59, second: 59, timezone: '-18:00'})] = [time('23:59:59-18:00')],
                  [localdatetime({year: 2024, month: 3, day: 15, hour: 10, minute: 30, second: 0, millisecond: 500})] = [localdatetime('2024-03-15T10:30:00.500')],
                  [date({year: -44, month: 3, day: 15})] = [date('-0044-03-15')],
                  [date('2024-02-28') + duration('P1D')] = [date('2024-02-29')]]
        only: [neo4j, sql]
        rows: [[true, true, true, true, true, true, true, true, true]]
      - cypher: "UNWIND [datetime({year: 2024, month: 1, day: 1, hour: 1, timezone: '+02:00'}), datetime('2024-01-01T01:00:00+02:00'), datetime('2023-12-31T23:00:00Z') + duration('PT2H')] AS x RETURN count(DISTINCT x)"
        only: [neo4j, sql]
        rows: [2]
      - cypher: "CREATE (:CyTemporal {id: 'a', at: datetime({year: 2024, month: 1, day: 1, hour: 1, timezone: '+02:00'}), t: time({hour: 0, timezone: '+18:00'})})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal {at: datetime('2024-01-01T01:00:00+02:00'), t: time('00:00:00+18:00')}) RETURN n.id"
        only: [neo4j, sql]
        rows: ["a"]
      - cypher: "MATCH (n:CyTemporal) WHERE n.at = datetime({year: 2023, month: 12, day: 31, hour: 23, timezone: 'Z'}) + duration('PT1H') - duration('PT1H') RETURN n.id"
        only: [neo4j, sql]
        note: "Another moment: the same instant at UTC."
        rows: []

  - name: "Values worked out beside values stored, compared whole"
    description: "A temporal value the statement works out as it runs is whole wherever it leaves the expression it is made in (#161): under DISTINCT, IN, a grouping, UNION, a list's = and a collect() compared with a list stored, it is the value stored, its sort key and all; inside the expression, a sum of sums, a field and a comparison read it as it is made."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', d: date('2024-03-14'), next: date('2024-03-15'), list: [date('2024-03-15')], at: datetime('2024-01-01T10:00:00+02:00')}), (:CyTemporal {id: 'b', d: date('2024-03-15'), next: date('2024-03-16'), list: [date('2024-03-16')], at: datetime('2024-01-01T08:00:00Z')})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal) UNWIND [n.next, n.d + duration('P1D')] AS x RETURN count(DISTINCT x)"
        only: [neo4j, sql]
        rows: [2]
      - cypher: "MATCH (n:CyTemporal) RETURN [n.id, n.d + duration('P1D') IN [n.next], n.next IN [n.d + duration('P1D')], n.d + duration('P1D') IN n.list, n.d IN [n.next - duration('P1D')]] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", true, true, true, true], ["b", true, true, true, true]]
      - cypher: "MATCH (n:CyTemporal) UNWIND [n.next, n.d + duration('P1D')] AS x RETURN toString(x), count(*) ORDER BY toString(x)"
        only: [neo4j, sql]
        rows: [["2024-03-15", 2], ["2024-03-16", 2]]
      - note: "Unwound and then sorted or compared, an item worked out is ordered by its key, as one stored is."
        cypher: "MATCH (n:CyTemporal) UNWIND [n.next, n.d + duration('P1D')] AS x RETURN toString(x) ORDER BY x"
        only: [neo4j, sql]
        rows: ["2024-03-15", "2024-03-15", "2024-03-16", "2024-03-16"]
      - cypher: "MATCH (n:CyTemporal) UNWIND [n.next, n.d + duration('P1D')] AS x WITH x WHERE x > date('2024-03-15') RETURN count(x)"
        only: [neo4j, sql]
        rows: [2]
      - note: "Unwound and then grouped by, or stored and found by the value stored, an item worked out is the value stored."
        cypher: "MATCH (n:CyTemporal) UNWIND [n.next, n.d + duration('P1D')] AS x WITH x, count(*) AS c RETURN [toString(x), c] ORDER BY toString(x)"
        only: [neo4j, sql]
        rows: [["2024-03-15", 2], ["2024-03-16", 2]]
      - cypher: "MATCH (n:CyTemporal) UNWIND [n.d + duration('P1D')] AS x SET n.unwound = x RETURN [n.id, n.unwound = n.next] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", true], ["b", true]]
      - cypher: "MATCH (n:CyTemporal) MATCH (m:CyTemporal {unwound: n.next}) RETURN [n.id, m.id] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", "a"], ["b", "b"]]
      - cypher: "MATCH (n:CyTemporal) WITH n.id AS id, n.list AS l, [n.d + duration('P1D')] AS w, collect(n.d + duration('P1D')) AS c RETURN [id, w = l, c = l] ORDER BY id"
        only: [neo4j, sql]
        rows: [["a", true, true], ["b", true, true]]
      - cypher: "CALL { MATCH (n:CyTemporal) RETURN n.next AS x UNION MATCH (n:CyTemporal) RETURN n.d + duration('P1D') AS x } RETURN count(x)"
        only: [neo4j, sql]
        rows: [2]
      - note: "Zoned: at one instant and two offsets, a moment worked out is the one stored at its own offset only."
        cypher: "MATCH (n:CyTemporal) RETURN count(DISTINCT n.at - duration('PT1H') + duration('PT1H'))"
        only: [neo4j, sql]
        rows: [2]
      - cypher: "MATCH (n:CyTemporal) UNWIND [n.at, n.at + duration('PT0S')] AS x RETURN count(DISTINCT x)"
        only: [neo4j, sql]
        rows: [2]
      - cypher: "MATCH (n:CyTemporal) RETURN [n.id, (n.d + duration('P1D') + duration('P1D')).day, n.d + duration('P1D') < n.next + duration('P1D'), n.at + duration('PT1H') > n.at] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", 16, true, true], ["b", 17, true, true]]
      - cypher: "MATCH (n:CyTemporal) SET n.copy = n.d + duration('P1D') RETURN [n.id, n.copy = n.next, [n.copy] = n.list] ORDER BY n.id"
        only: [neo4j, sql]
        rows: [["a", true, true], ["b", true, true]]
      - cypher: "MATCH (n:CyTemporal) WITH n.d + duration('P1D') AS x MATCH (m:CyTemporal {next: x}) RETURN m.id ORDER BY m.id"
        only: [neo4j, sql]
        rows: ["a", "b"]

  - name: "Two sums of values stored, one worked out of the other"
    description: "A value read from the store, a duration added in a CALL and again outside it, and a list a moment and then a duration are added to: Oracle without the store's functions planned each for minutes when every sum held its own sort key (#161). Each sum's key is worked out once, where the value leaves the expression."
    steps:
      - cypher: "CREATE (:CyTemporal {id: 'a', day: date('2024-03-15')})"
        only: [neo4j, sql]
      - cypher: "MATCH (n:CyTemporal) CALL { WITH n CALL { WITH n RETURN n.day + duration('P1D') AS e } RETURN e AS d } RETURN [(d + duration('P1D')).day, d + duration('P1D') > d]"
        only: [neo4j, sql]
        rows: [[17, true]]
      - cypher: "WITH ['x'] AS list RETURN size((list + datetime('2024-03-15T10:00:00Z')) + duration('P1D'))"
        only: [neo4j, sql]
        rows: [3]

  - name: "Random temporal values in Neo4j's order"
