# nightly-latest.yml runs these jobs each night on the latest engine images: keep it in step.
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # release.yml runs this as its gate, on the tag it releases.
  workflow_call:

jobs:
  # The Cypher spec's copies are the tag VERSION names, unchanged, and a later tag is shown as a warning.
  cypher-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the Cypher spec
        run: scripts/check-cypher-spec.sh

  # The version script's tests, which also check that its list of the files naming the version (the sample's model
  # file and the README's install snippets) matches them, so a snippet added or reworded fails here and not in the
  # next Prepare release.
  release-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the version script
        run: python3 scripts/test_release_version.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        collection-sort-strategy: [ APOC_SORT_MAPS, CALL_SUBQUERY ]
      fail-fast: false

    name: test (${{ matrix.collection-sort-strategy }})

    # The Postgres tests run by default. They do not read the sort strategy, so one leg runs them
    # and the other turns them off, and they run once.
    env:
      POSTGRES_TESTS: ${{ matrix.collection-sort-strategy == 'APOC_SORT_MAPS' && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Docker 29+ raised minimum API version to 1.44; Testcontainers 1.x defaults to 1.32
      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      # Pulled here and not by the first test that asks for it, so the time the image takes is not
      # counted against the container's start. The image is the one PostgresTestContainer names.
      - name: Pull the Postgres image
        if: env.POSTGRES_TESTS == 'true'
        run: docker pull pgvector/pgvector:pg17

      # Compiles and assembles every module. The tests run once, in the step that follows.
      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      # The build writes each module's model file, .drivine/model.json, and the one committed must be it.
      - name: Check the model files are current
        run: |
          if [ -n "$(git status --porcelain -- ':(glob)**/.drivine/model.json')" ]; then
            echo "A model file differs from what the build writes. Build, and commit .drivine/model.json."
            git status --short -- ':(glob)**/.drivine/model.json'
            git diff -- ':(glob)**/.drivine/model.json'
            exit 1
          fi

      # standaloneTest runs the core on its own runtime classpath, as a plain main or a Ktor server has it.
      - name: Run tests
        run: ./gradlew test standaloneTest --no-daemon
        env:
          DATABASE_DATASOURCES_NEO_COLLECTION_SORT_STRATEGY: ${{ matrix.collection-sort-strategy }}

      # Debug: Check what test files exist
      - name: List test result files
        if: success() || failure()
        run: |
          echo "=== Looking for test result files ==="
          find . -name "TEST-*.xml" -type f 2>/dev/null || echo "No TEST-*.xml files found"
          echo "=== Test result directories ==="
          find . -type d -name "test-results" 2>/dev/null || echo "No test-results directories found"

      # Enhanced Test Reporting - Makes test results easy to read!
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: success() || failure()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            build/test-results/standaloneTest/*.xml
          detailed_summary: true
          include_passed: true
          check_name: Test Results (${{ matrix.collection-sort-strategy }})
          require_tests: false
          annotate_only: false
          fail_on_failure: false

      # Alternative: Publish test results as artifacts
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.collection-sort-strategy }}
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/
          retention-days: 30

      # Upload HTML test report for easy browsing
      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-html-${{ matrix.collection-sort-strategy }}
          path: '**/build/reports/tests/test/'
          retention-days: 30

      # Code coverage (optional but recommended)
      # The sort strategy is an input of the tests: without it here the report's tests are not up to
      # date, and the whole suite runs a second time.
      - name: Generate Coverage Report
        run: ./gradlew jacocoTestReport --no-daemon
        if: success()
        continue-on-error: true
        env:
          DATABASE_DATASOURCES_NEO_COLLECTION_SORT_STRATEGY: ${{ matrix.collection-sort-strategy }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report-${{ matrix.collection-sort-strategy }}
          path: '**/build/reports/jacoco/test/'
          retention-days: 30
        continue-on-error: true

  test-falkordb:
    runs-on: ubuntu-latest
    name: test (FalkorDB)

    # The Postgres tests run in the matrix job above: not again here.
    env:
      POSTGRES_TESTS: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Configure sample module for FalkorDB
        run: |
          cat > drivine4j-sample/src/test/resources/application.yaml << 'EOF'
          spring:
            profiles:
              active: test
            main:
              banner-mode: off
          logging:
            level:
              org.drivine: DEBUG
          database:
            datasources:
              graph:
                type: FALKORDB
                host: localhost
                port: 6379
                database-name: testgraph
          EOF

      # Compiles and assembles every module. The tests run once, in the step that follows.
      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      - name: Run all tests
        run: ./gradlew test --no-daemon

      # The root module's Spring tests read the datasource 'neo', which the step above leaves on
      # Neo4j: only the sample module's file is rewritten. The environment overrides that datasource,
      # as it does the sort strategy in the matrix job. The classes
      # named are those that do not rely on a rolled-back transaction to clean up after themselves,
      # which FalkorDB does not have.
      - name: Run the root module's stateless Spring tests on FalkorDB
        run: |
          # This run replaces the root module's results: keep those of the run above for the report.
          mkdir -p build/test-results-default && cp -r build/test-results/test/. build/test-results-default/
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.manager.StatelessTransactionTests' \
            --tests 'org.drivine.manager.UndeclaredReadOnlyFieldSaveTest' \
            --tests 'sample.JavaStatelessSaveTests'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: FALKORDB
          DATABASE_DATASOURCES_NEO_PORT: 6379
          DATABASE_DATASOURCES_NEO_DATABASE_NAME: testgraph

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: success() || failure()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            build/test-results-default/*.xml
          detailed_summary: true
          include_passed: true
          check_name: Test Results (FalkorDB)
          require_tests: false
          annotate_only: false
          fail_on_failure: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-FALKORDB
          path: |
            **/build/test-results/test/
            build/test-results-default/
            **/build/reports/tests/test/
          retention-days: 30

  test-memgraph:
    runs-on: ubuntu-latest
    name: test (Memgraph)

    # The Postgres tests run in the matrix job above: not again here.
    env:
      POSTGRES_TESTS: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Configure sample module for Memgraph
        run: |
          cat > drivine4j-sample/src/test/resources/application.yaml << 'EOF'
          spring:
            profiles:
              active: test
            main:
              banner-mode: off
          logging:
            level:
              org.drivine: DEBUG
          database:
            datasources:
              graph:
                type: MEMGRAPH
                host: localhost
                port: 7687
                user-name: ""
                password: ""
          EOF

      # Compiles and assembles every module. The tests run once, in the step that follows.
      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      - name: Run all tests
        run: ./gradlew test --no-daemon

      # The root module's Spring tests read the datasource 'neo', which the step above leaves on
      # Neo4j: only the sample module's file is rewritten. The environment overrides that datasource,
      # as it does the sort strategy in the matrix job. The classes
      # named are those Memgraph can run: the rest use DELETE_ORPHAN or sort a collection in a way it
      # does not support.
      - name: Run the root module's stateless Spring tests on Memgraph
        run: |
          # This run replaces the root module's results: keep those of the run above for the report.
          mkdir -p build/test-results-default && cp -r build/test-results/test/. build/test-results-default/
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.annotation.StatelessSortedByTests' \
            --tests 'org.drivine.manager.StatelessCountTests' \
            --tests 'org.drivine.manager.StatelessDefaultAnnotationE2ETest' \
            --tests 'org.drivine.manager.StatelessDeleteTests' \
            --tests 'org.drivine.manager.StatelessFragmentLoadingTests' \
            --tests 'org.drivine.manager.StatelessFragmentSaveTests' \
            --tests 'org.drivine.manager.StatelessGraphObjectManagerSubtypeTests' \
            --tests 'org.drivine.manager.StatelessGraphViewSaveTests' \
            --tests 'org.drivine.manager.StatelessTemporalE2ETest' \
            --tests 'org.drivine.manager.StatelessTransactionTests' \
            --tests 'org.drivine.manager.UndeclaredReadOnlyFieldSaveTest' \
            --tests 'org.drivine.model.StatelessGraphRelationshipFragmentEndToEndTests' \
            --tests 'org.drivine.model.StatelessInterfaceNodeFragmentTests' \
            --tests 'org.drivine.query.StatelessGraphPathE2ETest' \
            --tests 'org.drivine.query.StatelessRecursiveGraphViewEndToEndTests' \
            --tests 'sample.JavaStatelessSaveTests' \
            --tests 'sample.StatelessJavaGraphObjectManagerSubtypeTests'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: MEMGRAPH
          DATABASE_DATASOURCES_NEO_USER_NAME: ""
          DATABASE_DATASOURCES_NEO_PASSWORD: ""
          DATABASE_DATASOURCES_NEO_DATABASE_NAME: memgraph

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: success() || failure()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            build/test-results-default/*.xml
          detailed_summary: true
          include_passed: true
          check_name: Test Results (Memgraph)
          require_tests: false
          annotate_only: false
          fail_on_failure: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-MEMGRAPH
          path: |
            **/build/test-results/test/
            build/test-results-default/
            **/build/reports/tests/test/
          retention-days: 30

  # The Oracle tests are left out of a plain `./gradlew test`, which is what the jobs above run: they
  # are enabled by ORACLE_TESTS. This job runs them, then the sample app's and the root module's Spring
  # tests on an Oracle datasource, as the Postgres job does: a graph engine's job proves nothing of the
  # SQL Drivine writes for Oracle.
  test-oracle:
    runs-on: ubuntu-latest
    name: test (Oracle)
    timeout-minutes: 75

    # The Postgres tests run in the matrix job: not again here.
    env:
      POSTGRES_TESTS: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      # Pulled here and not by the first test that asks for it, so the time the image takes is not
      # counted against the container's start. The image is the one OracleTestContainer names.
      - name: Pull the Oracle image
        run: docker pull gvenzl/oracle-free:23-faststart

      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      - name: Run the Oracle tests
        run: ./gradlew :test --no-daemon --tests '*Oracle*'
        env:
          ORACLE_TESTS: true

      - name: Run the coroutines module's Oracle tests
        run: ./gradlew :drivine4j-coroutines:test --no-daemon --tests '*Oracle*'
        env:
          ORACLE_TESTS: true

      # The sample app's stateless tests, on an Oracle datasource. Its tests seed in Cypher, which the
      # compiler makes SQL of over the graph's tables (SqlCypherFixtures.forStore).
      - name: Run the sample app's stateless tests on Oracle
        run: |
          ./gradlew :drivine4j-sample:test --no-daemon \
            --tests '*Stateless*' \
            --tests 'org.drivine.sample.StampFilterDslTest' \
            --tests 'org.drivine.sample.OddStoredNameDslTest'
        env:
          DATABASE_DATASOURCES_GRAPH_TYPE: ORACLE

      # The root module's Spring tests read the datasource 'neo', which the environment points at Oracle.
      - name: Run the root module's stateless Spring tests on Oracle
        run: |
          # Each run replaces the root module's results: keep those of the run before for the report.
          mkdir -p build/test-results-default && cp -r build/test-results/test/. build/test-results-default/
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.annotation.StatelessSortedByTests' \
            --tests 'org.drivine.manager.StatelessCountTests' \
            --tests 'org.drivine.manager.StatelessDefaultAnnotationE2ETest' \
            --tests 'org.drivine.manager.StatelessDeleteTests' \
            --tests 'org.drivine.manager.StatelessFragmentLoadingTests' \
            --tests 'org.drivine.manager.StatelessFragmentSaveTests' \
            --tests 'org.drivine.manager.StatelessGraphObjectManagerSubtypeTests' \
            --tests 'org.drivine.manager.StatelessGraphViewSaveTests' \
            --tests 'org.drivine.manager.StatelessTemporalE2ETest' \
            --tests 'org.drivine.manager.StatelessTransactionTests' \
            --tests 'org.drivine.manager.UndeclaredReadOnlyFieldSaveTest' \
            --tests 'org.drivine.model.StatelessGraphRelationshipFragmentEndToEndTests' \
            --tests 'org.drivine.model.StatelessInterfaceNodeFragmentTests' \
            --tests 'org.drivine.query.StatelessGraphPathE2ETest' \
            --tests 'org.drivine.query.StatelessRecursiveGraphViewEndToEndTests' \
            --tests 'sample.JavaStatelessSaveTests' \
            --tests 'sample.StatelessJavaGraphObjectManagerSubtypeTests'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: ORACLE

      # The tests that seed, write and read back in Cypher through a PersistenceManager, the Cypher compiled.
      - name: Run the PersistenceManager tests on Oracle
        run: |
          mkdir -p build/test-results-spring && cp -r build/test-results/test/. build/test-results-spring/
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.manager.PersistenceManagerTests' \
            --tests 'org.drivine.manager.QueryBatchInTransactionTests' \
            --tests 'org.drivine.manager.RowMapperTests' \
            --tests 'org.drivine.manager.ScalarResultTests' \
            --tests 'org.drivine.manager.FilterIsInstanceTests' \
            --tests 'org.drivine.mapper.EnumTransformTests' \
            --tests 'org.drivine.query.BindConversionTests' \
            --tests 'org.drivine.transaction.TransactionRollbackTests' \
            --tests 'sample.simple.EventRepositoryTests' \
            --tests 'sample.simple.HolidayRepositoryTests' \
            --tests 'sample.simple.HolidayingPersonTests' \
            --tests 'sample.simple.PersonRepositoryTests' \
            --tests 'sample.simple.PolymorphicTests' \
            --tests 'org.drivine.manager.NonTransactionalBatchTest' \
            --tests 'org.drivine.manager.BatchCommitFailureTest' \
            --tests 'org.drivine.manager.NonAtomicBatchesTest'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: ORACLE

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: success() || failure()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            build/test-results-default/*.xml
            build/test-results-spring/*.xml
          detailed_summary: true
          include_passed: true
          check_name: Test Results (Oracle)
          require_tests: true
          annotate_only: false
          fail_on_failure: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ORACLE
          path: |
            **/build/test-results/test/
            build/test-results-default/
            build/test-results-spring/
            **/build/reports/tests/test/
          retention-days: 30

  # The Postgres tests run in a plain `./gradlew test`, so the matrix job runs them. This job runs the
  # sample app's and the root module's Spring tests on a Postgres datasource, which no other job does:
  # neither a graph engine's job nor Oracle's proves anything of the SQL Drivine writes for Postgres.
  test-postgres:
    runs-on: ubuntu-latest
    name: test (Postgres)
    timeout-minutes: 45

    # The Postgres tests ran in the matrix job. Each run here names its classes, and this keeps them
    # out should one name none.
    env:
      POSTGRES_TESTS: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Testcontainers for Docker 29+
        run: echo "api.version=1.44" > ~/.docker-java.properties

      # Pulled here and not by the first test that asks for it, so the time the image takes is not
      # counted against the container's start. The image is the one PostgresTestContainer names.
      - name: Pull the Postgres image
        run: docker pull pgvector/pgvector:pg17

      - name: Build with Gradle
        run: ./gradlew build -x test -x standaloneTest --no-daemon

      # The sample app's stateless tests, on a Postgres datasource. Its tests seed in Cypher, which the
      # compiler makes SQL of over the graph's tables (SqlCypherFixtures.forStore). The tests of
      # the deprecated GraphObjectManager are left out: its save is Cypher alone.
      - name: Run the sample app's stateless tests on Postgres
        run: |
          ./gradlew :drivine4j-sample:test --no-daemon \
            --tests '*Stateless*' \
            --tests 'org.drivine.sample.StampFilterDslTest' \
            --tests 'org.drivine.sample.OddStoredNameDslTest'
        env:
          DATABASE_DATASOURCES_GRAPH_TYPE: POSTGRES

      # The root module's Spring tests read the datasource 'neo', which the environment points at
      # Postgres, as the FalkorDB and Memgraph jobs point it at theirs. The classes are those Memgraph
      # runs: the stateless manager's Spring tests.
      - name: Run the root module's stateless Spring tests on Postgres
        run: |
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.annotation.StatelessSortedByTests' \
            --tests 'org.drivine.manager.StatelessCountTests' \
            --tests 'org.drivine.manager.StatelessDefaultAnnotationE2ETest' \
            --tests 'org.drivine.manager.StatelessDeleteTests' \
            --tests 'org.drivine.manager.StatelessFragmentLoadingTests' \
            --tests 'org.drivine.manager.StatelessFragmentSaveTests' \
            --tests 'org.drivine.manager.StatelessGraphObjectManagerSubtypeTests' \
            --tests 'org.drivine.manager.StatelessGraphViewSaveTests' \
            --tests 'org.drivine.manager.StatelessTemporalE2ETest' \
            --tests 'org.drivine.manager.StatelessTransactionTests' \
            --tests 'org.drivine.manager.UndeclaredReadOnlyFieldSaveTest' \
            --tests 'org.drivine.model.StatelessGraphRelationshipFragmentEndToEndTests' \
            --tests 'org.drivine.model.StatelessInterfaceNodeFragmentTests' \
            --tests 'org.drivine.query.StatelessGraphPathE2ETest' \
            --tests 'org.drivine.query.StatelessRecursiveGraphViewEndToEndTests' \
            --tests 'sample.JavaStatelessSaveTests' \
            --tests 'sample.StatelessJavaGraphObjectManagerSubtypeTests'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: POSTGRES

      # The tests that seed, write and read back in Cypher through a PersistenceManager, the Cypher compiled.
      - name: Run the PersistenceManager tests on Postgres
        run: |
          mkdir -p build/test-results-spring && cp -r build/test-results/test/. build/test-results-spring/
          ./gradlew :test --no-daemon \
            --tests 'org.drivine.manager.PersistenceManagerTests' \
            --tests 'org.drivine.manager.QueryBatchInTransactionTests' \
            --tests 'org.drivine.manager.RowMapperTests' \
            --tests 'org.drivine.manager.ScalarResultTests' \
            --tests 'org.drivine.manager.FilterIsInstanceTests' \
            --tests 'org.drivine.mapper.EnumTransformTests' \
            --tests 'org.drivine.query.BindConversionTests' \
            --tests 'org.drivine.transaction.TransactionRollbackTests' \
            --tests 'sample.simple.EventRepositoryTests' \
            --tests 'sample.simple.HolidayRepositoryTests' \
            --tests 'sample.simple.HolidayingPersonTests' \
            --tests 'sample.simple.PersonRepositoryTests' \
            --tests 'sample.simple.PolymorphicTests' \
            --tests 'org.drivine.manager.NonTransactionalBatchTest' \
            --tests 'org.drivine.manager.BatchCommitFailureTest' \
            --tests 'org.drivine.manager.NonAtomicBatchesTest'
        env:
          DATABASE_DATASOURCES_NEO_TYPE: POSTGRES

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        # A job's reports, passed tests included, outgrow Node's default heap; Oracle's ran it out twice.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: success() || failure()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            build/test-results-spring/*.xml
          detailed_summary: true
          include_passed: true
          check_name: Test Results (Postgres)
          require_tests: true
          annotate_only: false
          fail_on_failure: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-POSTGRES
          path: |
            **/build/test-results/test/
            build/test-results-spring/
            **/build/reports/tests/test/
          retention-days: 30
