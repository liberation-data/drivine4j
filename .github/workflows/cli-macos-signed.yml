# Builds the drivine CLI as a native binary on macOS with GraalVM, exactly as cli-native.yml builds it on linux, then
# signs it with a Developer ID Application certificate and notarizes it with Apple's notarytool, and uploads the
# signed, notarized binary as an artifact. This is how a macOS user's download is trusted by Gatekeeper.
#
# arm64 (Apple silicon) only: GraalVM Community 25 ships macOS on aarch64 alone (it dropped the Intel image with 25),
# and Intel Macs are effectively end-of-life, so the CLI is built and shipped for Apple silicon only. If an Intel
# build is ever needed it would take a separate toolchain (GraalVM 24.0.2 or Liberica NIK) on macos-15-intel.
#
# This workflow needs eight secrets from the `apple-signing` environment (listed under the signing step's env). A
# workflow that calls it must pass `secrets: inherit`, or the job sees the environment but every secret reads empty
# (#885). If any is missing, the first step fails in seconds and names it.
#
# Kept apart from cli-native.yml on purpose: that workflow is permissions: contents: read with no secrets, so fork
# pull requests can run it safely. Signing needs secrets, so it runs only on triggers under this repo's control
# (by hand, from release.yml, or on a published release), never on a fork pull request.
name: CLI macOS signed

on:
  # By hand: builds, signs and notarizes, and keeps the zip as the run's artifact. Nothing is attached to a release.
  workflow_dispatch:
  # From release.yml, after it creates the GitHub release: signs the release's commit and attaches the zip to it.
  # release.yml makes its releases with GITHUB_TOKEN, and GitHub starts no workflow for an event that token caused,
  # so the release trigger below would never fire for them; release.yml calls this workflow instead.
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to attach the signed zip to.
        required: true
        type: string
  # A release published by a person, in the web UI or with gh, does fire this, and gets the zip attached the same way.
  release:
    types: [published]

# Read-only by default. Only the attach job below, which runs no build code and sees no Apple secret, may write to
# the repo, and only to upload the release asset.
permissions:
  contents: read

jobs:
  build-sign:
    name: build, sign and notarize (macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 60
    # The eight Apple secrets live in the `apple-signing` environment, whose deployment branches are limited to main
    # and v* tags. A consequence of that branch limit: a workflow_dispatch run on a feature branch can't reach the
    # secrets, so the first signed run is from main (or a tag) after this merges.
    environment: apple-signing
    # One signing run per release tag (or per ref, by hand). A newer manual run replaces an older one, but a release
    # run is never cancelled: a second event must not kill a notarization in flight and leave the release unsigned.
    concurrency:
      group: cli-macos-signed-${{ inputs.tag || github.event.release.tag_name || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # Fail in seconds, not after the half-hour native build, when the job can't see the secrets: unset in the
      # environment, or a caller that didn't pass them on (#885). Names only; no value is printed.
      - name: Check the signing secrets are present
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
            APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID KEYCHAIN_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The signing job can't see ${missing[*]}. Set them in the apple-signing environment; a workflow calling this one must pass secrets: inherit."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The same toolchain as cli-native.yml: JDK 21 (temurin) compiles the module as the toolchain asks, named in
      # JAVA_HOME_21_ARM64 for the build (the macos-15 runner is Apple silicon), and GraalVM takes JAVA_HOME and
      # builds the image from the JDK 21 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm-community
          java-version: '25.0.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The Cypher compiler gradle/cypher-compiler.properties pins, as cli-native.yml has it.
      - name: Cache the pinned Cypher compiler
        uses: actions/cache@v4
        with:
          path: .compiler-repo
          key: cypher-compiler-${{ hashFiles('gradle/cypher-compiler.properties') }}
      - name: Publish the pinned Cypher compiler
        run: scripts/compiler-local.sh

      - name: Build the native binary
        run: ./gradlew --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_ARM64 :drivine4j-cli:nativeCompile

      - name: Record the binary's size and start
        run: |
          binary=drivine4j-cli/build/native/nativeCompile/drivine
          bytes=$(stat -f %z "$binary")
          "$binary" --version
          {
            echo "### drivine, native, macOS arm64"
            echo
            echo "- Size: $bytes bytes ($(du -h "$binary" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sign with Developer ID + hardened runtime + timestamp, then notarize with notarytool --wait. The binary is
      # built in this job, so it keeps its exec bit and is signed in place — no artifact round-trip. The eight secrets
      # are passed through env; the action reads them from env and never from inputs, so none is interpolated into a
      # shell command line.
      - name: Sign and notarize
        uses: ./.github/actions/sign-notarize-macos
        with:
          binary-path: drivine4j-cli/build/native/nativeCompile/drivine
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      # Zip the signed binary for the artifact (an artifact keeps no file mode, and the binary is a lone executable),
      # so the download is the signed, notarized arm64 drivine.
      - name: Package the signed binary
        run: |
          ditto -c -k --keepParent drivine4j-cli/build/native/nativeCompile/drivine "$RUNNER_TEMP/drivine-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: drivine-macos-arm64-signed
          path: ${{ runner.temp }}/drivine-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Attach the signed zip to the release. A job of its own, so the token that may write to the repo never shares a job
  # with the Gradle and GraalVM build or with the Apple secrets. Skipped on a by-hand run, which has no tag.
  attach:
    name: attach to the release
    needs: build-sign
    if: ${{ (inputs.tag || github.event.release.tag_name) != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drivine-macos-arm64-signed
      # --clobber, so re-running a failed release run replaces the asset rather than failing on it.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" drivine-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber
