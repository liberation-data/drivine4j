# The schema plan: what a schema manager runs on each store, round by round, for an enforce, a recreate, an ensure, a
# remove or one of the public IndexManager and ConstraintManager calls, the answers the store gives, and what it reports. drivine4j's decisions, the reference, captured from its
# SchemaManager, IndexManager and ConstraintManager over a scripted store, with no store; each statement named as
# store.yaml and marker.yaml pin it. Case 30, the form check, and case 31, the safe recreate of a uniqueness constraint, are
# the module's own, their listings and errors answered with what each store gave, captured. Read with no store. See README.md, "The schema plan".

graph: "drivine"
database: "default"
cases:
  - case: "1"
    name: "A first run"
    description: "A versioned owner on an empty store: the marker kept single, its constraint made, each item made, and the marker written with the version and the inventory."
    stores: ["postgres", "oracle", "sqlite", "neo4j", "memgraph", "falkordb"]
    catalogs:
      - {owner: null, version: "v1", items: ["Range index", "Uniqueness constraint"]}
    steps:
      - operation: {enforce: "all"}
        runs:
          - stores: ["postgres", "oracle", "sqlite"]
            rounds:
              - now: 1000000
                actions:
                  - {execute: {marker: "prepare"}}
                  - {query: {marker: "read.version", scope: "schema"}, rows: []}
                  - {query: {marker: "read.items", scope: "schema"}, rows: []}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
                  - {query: {listing: "constraints"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {marker: "deleteAllButNewest", scope: "schema"}}
                  - {execute: {marker: "constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}]}
              - now: 1000000
                actions:
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {create: "Range index"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}]}
              - now: 1000000
                actions:
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}]}
              - now: 1000000
                actions:
                  - {execute: {create: "Uniqueness constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}, {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}]}
              - now: 1000000
                actions:
                  - {writeMarker: {scope: "schema", version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
            done: 1000000
            report:
              owners:
                - {owner: null, results: [{spec: "Range index", created: {kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}}, {spec: "Uniqueness constraint", created: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}}], marker: {version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
              log:
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on _DrivineSchema[scope]"]
                - ["INFO", "SchemaManager", "Applying schema for owner 'schema' on 'default': 2 items (forceRecreate=false, versionChanged=false, version=v1)"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[name]"]
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on Person[email]"]
                - ["INFO", "SchemaManager", "Schema for owner 'schema' on 'default': 2 created, 0 already matching, 0 recreated, 0 needing attention"]
          - stores: ["neo4j"]
            rounds:
              - now: 1000000
                actions:
                  - {query: {marker: "read.version", scope: "schema"}, rows: []}
                  - {query: {marker: "read.items", scope: "schema"}, rows: []}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
                  - {query: {listing: "constraints"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {marker: "deleteAllButNewest", scope: "schema"}}
                  - {execute: {marker: "constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}]}
              - now: 1000000
                actions:
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {create: "Range index"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}]}
              - now: 1000000
                actions:
                  - {awaitIndex: {name: "Person_name_range", timeout: 60}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}]}
              - now: 1000000
                actions:
                  - {execute: {create: "Uniqueness constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], name: "_DrivineSchema_scope_unique"}, {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}]}
              - now: 1000000
                actions:
                  - {writeMarker: {scope: "schema", version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
            done: 1000000
            report:
              owners:
                - {owner: null, results: [{spec: "Range index", created: {kind: "RANGE_INDEX", label: "Person", properties: ["name"], name: "Person_name_range"}}, {spec: "Uniqueness constraint", created: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"], name: "Person_email_unique"}}], marker: {version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
              log:
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on _DrivineSchema[scope]"]
                - ["INFO", "SchemaManager", "Applying schema for owner 'schema' on 'default': 2 items (forceRecreate=false, versionChanged=false, version=v1)"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[name]"]
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on Person[email]"]
                - ["INFO", "SchemaManager", "Schema for owner 'schema' on 'default': 2 created, 0 already matching, 0 recreated, 0 needing attention"]
          - stores: ["memgraph"]
            rounds:
              - now: 1000000
                actions:
                  - {query: {marker: "read.version", scope: "schema"}, rows: []}
                  - {query: {marker: "read.items", scope: "schema"}, rows: []}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
                  - {query: {listing: "constraints"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {marker: "deleteAllButNewest", scope: "schema"}}
                  - {execute: {marker: "constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"]}]}
              - now: 1000000
                actions:
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {create: "Range index"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "Person", properties: ["name"]}]}
              - now: 1000000
                actions:
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"]}]}
              - now: 1000000
                actions:
                  - {execute: {create: "Uniqueness constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"]}, {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}]}
              - now: 1000000
                actions:
                  - {writeMarker: {scope: "schema", version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
            done: 1000000
            report:
              owners:
                - {owner: null, results: [{spec: "Range index", created: {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}}, {spec: "Uniqueness constraint", created: {kind: "UNIQUENESS_CONSTRAINT", label: "Person", properties: ["email"]}}], marker: {version: "v1", items: "RANGE_INDEX:Person:name:Person_name_range\nUNIQUENESS_CONSTRAINT:Person:email:Person_email_unique"}}
              log:
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on _DrivineSchema[scope]"]
                - ["INFO", "SchemaManager", "Applying schema for owner 'schema' on 'default': 2 items (forceRecreate=false, versionChanged=false, version=v1)"]
                - ["INFO", "IndexManager", "Created {engine} RANGE_INDEX on Person[name]"]
                - ["INFO", "ConstraintManager", "Created {engine} UNIQUENESS_CONSTRAINT on Person[email]"]
                - ["INFO", "SchemaManager", "Schema for owner 'schema' on 'default': 2 created, 0 already matching, 0 recreated, 0 needing attention"]
          - stores: ["falkordb"]
            rounds:
              - now: 1000000
                actions:
                  - {query: {marker: "read.version", scope: "schema"}, rows: []}
                  - {query: {marker: "read.items", scope: "schema"}, rows: []}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: []}
                  - {query: {listing: "constraints"}, items: []}
              - now: 1000000
                actions:
                  - {execute: {marker: "deleteAllButNewest", scope: "schema"}}
                  - {execute: {statement: "CREATE INDEX FOR (n:_DrivineSchema) ON (n.scope)"}}
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "_DrivineSchema", properties: ["scope"], status: "OPERATIONAL"}]}
              - now: 1000000
                actions:
                  - {execute: {marker: "constraint"}}
                  - {query: {listing: "constraints"}, items: [{kind: "UNIQUENESS_CONSTRAINT", label: "_DrivineSchema", properties: ["scope"], status: "OPERATIONAL"}]}
              - now: 1000000
                actions:
                  - {query: {listing: "indexes.RANGE_INDEX"}, items: [{kind: "RANGE_INDEX", label: "_DrivineSchema", properties: ["scope"], status: "OPERATIONAL"}]}
