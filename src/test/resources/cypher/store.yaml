    stores:
      falkordb:
        items:
          - {kind: "RANGE_INDEX", label: "Chunk", properties: ["age"]}
          - {kind: "FULLTEXT_INDEX", label: "Chunk", properties: ["age", "title", "body"]}
        aliases: [[], []]
  - name: "A label's indexes being built, and the older flat options"
