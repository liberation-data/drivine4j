cases:
  - name: "Range index"
    description: "A range index over one property."
    spec: {kind: "RANGE_INDEX", label: "Person", properties: ["name"]}
    stores:
      postgres:
        create:
          - "CREATE INDEX IF NOT EXISTS drivine_ix_Personname_44ce5436 ON drivine_node (((props ->> 'name'))) WHERE labels @> '[\"Person\"]'"
          - |-
            INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
            VALUES ('RANGE_INDEX', 'Person', '["name"]', 'Person_name_range', 'drivine_ix_Personname_44ce5436', '{}')
            ON CONFLICT (kind, label, properties) DO NOTHING
        drop:
          - |-
            DO $forget$
            DECLARE
                v_object text;
                v_others int;
            BEGIN
                SELECT max(object_name) INTO v_object FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]';
                SELECT count(*) INTO v_others FROM drivine_schema WHERE object_name = v_object AND NOT (kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]');
                IF v_object IS NOT NULL AND v_others = 0 THEN
                    -- Written bare, as it was made: Postgres folds the name to lower case either way.
                    EXECUTE 'DROP INDEX IF EXISTS ' || v_object;
                END IF;
                DELETE FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]';
            END
            $forget$
      oracle:
        create:
          - |-
            DECLARE
                e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
                e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
            BEGIN
                FOR attempt IN 1 .. 300 LOOP
                    BEGIN
                        EXECUTE IMMEDIATE 'CREATE INDEX IF NOT EXISTS drivine_ix_name_337a8b ON drivine_node (JSON_VALUE(props, ''$.name''))';
                        EXIT;
                    EXCEPTION
                        WHEN e_exists THEN EXIT;
                        WHEN e_busy THEN
                            IF attempt = 300 THEN RAISE; END IF;
                            DBMS_SESSION.SLEEP(0.1);
                    END;
                END LOOP;
            END;
          - |-
            DECLARE
                v_unique NUMBER;
                e_exists EXCEPTION; PRAGMA EXCEPTION_INIT(e_exists, -955);
                e_busy EXCEPTION; PRAGMA EXCEPTION_INIT(e_busy, -54);
            BEGIN
                SELECT COUNT(*) INTO v_unique FROM drivine_schema u WHERE u.label = 'Person' AND u.properties = '["name"]' AND u.kind = 'UNIQUENESS_CONSTRAINT' AND JSON_VALUE(u.properties, '$.size()' RETURNING NUMBER) = 1 AND EXISTS (SELECT 1 FROM user_indexes q WHERE q.index_name = UPPER(u.object_name));
                IF v_unique = 0 THEN
                    FOR attempt IN 1 .. 300 LOOP
                        BEGIN
                            EXECUTE IMMEDIATE 'CREATE INDEX IF NOT EXISTS drivine_lx_Personname_44ce5436 ON drivine_node n (CASE WHEN JSON_EXISTS(n.labels, ''$[*]?(@ == "Person")'') THEN JSON_VALUE(n.props, ''$.name'') END)';
                            EXIT;
                        EXCEPTION
                            WHEN e_exists THEN EXIT;
                            WHEN e_busy THEN
                                IF attempt = 300 THEN RAISE; END IF;
                                DBMS_SESSION.SLEEP(0.1);
                        END;
                    END LOOP;
                END IF;
            END;
          - |-
            BEGIN
                MERGE INTO drivine_schema c
                USING (SELECT 'RANGE_INDEX' AS kind, 'Person' AS label, '["name"]' AS properties FROM dual) k
                ON (c.kind = k.kind AND c.label = k.label AND c.properties = k.properties)
                WHEN MATCHED THEN UPDATE SET c.details = JSON_MERGEPATCH(c.details, '{"labelled": "drivine_lx_Personname_44ce5436", "unique": null}')
                WHEN NOT MATCHED THEN INSERT (kind, label, properties, name, object_name, details)
                    VALUES (k.kind, k.label, k.properties, 'Person_name_range', 'drivine_ix_name_337a8b', '{"labelled": "drivine_lx_Personname_44ce5436"}');
            EXCEPTION WHEN DUP_VAL_ON_INDEX THEN
                -- Another process recorded it between the MERGE's read and its insert: it is recorded.
                NULL;
            END;
        drop:
          - |-
            DECLARE
                v_object VARCHAR2(128);
                v_labelled VARCHAR2(128);
                v_others NUMBER;
            BEGIN
                SELECT MAX(object_name), MAX(JSON_VALUE(details, '$.labelled')) INTO v_object, v_labelled
                FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]';
                SELECT COUNT(*) INTO v_others FROM drivine_schema WHERE object_name = v_object AND NOT (kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]');
                IF v_labelled IS NOT NULL THEN
                    EXECUTE IMMEDIATE 'DROP INDEX IF EXISTS ' || v_labelled;
                END IF;
                IF v_object IS NOT NULL AND v_others = 0 THEN
                    EXECUTE IMMEDIATE 'DROP INDEX IF EXISTS ' || v_object;
                END IF;
                DELETE FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '["name"]';
                COMMIT;
            END;
      sqlite:
        create:
          - "CREATE INDEX IF NOT EXISTS drivine_ix_Personname_44ce5436 ON drivine_node ((CASE json_type(props, '$.\"name\"') WHEN 'text' THEN props ->> '$.\"name\"' WHEN 'null' THEN NULL ELSE props -> '$.\"name\"' END)) WHERE instr(labels, '\"Person\"') > 0"
          - |-
            INSERT INTO drivine_schema (kind, label, properties, name, object_name, details)
            VALUES ('RANGE_INDEX', 'Person', '["name"]', 'Person_name_range', 'drivine_ix_Personname_44ce5436', '{}')
            ON CONFLICT (kind, label, properties) DO NOTHING
        drop:
          - "DROP INDEX IF EXISTS drivine_ix_Personname_44ce5436"
          - "DELETE FROM drivine_schema WHERE kind = 'RANGE_INDEX' AND label = 'Person' AND properties = '[\"name\"]'"
      neo4j:
        create: ["CREATE INDEX `Person_name_range` IF NOT EXISTS FOR (n:`Person`) ON (n.`name`)"]
        drop: ["DROP INDEX `Person_name_range` IF EXISTS"]
        dropUnnamed:
          error: "Cannot drop index on Person[name]: Neo4j drops indexes by name, but no name is known for this index"
      memgraph: {create: ["CREATE INDEX ON :Person(name)"], drop: ["DROP INDEX ON :Person(name)"]}
      falkordb: {create: ["CREATE INDEX FOR (n:Person) ON (n.name)"], drop: ["DROP INDEX FOR (n:Person) ON (n.name)"]}
    read:
      cypher: "MATCH (n:Person {name: $x}) RETURN n"
      parameters: {x: "Ada"}
      indexedProperties:
        - ["Person", "name"]
      holds:
        postgres: ["(props ->> 'name')", "labels @> '[\"Person\"]'"]
        oracle:
          - "CASE WHEN JSON_EXISTS(n.labels, '$[*]?(@ == \"Person\")') THEN JSON_VALUE(n.props, '$.name') END"
        sqlite:
          - "(CASE json_type(props, '$.\"name\"') WHEN 'text' THEN props ->> '$.\"name\"' WHEN 'null' THEN NULL ELSE props -> '$.\"name\"' END)"
          - "instr(labels, '\"Person\"') > 0"
